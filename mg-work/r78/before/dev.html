  // 整卡可点：选择本地工作目录；选中后解锁「进入研发工作台」
  function bindAwdCard(wrap){
    var frame=wrap.querySelector('.awd-card-frame');
    var btn=wrap.querySelector('.awd-button');
    var btnText=wrap.querySelector('.awd-button-text');
    var dirEl=wrap.querySelector('.awd-divider-text span');
    var lock=false;
    function setLocked(v){
      lock=v;
      if(!btn)return;
      btn.setAttribute('data-locked',v?'true':'false');
      btn.style.background=v?'var(--color-primary-light-2)':'var(--color-primary-6)';
      btn.style.cursor=v?'not-allowed':'pointer';
      btn.style.opacity=v?'0.65':'1';
    }
    function pickDir(){
      var inp=document.createElement('input');
      inp.type='file'; inp.webkitdirectory=true; inp.multiple=true;
      inp.style.cssText='position:fixed;left:-9999px;top:-9999px;';
      document.body.appendChild(inp);
      inp.addEventListener('change',function(){
        var f=inp.files&&inp.files[0];
        var name='';
        if(f&&f.webkitRelativePath)name=f.webkitRelativePath.split('/')[0];
        else if(f&&f.name)name=f.name;
        if(!name)name='已选择工作目录';
        if(dirEl)dirEl.textContent=name;
        if(btnText)btnText.textContent='进入研发工作台';
        setLocked(false);
        inp.remove();
      });
      inp.click();
    }
    // 初始化：按钮为正常可用态（设计稿的淡蓝为沿用旧禁用态，此处按需求改为正常态）
    setLocked(false);
    if(frame){
      frame.setAttribute('role','button');
      frame.setAttribute('tabindex','0');
      frame.setAttribute('aria-label','选择本地文件夹作为工作目录');
      frame.addEventListener('click',pickDir);
      frame.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();pickDir();}
      });
    }
    if(btn){
      btn.addEventListener('click',function(){
        if(lock)return;
        location.href='kanban.html';
      });
    }
  }
  function inject(){
    var main=document.querySelector('main');
    if(!main||main.querySelector('.awd-stage'))return false;
    var wrap=document.createElement('div');
    wrap.className='awd-stage';
    wrap.innerHTML=AWD_HTML;
    main.appendChild(wrap);
    bindAwdCard(wrap);
    return true;
  }
  if(!inject()){
    var mo=new MutationObserver(function(){if(inject())mo.disconnect();});
    mo.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
    <!-- SHELL-TABS-FIX v4 —— 顶栏「工作台切换」页签可点击 + 高亮纠偏（公共模块修复，勿手改此块） -->
<script>
      /* 背景：顶栏页签是外壳的公共模块，外壳自己的导航函数是：
           navigate(route){ if (protocol === 'file:') { location.href = 路由映射[route] }
                            else { location.hash = '#/route' } }
         也就是说**只有用 file:// 直接打开时才真的跳页**；用本地服务器（http://）打开时
         只改 hash，而外壳没有 hashchange 监听 → 点页签不跳转、也不重渲染，表现为「点了没反应」。
         实测 9 个页面（base/dev/kanban/req-kanban/task-detail/avatar/automation/skills/settings）全部如此。

         修复：在 document 捕获阶段接管点击（早于 React 的根监听，且不依赖 React 是否已挂载），
         按外壳自己的 route → 文件名映射直接跳转。stopPropagation 顺带阻止外壳自己那个
         「只改 hash」的 onClick，避免出现 `base.html#/dev` 这种半吊子状态。

         「当前分组」判定：优先用 DOM（aria-selected="true" 的页签），但**必须与实际文件名自洽** ——
         dev.html 上外壳把「基础工作台」标成了选中态（第 10 轮遗留的高亮错位），若只信 DOM，
         该页两个页签都会变成空操作。故：DOM 与文件一致才采信 DOM，否则回落到文件名分组。 */
      (function () {
        var FILE = { base: 'base.html', dev: 'dev.html' };
        var DEV_PAGES = { 'dev.html': 1, 'kanban.html': 1, 'req-kanban.html': 1, 'task-detail.html': 1 };
        var here = location.pathname.split('/').pop() || '';
        var fileGroup = DEV_PAGES[here] ? 'dev' : 'base';
        function groupOf() {
          var tl = document.querySelector('[role="tablist"][aria-label="工作台切换"]');
          var cur = tl && tl.querySelector('[data-tab][aria-selected="true"]');
          var dom = cur && cur.getAttribute('data-tab');
          if (dom && FILE[dom] === here) return dom;
          return fileGroup;
        }
        document.addEventListener('click', function (e) {
          var t = e.target;
          var btn = t && t.closest ? t.closest('[role="tablist"][aria-label="工作台切换"] [data-tab]') : null;
          if (!btn) return;
          e.preventDefault();
          e.stopPropagation();
          var n = btn.getAttribute('data-tab');
          if (!n || n === groupOf() || !FILE[n]) return;
          location.href = FILE[n];
        }, true);

        /* 高亮纠偏：dev.html 上外壳把 activeTab 算成了「基础工作台」（第 10 轮遗留），
           页签高亮与实际页面自相矛盾（实测该页 DOM 与 base.html 完全一致）。
           仅在「DOM 分组 ≠ 文件分组」时纠偏 —— 实测 9 页里只有 dev.html 命中，其余是空操作。
           形态与外挂一致：选中项 = 图标 + 完整文案，未选中项 = 去掉图标 + 前 2 字。
           图标直接从「原选中项」搬过来，不硬编码路径。 */
        var LABEL = { base: '基础工作台', dev: '研发工作台' };
        function setText(btn, text) {
          for (var i = btn.childNodes.length - 1; i >= 0; i--) {
            if (btn.childNodes[i].nodeType === 3) btn.removeChild(btn.childNodes[i]);
          }
          btn.appendChild(document.createTextNode(text));
        }
        function reconcile() {
          var tl = document.querySelector('[role="tablist"][aria-label="工作台切换"]');
          if (!tl) return false;
          var btns = tl.querySelectorAll('[data-tab]');
          if (!btns.length) return false;
          var cur = tl.querySelector('[data-tab][aria-selected="true"]');
          var dom = cur && cur.getAttribute('data-tab');
          if (dom === fileGroup) return true;
          var iconEl = cur && cur.querySelector('svg');
          var icon = iconEl ? iconEl.outerHTML : '';
          [].forEach.call(btns, function (b) {
            var k = b.getAttribute('data-tab'), want = (k === fileGroup), s = b.querySelector('svg');
            b.setAttribute('aria-selected', want ? 'true' : 'false');
            if (s) b.removeChild(s);
            if (want) {
              if (icon) b.insertAdjacentHTML('afterbegin', icon);
              setText(b, LABEL[k] || k);
            } else {
              setText(b, (LABEL[k] || k).slice(0, 2));
            }
          });
          return true;
        }
        if (!reconcile()) {
          var lo = new MutationObserver(function () { if (reconcile()) lo.disconnect(); });
          lo.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>

         背景：外壳 navigate() 在 http 下只改 hash 且无 hashchange 监听 → 侧栏「数字分身/自动化/技能/设置」、

    <script>
      (function () {
        var ROUTE = { '/': 'base.html', '/base': 'base.html', '/dev': 'dev.html', '/kanban': 'kanban.html',
                      '/req-kanban': 'req-kanban.html', '/task-detail': 'task-detail.html', '/avatar': 'avatar.html',
                      '/automation': 'automation.html', '/skills': 'skills.html', '/settings': 'settings.html' };
        var here = location.pathname.split('/').pop() || '';
        function go() {
          var r = location.hash.replace(/^#/, '').split('?')[0];
          if (!r) return;
          if (r.charAt(0) !== '/') r = '/' + r;
          var f = ROUTE[r];
          if (f && f !== here) location.replace(f);

        window.addEventListener('hashchange', go);

<script id="r73-tab-relay">
/* SHELL-TAB-RELAY v1 —— 顶栏页签「跨页接力滑动」（勿手改此块）
   出发页记下滑块的渲染位置 → 到达页先用 translate 摆回旧位置、再滑到目标。
   用 translate 叠加而非改 left/width：本仓库 task-detail 的滑块位置被一条
   !important 规则钉死，内联 left/width 写不动它，translate 不在其管辖范围内。 */
(function () {
  var KEY = "r73-tab-relay";
  var TLS = '[role="tablist"][aria-label="工作台切换"]';
  var SPRING = "cubic-bezier(.34,1.56,.64,1)";
  var TRANS = "left .2s " + SPRING + ", width .2s " + SPRING + ", translate .2s " + SPRING;
  var TTL = 10000;

  function pick() {
    var tl = document.querySelector(TLS);
    if (!tl) return null;
    var sp = tl.querySelector("span[aria-hidden]");
    var cur = tl.querySelector('[data-tab][aria-selected="true"]');
    if (!sp || !cur) return null;
    return { tl: tl, sp: sp, key: cur.getAttribute("data-tab") };
  }

  /* ---------- A. 出发页：记下滑块的**渲染**几何 ---------- */
  window.addEventListener("click", function (e) {
    var t = e.target;
    var btn = t && t.closest ? t.closest(TLS + " [data-tab]") : null;
    if (!btn) return;
    var o = pick();
    if (!o) return;
    if (btn.getAttribute("data-tab") === o.key) return; /* 点的是当前页签：不记 */
    var r = o.sp.getBoundingClientRect();
    if (!(r.width > 0)) return;
    try {
      sessionStorage.setItem(KEY, JSON.stringify({
        from: o.key, left: r.left, width: r.width, t: Date.now()
      }));
    } catch (err) { /* 存储不可用则静默：退化为无接力 */ }
  }, true);

  /* ---------- B. 到达页：摆回出发位置，再滑到目标 ---------- */
  var from = null;
  try {
    var raw = sessionStorage.getItem(KEY);
    if (raw) { sessionStorage.removeItem(KEY); from = JSON.parse(raw); }
  } catch (e) { from = null; }
  if (from && (!(from.width > 0) || Date.now() - from.t > TTL)) from = null;
  if (!from) return;

  var booted = false;
  function boot() {
    if (booted) return true;
    var o = pick();
    if (!o) return false;
    booted = true;
    if (o.key === from.from) return true;          /* 刷新 / 点的就是当前页签：不接力 */
    var now = o.sp.getBoundingClientRect();
    if (!(now.width > 0)) return true;
    var dx = Math.round((from.left - now.left) * 100) / 100;
    if (Math.abs(dx) < 1) return true;             /* 位置一样：无位移可演 */

    o.sp.style.transition = "none";
    o.sp.style.translate = dx + "px 0px";          /* ① 摆到出发页签的位置（不带动画）*/
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        o.sp.style.transition = TRANS;             /* ② 交还过渡 */
        o.sp.style.translate = "0px 0px";          /*    并滑回自己的目标位 */
      });
    });
    return true;
  }

  /* 外壳是 React 异步挂载：先直接试，未就绪则等滑块出现 */
  function schedule() {
    requestAnimationFrame(function () {
      if (boot()) return;
      var mo = new MutationObserver(function () { if (boot()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
})();
</script>
