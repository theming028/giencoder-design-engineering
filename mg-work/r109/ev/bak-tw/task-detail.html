    var step = 1;
    /* 初始勾选态快照（产物默认全选、成员默认未选）→ 每次打开复位，避免残留上一轮选择 */
    var allBoxes = [].slice.call(root.querySelectorAll('.giencoder-checkbox-input'));
    var defaults = allBoxes.map(function (b) { return b.checked; });
    function resetChecks() {
      allBoxes.forEach(function (b, i) { b.checked = defaults[i]; });
    }

    function boxes(pane) {
      return [].slice.call(root.querySelectorAll('[data-td-pane="' + pane + '"] .giencoder-checkbox-input'));
    }
    function checked(n) { return boxes(n).filter(function (c) { return c.checked; }).length; }
    function countText() {
      return step === 1
        ? '已选 ' + checked(1) + '/' + boxes(1).length + ' 个产物'
        : '已选 ' + checked(2) + '/' + mrows.length + ' 位协作者';
    }
    function syncCount() { countEl.textContent = countText(); }

    function filter() {
      var q = (searchEl.value || '').replace(/\s+/g, '').toLowerCase();
      mrows.forEach(function (r) {
        var t = r.textContent.replace(/\s+/g, '').toLowerCase();
        r.hidden = !!q && t.indexOf(q) < 0;
      });
    }

    function goStep(n) {
      step = n;
      panes.forEach(function (p) { p.hidden = (+p.getAttribute('data-td-pane')) !== n; });
      stepEls.forEach(function (s) {
        var k = +s.getAttribute('data-td-step');
        s.classList.toggle('is-active', k === n);
        s.classList.toggle('is-finish', k < n);
        if (k === n) s.setAttribute('aria-current', 'step'); else s.removeAttribute('aria-current');
      });
      btnNext.hidden = n !== 1;
      btnPrev.hidden = n !== 2;
      btnSubmit.hidden = n !== 2;
      hintEl.textContent = HINTS[n];
      syncCount();
    }

    function flag(on) { document.documentElement.toggleAttribute('data-td-coop-open', on); }

    function open() {
      resetChecks();
      goStep(1);
      searchEl.value = '';
      filter();
      root.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      flag(true);
      void root.offsetWidth;   /* 强制 reflow，保证 is-open 的过渡真正触发 */
      root.classList.add('is-open');
      dialog.focus();
    }

    function close() {
      if (root.hidden) return;
      root.classList.remove('is-open');
      root.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
      flag(false);
    }

    function submit() {
      var n = checked(1);
      var m = mrows.filter(function (r) { return r.querySelector('.giencoder-checkbox-input').checked; });
      close();
      tdToast('已流转 ' + n + ' 个产物给 ' + m.length + ' 位协作者');
    }

    btn.addEventListener('click', function () { if (root.hidden) open(); else close(); });
    root.querySelector('[data-td-coop-close]').addEventListener('click', close);
    root.querySelector('[data-td-coop-cancel]').addEventListener('click', close);
    maskEl.addEventListener('click', close);
    btnNext.addEventListener('click', function () { goStep(2); });
    btnPrev.addEventListener('click', function () { goStep(1); });
    btnSubmit.addEventListener('click', submit);
    searchEl.addEventListener('input', filter);
    /* 点步骤条跳转（steps.json variants.clickable） */
    stepEls.forEach(function (s) {
      s.addEventListener('click', function () {
        var k = +s.getAttribute('data-td-step');
        if (k !== step) goStep(k);
      });
    });
    /* 搜索框里按 Esc：页尾 Esc 链对 INPUT 直接 return → 弹窗内自行处理 */
    root.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    /* 勾选框变化 → 计数实时更新（change 冒泡到根节点） */
    root.addEventListener('change', function (e) {
      if (e.target && e.target.classList && e.target.classList.contains('giencoder-checkbox-input')) syncCount();
    });
    document.addEventListener('td:close-coop', close);
  }

  /* ---------- 顶栏「编辑」→ 任务编辑弹窗（★ 第 33 轮第 4 项） ----------
     与看板「创建任务」弹窗是**同一个弹窗**：DOM + CSS 在构建期从 pages/kanban.html 原样抽取
     （见文件末尾「KANBAN_CRT 抽取」段），Select / DatePicker 交互也直接复用看板的
     bindComponents（构建期从看板抽取，见下一行的占位替换）。
     本函数只负责「编辑态」的三件事：
       ① 文案切换：标题「编辑工作任务」/ 主按钮「保存」/ 隐藏「保存并继续创建」
       ② 打开时用当前任务数据预填（任务类型 / 标题 / 描述 / 6 个属性字段 / 预期完成）
       ③ 开合与关闭途径：取消 / 右上 X / 点遮罩 / Esc / 保存（必填校验走 DS Message） */
  function bindComponents(root) {
    function $(s, r) { return (r || document).querySelector(s); }
    function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    /* 浮窗互斥：打开一个下拉前，收起页面内其他下拉浮窗 */
    function closeOtherPopups(except) {
      $$('.giencoder-select-popup').forEach(function (p) {
        if (p === except) return;
        p.classList.remove('giencoder-popup-open'); p.style.display = 'none';
      });
      $$('.giencoder-date-picker-popup').forEach(function (p) {
        if (p === except) return;
        p.classList.remove('giencoder-panel-open'); p.style.display = 'none';
      });
    }

    /* ---- Select：展开/收起、选项互斥、清除、外部点击收起 ---- */
    $$('.giencoder-select', root).forEach(function (sel) {
      if (sel.classList.contains('giencoder-select-disabled') || sel._bound) return;
      var view = $('.giencoder-select-view', sel);
      var popup = $('.giencoder-select-popup', sel);
      /* r13: 先确认结构完整再打 _bound —— 否则缺浮层的选择器被永久标记为已绑定，后续补上浮层也不会再绑 */
      if (!view || !popup) return;
      sel._bound = true;
      var options = $$('.giencoder-select-option', popup);
      var textEl = $('.giencoder-select-view-text', view);
      var clearBtn = $('.giencoder-select-clear', sel);
      var placeholder = textEl ? (textEl.getAttribute('data-placeholder') || '') : '';

      function open() {
        closeOtherPopups(popup);
        popup.style.display = '';
        requestAnimationFrame(function () { if (popup.isConnected) popup.classList.add('giencoder-popup-open'); });
        view.setAttribute('aria-expanded', 'true');
      }
      function close() {
        popup.classList.remove('giencoder-popup-open');
        setTimeout(function () {
          if (popup.isConnected && !popup.classList.contains('giencoder-popup-open')) popup.style.display = 'none';
        }, 200);
        view.setAttribute('aria-expanded', 'false');
      }
      function isOpen() { return popup.classList.contains('giencoder-popup-open'); }

      view.addEventListener('click', function (ev) { ev.stopPropagation(); isOpen() ? close() : open(); });
      view.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); isOpen() ? close() : open(); }
        if (ev.key === 'Escape') close();
      });
      options.forEach(function (opt) {
        opt.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (opt.classList.contains('giencoder-select-option-disabled')) return;
          options.forEach(function (o) { o.classList.remove('giencoder-select-option-selected'); o.setAttribute('aria-selected', 'false'); });
          opt.classList.add('giencoder-select-option-selected');
          opt.setAttribute('aria-selected', 'true');
          if (textEl) textEl.textContent = opt.textContent;
          sel.classList.add('giencoder-select-has-value');
          close();
        });
      });
      if (clearBtn) {
        clearBtn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          options.forEach(function (o) { o.classList.remove('giencoder-select-option-selected'); o.setAttribute('aria-selected', 'false'); });
          if (textEl) textEl.textContent = placeholder;
          sel.classList.remove('giencoder-select-has-value');
          close();
        });
      }
    });

    /* ---- DatePicker(range)：展开/收起、范围两击选择、月份导航、外部收起 ---- */
    $$('.giencoder-date-picker', root).forEach(function (picker) {
      if (picker._bound) return;
      var trigger = $('.giencoder-input-wrapper', picker);
      var popup = $('.giencoder-date-picker-popup', picker);
      var input = trigger ? $('.giencoder-input', trigger) : null;
      /* r13: 同上 */
      if (!trigger || !popup || !input) return;
      picker._bound = true;

      var isRange = picker.getAttribute('data-variant') === 'range';
      var range = { start: null, end: null };

      function setOpen(open) {
        trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) {
          closeOtherPopups(popup);
          popup.style.display = 'block';
          requestAnimationFrame(function () { if (popup.isConnected) popup.classList.add('giencoder-panel-open'); });
        } else {
          popup.classList.remove('giencoder-panel-open');
          setTimeout(function () {
            if (popup.isConnected && !popup.classList.contains('giencoder-panel-open')) popup.style.display = 'none';
          }, 200);
        }
      }
      trigger.addEventListener('click', function (ev) {
        ev.stopPropagation();
        setOpen(!popup.classList.contains('giencoder-panel-open'));
      });
      trigger.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') setOpen(false);
      });

      /* 月份导航：标题加减一月，range 变体第二面板联动 +1 月 */
      $$('.giencoder-calendar-nav', picker).forEach(function (nav) {
        nav.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var back = nav.getAttribute('aria-label') === '上个月';
          var delta = back ? -1 : 1;
          var cals = $$('.giencoder-calendar', picker);
          cals.forEach(function (cal, idx) {
            var title = $('.giencoder-calendar-title', cal);
            if (!title) return;
            var m = title.textContent.match(/(\d{4})年(\d{1,2})月/);
            if (!m) return;
            var y = +m[1], mo = +m[2] + delta * (isRange && idx === 1 ? 1 : 1);
            if (isRange) { /* 双面板保持相差一个月：统一按左面板推进 */ }
            if (mo < 1) { mo = 12; y -= 1; }
            if (mo > 12) { mo = 1; y += 1; }
            title.textContent = y + '年' + mo + '月';
          });
          if (isRange && cals.length > 1) {
            /* 右面板 = 左面板 + 1 月 */
            var lt = $('.giencoder-calendar-title', cals[0]).textContent.match(/(\d{4})年(\d{1,2})月/);
            var y = +lt[1], mo = +lt[2] + 1;
            if (mo > 12) { mo = 1; y += 1; }
            $('.giencoder-calendar-title', cals[1]).textContent = y + '年' + mo + '月';
          }
        });
      });

      /* 日期格点击：range 两击起止 / single 互斥选中；跨月与空格忽略 */
      $$('.giencoder-calendar-cell', picker).forEach(function (cell) {
        if (cell.classList.contains('giencoder-calendar-cell-empty')) return;
        cell.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (cell.classList.contains('giencoder-calendar-cell-other')) return;
          var day = parseInt(cell.textContent, 10);
          if (isNaN(day)) return;
          var cal = cell.closest('.giencoder-calendar');
          var title = cal ? $('.giencoder-calendar-title', cal) : null;
          var m = title ? title.textContent.match(/(\d{4})年(\d{1,2})月/) : null;
          var date = (m ? +m[1] : 2026) + '/' + pad2(m ? +m[2] : 8) + '/' + pad2(day);

          if (isRange) {
            if (!range.start || (range.start && range.end)) { range.start = date; range.end = null; }
            else { range.end = date; }
            input.value = range.end ? range.start + ' - ' + range.end : range.start;
            if (range.start && range.end) setOpen(false);
            return;
          }
          $$('.giencoder-calendar-cell', picker).forEach(function (c) { c.classList.remove('giencoder-calendar-cell-selected'); });
          cell.classList.add('giencoder-calendar-cell-selected');
          input.value = date;
          setOpen(false);
        });
      });
    });
  }
  /* ★ 第 59 轮：标题栏「更多操作」按钮 → 下方下拉菜单
     设计稿：MasterGo 966:35630（dropdown-menu），量测数据见上方 .td-more 样式块注释。
     结构按 DS Dropdown 契约（components/dropdown.json，trigger=click 变体）组装：
       div.giencoder-dropdown-popup.td-more[role=menu]
         └ div.giencoder-dropdown-item[role=menuitem] > span.td-more-ico + span.td-more-label
     开合状态类复用 .giencoder-popup-open（与 r54 右键菜单 / Select / Popover 同一套参数）。
     关闭途径：选中任一项 / 点菜单外 / 右键 / 页面滚轮 / 窗口缩放或失焦 / Esc
              （Esc 走页尾 Esc 链：html 根上的 data-td-pop-open → td:close-popovers）。
     键盘（契约 keyboard 清单）：↑↓ 移动虚拟焦点 · Enter 选中 · Esc 关闭并归还焦点到触发器。 */
  /* ★ 第 65 轮：「取消任务 / 终止任务」模态弹窗
     两稿共用一套骨架，只有标题/说明/分隔文案/确认按钮文案不同。
     行为对齐 DS modal 契约：role=dialog + aria-modal、遮罩点击关闭、Esc 关闭、
     焦点锁在弹窗内（Tab 循环）、打开时锁定 body 滚动、关闭后焦点归还触发按钮。 */
  var tdTaskModal = null;
  function bindTaskModals() {
    var CFG = {
      cancel: {
        title: '取消任务',
        desc: '任务取消后将被标记为“已取消”状态，历史信息与本次原因会保留。',
        sep: '取消原因',
        note: '取消原因将被写入任务动态，保存后不可删除。',
        ok: '确定取消',
        done: '已取消任务：'
      },
      stop: {
        title: '终止任务',
        desc: '任务终止后将被标记为“已终止”状态，请说明停止推进的原因。',
        sep: '终止原因',
        note: '终止原因将被写入任务动态，保存后不可删除。',
        ok: '确定终止',
        done: '已终止任务：'
      }
    };
    /* 与 r59 下拉菜单同一套图标口径（viewBox 24 + stroke 2.2 放进 16px 框），
       端点 5.7..18.3 使 X 墨迹 ≈10px，与设计稿一致。 */
    var X_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5.7 5.7 18.3 18.3"/><path d="M18.3 5.7 5.7 18.3"/></svg>';
    var boxes = {}, cur = null, back = null;

    function build(key) {
      var c = CFG[key];
      var root = document.createElement('div');
      root.className = 'td-modal';
      root.hidden = true;
      root.setAttribute('data-td-modal', key);
      root.innerHTML =
        '<div class="td-modal-mask"></div>' +
        '<div class="td-modal-panel" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="td-modal-t-' + key + '">' +
          '<div class="td-modal-head">' +
            '<h2 class="td-modal-title" id="td-modal-t-' + key + '">' + c.title + '</h2>' +
            '<button class="td-modal-close" type="button" aria-label="关闭">' + X_SVG + '</button>' +
          '</div>' +
          '<p class="td-modal-desc">' + c.desc + '</p>' +
          '<div class="td-modal-task">' +
            '<span class="td-modal-task-lbl">当前任务</span>' +
            '<p class="td-modal-task-tx"></p>' +
          '</div>' +
          '<div class="td-modal-sep"><span>' + c.sep + '</span></div>' +
          '<textarea class="td-modal-input" placeholder="请输入" aria-label="' + c.sep + '"></textarea>' +
          '<p class="td-modal-note">' + c.note + '</p>' +
          '<div class="td-modal-foot">' +
            '<button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default td-modal-no" type="button">取消</button>' +
            '<button class="giencoder-btn giencoder-btn-danger giencoder-btn-size-default td-modal-yes" type="button">' + c.ok + '</button>' +
          '</div>' +
        '</div>';
      root._panel = root.querySelector('.td-modal-panel');
      root._input = root.querySelector('.td-modal-input');
      root._tx = root.querySelector('.td-modal-task-tx');
      root._mask = root.querySelector('.td-modal-mask');
      root._close = root.querySelector('.td-modal-close');
      root._yes = root.querySelector('.td-modal-yes');
      root._no = root.querySelector('.td-modal-no');
      document.body.appendChild(root);

      root._mask.addEventListener('click', close);
      root._close.addEventListener('click', close);
      root._no.addEventListener('click', close);
      root._yes.addEventListener('click', confirm);
      root.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        var list = Array.prototype.filter.call(
          root._panel.querySelectorAll('button, textarea, [href], [tabindex]:not([tabindex="-1"])'),
          function (el) { return !el.disabled && el.offsetParent !== null; });
        if (!list.length) return;
        var first = list[0], last = list[list.length - 1], act = document.activeElement;
        if (e.shiftKey && (act === first || act === root._panel)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus(); }
      });
      return root;
    }

    function open(key, trigger) {
      if (cur || !CFG[key]) return;
      var root = boxes[key] || (boxes[key] = build(key));
      var t = document.querySelector('.td-title');
      root._tx.textContent = (t && t.textContent ? t.textContent : '当前任务').trim() || '当前任务';
      root._input.value = '';
      /* 触发按钮显式传入：更多菜单的 run() 会先 close() 菜单，此时 activeElement 已不是触发按钮 */
      back = trigger || document.querySelector('[data-td-more]') || document.activeElement;
      cur = { key: key, root: root };

      root.hidden = false;
      void root.offsetHeight;                 /* 先落定初始样式，再加类才有过渡 */
      root.classList.add('is-open');
      document.documentElement.classList.add('td-modal-lock');
      try { root._panel.focus({ preventScroll: true }); } catch (e) {}
      setTimeout(function () { if (cur && cur.root === root) { try { root._input.focus(); } catch (e) {} } }, 190);
    }

    function close() {
      if (!cur) return;
      var root = cur.root;
      cur = null;
      root.classList.remove('is-open');
      document.documentElement.classList.remove('td-modal-lock');
      setTimeout(function () { if (!cur) root.hidden = true; }, 220);
      var b = back; back = null;
      if (b && b.focus) { try { b.focus({ preventScroll: true }); } catch (e) {} }
    }

    function confirm() {
      if (!cur) return;
      var c = CFG[cur.key];
      var t = document.querySelector('.td-title');
      var name = (t && t.textContent ? t.textContent : '当前任务').trim() || '当前任务';
      var reason = cur.root._input.value.trim();
      close();
      tdToast(c.done + name + (reason ? '（原因：' + reason + '）' : ''));
    }

    /* Esc：捕获段最优先，关完就 stopPropagation，避免页尾 Esc 链继续处理其它浮层 */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || !cur) return;
      e.preventDefault();
      e.stopPropagation();
      close();
    }, true);

    tdTaskModal = { open: open, close: close, isOpen: function () { return !!cur; } };
  }

  function bindMoreMenu() {
    var btn = document.querySelector('[data-td-more]');
    if (!btn || btn.getAttribute('data-td-more-bound') === '1') return;
    btn.setAttribute('data-td-more-bound', '1');
    if (!btn.getAttribute('title')) btn.setAttribute('title', '更多操作');

    var ICONS = {
      /* 终止任务：圆圈 + 实心方块。24 viewBox + stroke 2.2。
         r59 定稿 16px 框（笔画 1.47px / 墨迹 14px，与设计稿 2× 量测吻合）；
         ★ r61 按要求「小两号」→ 12px 框（笔画 1.10px / 墨迹 10.5px），几何比例不变。 */
      stop: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.4"/><rect x="8.25" y="8.25" width="7.5" height="7.5" rx="0.6" fill="currentColor" stroke="none"/></svg>',
      /* 取消任务：圆圈 + 叉（设计稿叉臂实测 ≈6px ⇒ 24 viewBox 里 ±4.2）；

      cancel: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.4"/><path d="M7.8 7.8 16.2 16.2"/><path d="M16.2 7.8 7.8 16.2"/></svg>'
    };
    var ITEMS = [
      { id: 'stop',   label: '终止任务', svg: ICONS.stop },
      /* ★ 第 61 轮：取消任务 = 危险项 → hover 时底色/文字/图标转红色系 */
      { id: 'cancel', label: '取消任务', svg: ICONS.cancel, danger: true }
    ];

    var menu = null, rows = [], open = false, cur = -1;

    function build() {
      var box = document.createElement('div');
      box.className = 'giencoder-dropdown-popup td-more';
      box.id = 'td-more-menu';
      box.setAttribute('role', 'menu');
      ITEMS.forEach(function (it) {
        var row = document.createElement('div');
        row.className = 'giencoder-dropdown-item' + (it.danger ? ' is-danger' : '');
        row.setAttribute('role', 'menuitem');
        row.setAttribute('tabindex', '-1');
        row.setAttribute('data-more-id', it.id);
        row.innerHTML = '<span class="td-more-ico" aria-hidden="true">' + it.svg + '</span>' +
                        '<span class="td-more-label"></span>';
        row.querySelector('.td-more-label').textContent = it.label;
        box.appendChild(row);
      });
      return box;
    }

    function ensure() {
      if (menu) return;
      menu = build();
      menu.style.display = 'none';
      document.body.appendChild(menu);
      rows = Array.prototype.slice.call(menu.querySelectorAll('.giencoder-dropdown-item'));
      menu.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      menu.addEventListener('click', function (e) {
        var row = e.target && e.target.closest ? e.target.closest('.giencoder-dropdown-item') : null;
        if (row) run(row.getAttribute('data-more-id'));
      });
    }

    /* 契约：弹层贴在触发器下方 4px，左对齐；越界向另一侧翻 */
    function place() {
      var r = btn.getBoundingClientRect();
      menu.style.display = 'flex';
      menu.style.visibility = 'hidden';
      var w = menu.offsetWidth, h = menu.offsetHeight;
      var left = r.left, top = r.bottom + 4;
      if (left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - 8 - w);
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 4 - h);
      menu.style.left = Math.round(left) + 'px';
      menu.style.top = Math.round(top) + 'px';
      menu.style.visibility = '';
    }

    function flag(on) { document.documentElement.toggleAttribute('data-td-pop-open', on); }

    function show() {
      ensure();
      /* 与同页其它弹层互斥：先派发关闭信号（此刻 open 仍为 false，本监听会自行让位） */
      document.dispatchEvent(new CustomEvent('td:close-ctx'));
      document.dispatchEvent(new CustomEvent('td:close-popovers'));
      place();
      void menu.offsetHeight;                 /* 强制回流，让开合过渡生效 */
      menu.classList.add('giencoder-popup-open');
      open = true; cur = -1;
      rows.forEach(function (r) { r.classList.remove('is-hover'); });
      btn.setAttribute('aria-expanded', 'true');
      flag(true);
    }

    function close() {
      if (!open) return;
      open = false; cur = -1;
      menu.classList.remove('giencoder-popup-open');
      rows.forEach(function (r) { r.classList.remove('is-hover'); });
      btn.setAttribute('aria-expanded', 'false');
      setTimeout(function () { if (!open && menu) menu.style.display = 'none'; }, 200);
      flag(false);
    }

    function focusRow(i) {
      if (!rows.length) return;
      cur = (i + rows.length) % rows.length;
      rows.forEach(function (r, k) { r.classList.toggle('is-hover', k === cur); });
    }

    /* 结果回执一律走 DS Message（第 19 轮全局约定），不另造提示 */
    function run(id) {
      /* ★ 第 65 轮：选中「终止任务 / 取消任务」后不再直接弹提示，
         改为先收起菜单、再打开对应的模态弹窗（设计稿 1350:18236 / 1350:18230）。
         弹窗确认后才写提示，文案与 r59 保持一致。 */
      close();
      if (tdTaskModal) tdTaskModal.open(id, btn);
    }

    btn.addEventListener('click', function () { if (open) close(); else show(); });

    /* ---- 关闭途径（契约 clickOutsideClose / escClose） ---- */
    document.addEventListener('pointerdown', function (e) {
      if (!open) return;
      if (menu.contains(e.target) || btn.contains(e.target)) return;
      close();
    }, true);
    document.addEventListener('contextmenu', function () { if (open) close(); });
    document.addEventListener('wheel', function () { if (open) close(); }, { passive: true });
    document.addEventListener('td:close-popovers', close);
    document.addEventListener('td:close-ctx', close);
    window.addEventListener('blur', close);
    window.addEventListener('resize', close);

    /* ---- 键盘（契约 keyboard 清单） ----
       Esc 走**捕获段**：页面尾部的 Esc 链注册更早、且在冒泡段读根上的 data-td-pop-open
       再自己派发 td:close-popovers —— 那段已经会收菜单，但不会归还焦点。这里在捕获段
       先一步收掉并 stopPropagation，避免链继续往下跑（既归还焦点，也不会误跳回看板）。 */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || !open) return;
      e.preventDefault();
      e.stopPropagation();
      close();
      btn.focus();
    }, true);
    btn.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;   /* Enter/Space 走原生 click */
      e.preventDefault();
      if (!open) show();
      focusRow(e.key === 'ArrowDown' ? 0 : rows.length - 1);
    });
    document.addEventListener('keydown', function (e) {
      if (!open || e.key === 'Escape') return;
      if (e.key === 'ArrowDown') { e.preventDefault(); focusRow(cur + 1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); focusRow(cur - 1); return; }
      if (e.key === 'Home') { e.preventDefault(); focusRow(0); return; }
      if (e.key === 'End') { e.preventDefault(); focusRow(rows.length - 1); return; }
      if (e.key === 'Tab') { close(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && cur >= 0) {
        e.preventDefault();
        run(rows[cur].getAttribute('data-more-id'));
      }
    });
  }
  function bindEditTask() {

    var trigger = document.querySelector('[data-td-edit]');
    if (!modal || !trigger || trigger.hasAttribute('data-td-edit-bound')) return;

    }
    bindComponents(modal);

    var dialog = modal.querySelector('.kb-crt-dialog');
    var titleInput = modal.querySelector('.kb-crt-title .giencoder-input');
    var textarea = modal.querySelector('.kb-crt-textarea');
    var dateInput = modal.querySelector('.kb-crt-date-input');

    var EDIT = {

      desc: '作为研发负责人，我需要把「业务方原始需求 → 需求条目 → 任务交付」这条链路一次性初始化，'
          + '以便后续任务可以按状态流转自动推进。\n\n'
          + '第一步：梳理端到端交付链路\n'
          + '第二步：定义状态流转规则（启动整个流程）\n'
          + '第三步：设定交付物标准',

    function fillSelect(row, value) {
      var txt = row.querySelector('.giencoder-select-view-text');
      var opts = row.querySelectorAll('.giencoder-select-option');
      var hit = null;
      for (var j = 0; j < opts.length; j++) {

      if (textarea) textarea.value = EDIT.desc;
      if (dateInput) dateInput.value = EDIT.date;

      var day = String(+EDIT.date.split('/')[2]);
      Array.prototype.forEach.call(modal.querySelectorAll('.giencoder-calendar-cell'), function (c) {
        if (c.classList.contains('giencoder-calendar-cell-selected')) c.classList.remove('giencoder-calendar-cell-selected');
        if (!c.classList.contains('giencoder-calendar-cell-other') && c.textContent.trim() === day) {
          c.classList.add('giencoder-calendar-cell-selected');

    }
    /* 与创建弹窗共用同一 DOM，编辑态只改三处文本 + 收起「保存并继续创建」 */
    function applyEditTexts() {
      var t = modal.querySelector('.giencoder-modal-header .giencoder-modal-title');
      if (t) t.textContent = '编辑工作任务';
      if (dialog) dialog.setAttribute('aria-label', '编辑工作任务');
      var sb = modal.querySelector('[data-crt-submit]');
      if (sb) sb.textContent = '保存';
      modal.classList.add('is-edit');
    }

    function flag(on) { document.documentElement.toggleAttribute('data-td-edit-open', on); }
    function open() {
      if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
      resetPopups(); clearErrs(); applyEditTexts(); fillForm();
      modal.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
      flag(true);

      modal.classList.add('is-open');
      if (dialog) dialog.focus({ preventScroll: true });
    }
    function close() {
      if (modal.hidden) return;
      resetPopups();
      modal.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
      flag(false);
      if (closeTimer) clearTimeout(closeTimer);
      /* 等 200ms 过渡走完再 hidden，否则面板瞬间消失、没有收起动画 */
      closeTimer = setTimeout(function () { closeTimer = null; modal.hidden = true; }, 200);
    }
    /* 保存：必填校验（任务类型 / 任务标题）→ DS Message（结构同看板创建弹窗） */
    function submit() {
      var okType = !!(typeSel && typeSel.classList.contains('giencoder-select-has-value'));
      var okTitle = !!(titleInput && titleInput.value.trim());
      setErr('type', !okType);
      setErr('title', !okTitle);
      if (!okType || !okTitle) return;
      close();
      tdToast('任务已保存');
    }

    trigger.addEventListener('click', function () { if (modal.hidden) open(); else close(); });
    modal.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('[data-crt-close]')) { close(); return; }
      if (t && t.closest && t.closest('.giencoder-select-option')) setErr('type', false);
    });
    var sb = modal.querySelector('[data-crt-submit]');
    if (sb) sb.addEventListener('click', submit);
    if (titleInput) {
      titleInput.addEventListener('input', function () {
        if (titleInput.value.trim()) setErr('title', false);
      });
    }
    /* 焦点在弹窗内（含标题输入框）时按 Esc：页尾 Esc 链对 INPUT 直接 return，这里自行处理 */
    modal.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    document.addEventListener('td:close-edit', close);
  }

  function inject() {
    var main = document.querySelector('main');
    if (!main || main.querySelector('.td-root')) return false;
    var wrap = document.createElement('div');
    wrap.className = 'td-wrap';
    wrap.innerHTML = KB_HTML;
    main.appendChild(wrap);
    bindDetail(wrap);
    bindDescImagePreview(wrap);
    bindDispatchPicker();
    bindCoop();
    bindBrowseContextMenu();
    bindMoreMenu();
    bindTaskModals();
    bindEditTask();
    return true;
  }
  /* 注意：两个动作都要执行，不能短路（页签在 React 挂载后才出现，可能晚于注入）。
     inject() 只在首次真正插入时返回 true，所以这里补一个「已注入」判断，
     否则 ready() 永远返回 false、MutationObserver 永不卸载、每次 DOM 变更都白跑一遍。
     页签点击（第 25 轮第 3 项）改由公共片段 SHELL_TABS 承担，见文件尾部。 */
  function ready() {
    var injected = inject() || !!document.querySelector('.td-root');
    var tabbed = syncShellTab();
    return injected && tabbed;
  }
  if (!ready()) {
    var mo = new MutationObserver(function () { if (ready()) mo.disconnect(); });
    mo.observe(document.body, { childList: true, subtree: true });
  }
})();

  <script>
      /* 详情页：Esc 返回任务看板（全屏态下先退出全屏，第 26 轮第 5 项） */
      document.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Escape') return;
        var tag = (ev.target && ev.target.tagName) || '';
        if (tag === 'TEXTAREA' || tag === 'INPUT') return;
        /* ★ 第 30 轮第 1 项：图片蒙层预览优先级最高 —— 打开时 Esc 只关预览，不继续往下走。
           预览侧监听自定义事件 td:close-image-preview（见 bindDescImagePreview）。 */
        if (document.documentElement.hasAttribute('data-td-img-preview')) {
          document.dispatchEvent(new CustomEvent('td:close-image-preview'));
          return;
        }
        /* ★ 第 33 轮第 4 项：任务编辑弹窗（与看板创建弹窗同一个，层级仅次图片预览）。
           弹窗侧监听自定义事件 td:close-edit（见 bindEditTask）。 */
        if (document.documentElement.hasAttribute('data-td-edit-open')) {
          document.dispatchEvent(new CustomEvent('td:close-edit'));
          return;
        }
        /* ★ 第 32 轮第 5 项：协作模态弹窗次优先（模态层级最高，Esc 只关它）。
           弹窗侧监听自定义事件 td:close-coop（见 bindCoop）。 */
        if (document.documentElement.hasAttribute('data-td-coop-open')) {

  <!-- SHELL-TABS-FIX v4 —— 顶栏「工作台切换」页签可点击 + 高亮纠偏（公共模块修复，勿手改此块） -->
<script>
      /* 背景：顶栏页签是外壳的公共模块，外壳自己的导航函数是：
           navigate(route){ if (protocol === 'file:') { location.href = 路由映射[route] }
                            else { location.hash = '#/route' } }
         也就是说**只有用 file:// 直接打开时才真的跳页**；用本地服务器（http://）打开时
         只改 hash，而外壳没有 hashchange 监听 → 点页签不跳转、也不重渲染，表现为「点了没反应」。
         实测 9 个页面（base/dev/kanban/req-kanban/task-detail/avatar/automation/skills/settings）全部如此。

         修复：在 document 捕获阶段接管点击（早于 React 的根监听，且不依赖 React 是否已挂载），
         按外壳自己的 route → 文件名映射直接跳转。stopPropagation 顺带阻止外壳自己那个
         「只改 hash」的 onClick，避免出现 `base.html#/dev` 这种半吊子状态。

         「当前分组」判定：优先用 DOM（aria-selected="true" 的页签），但**必须与实际文件名自洽** ——
         dev.html 上外壳把「基础工作台」标成了选中态（第 10 轮遗留的高亮错位），若只信 DOM，
         该页两个页签都会变成空操作。故：DOM 与文件一致才采信 DOM，否则回落到文件名分组。 */
      (function () {
        var FILE = { base: 'base.html', dev: 'dev.html' };
        var DEV_PAGES = { 'dev.html': 1, 'kanban.html': 1, 'req-kanban.html': 1, 'task-detail.html': 1 };
        var here = location.pathname.split('/').pop() || '';
        var fileGroup = DEV_PAGES[here] ? 'dev' : 'base';
        function groupOf() {
          var tl = document.querySelector('[role="tablist"][aria-label="工作台切换"]');
          var cur = tl && tl.querySelector('[data-tab][aria-selected="true"]');
          var dom = cur && cur.getAttribute('data-tab');
          if (dom && FILE[dom] === here) return dom;

        document.addEventListener('click', function (e) {

          if (!btn) return;

           页签高亮与实际页面自相矛盾（实测该页 DOM 与 base.html 完全一致）。
           仅在「DOM 分组 ≠ 文件分组」时纠偏 —— 实测 9 页里只有 dev.html 命中，其余是空操作。
           形态与外挂一致：选中项 = 图标 + 完整文案，未选中项 = 去掉图标 + 前 2 字。
           图标直接从「原选中项」搬过来，不硬编码路径。 */
        var LABEL = { base: '基础工作台', dev: '研发工作台' };
        function setText(btn, text) {
          for (var i = btn.childNodes.length - 1; i >= 0; i--) {
            if (btn.childNodes[i].nodeType === 3) btn.removeChild(btn.childNodes[i]);
          }
          btn.appendChild(document.createTextNode(text));
        }
        function reconcile() {
          var tl = document.querySelector('[role="tablist"][aria-label="工作台切换"]');
          if (!tl) return false;
          var btns = tl.querySelectorAll('[data-tab]');
          if (!btns.length) return false;
          var cur = tl.querySelector('[data-tab][aria-selected="true"]');
          var dom = cur && cur.getAttribute('data-tab');
          if (dom === fileGroup) return true;
          var iconEl = cur && cur.querySelector('svg');
          var icon = iconEl ? iconEl.outerHTML : '';
          [].forEach.call(btns, function (b) {
            var k = b.getAttribute('data-tab'), want = (k === fileGroup), s = b.querySelector('svg');
            b.setAttribute('aria-selected', want ? 'true' : 'false');
            if (s) b.removeChild(s);
            if (want) {
              if (icon) b.insertAdjacentHTML('afterbegin', icon);
              setText(b, LABEL[k] || k);
            } else {
              setText(b, (LABEL[k] || k).slice(0, 2));
            }
          });
          return true;
        }
        if (!reconcile()) {
          var lo = new MutationObserver(function () { if (reconcile()) lo.disconnect(); });
          lo.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>

    <!-- SHELL-NAV-FIX v5 —— 外壳导航通用兜底（公共模块修复，勿手改此块）
         背景：外壳 navigate() 在 http 下只改 hash 且无 hashchange 监听 → 侧栏「数字分身/自动化/技能/设置」、
         看板卡片、dev 页「进入研发工作台」等点击后 URL 变成 base.html#/avatar 但页面不动（「点了没反应」）。
         修复：监听 hashchange，把 #/route 还原成真实文件名跳转。用相对路径 → file:// 与 http 预览
         （/static-html/<id>/<file>）都能正确解析到同目录文件。
         路由表取全站并集：/task-detail 不在任何单页的 xt 里，只有本兜底能接住。 -->
    <script>
      (function () {
        var ROUTE = { '/': 'base.html', '/base': 'base.html', '/dev': 'dev.html', '/kanban': 'kanban.html',
                      '/req-kanban': 'req-kanban.html', '/task-detail': 'task-detail.html', '/avatar': 'avatar.html',
                      '/automation': 'automation.html', '/skills': 'skills.html', '/settings': 'settings.html', '/conversation': 'conversation.html' };
        var here = location.pathname.split('/').pop() || '';
        function go() {
          var r = location.hash.replace(/^#/, '').split('?')[0];
          if (!r) return;
          if (r.charAt(0) !== '/') r = '/' + r;
          var f = ROUTE[r];
          if (f && f !== here) location.replace(f);
        }
        window.addEventListener('hashchange', go);
        go();
      })();
    </script>

  <script>
    /* ★ 第 49 轮：文件预览栏（.td-browse）的拖动与交互
       ① 两条分隔条可拖动：AI 对话框 ≥400px（用户指定）、文件树 ≥240px、代码区 ≥400px（后两项为兜底值）；
       ② crumb 右侧两按钮：文件目录显隐开关（list-tree 图标）+ 在浏览器打开当前文件（compass 图标）；
       ③ .td-browse-files 还原为 tree：展开/折叠、选中、键盘可达。
       宽度写入 r35 的同一份布局记忆（giencoder:td-cols:v1），新增 browseRightW / browseTreeW 两个字段，
       与普通态的 rightW / swapped / collapsed 互不干扰。 */
    (function () {
      var KEY = 'giencoder:td-cols:v1';
      var DEF_RIGHT = 480, DEF_TREE = 296;
      var MIN_RIGHT = 400, MIN_TREE = 240, MIN_CODE = 400;
      /* ★ 第 58 轮：浏览态左栏「收窄保留」区间（px）+ 栏间距 */
      var LEFT_KEEP_MIN = 480, LEFT_KEEP_MAX = 600, COL_GAP = 8;

      function readStore() {
        try { return JSON.parse(localStorage.getItem(KEY) || 'null') || {}; }
        catch (err) { return {}; }
      }
      function writeStore(patch) {
        var d = readStore();
        for (var k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) d[k] = patch[k]; }
        try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (err) {}
      }
      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      function init() {
        var root = document.querySelector('.td-root');
        if (!root) return false;
        var btn = root.querySelector('[data-td-browse-toggle]');
        var pane = root.querySelector('.td-browse');
        if (!btn || !pane) return false;
        if (btn.dataset.tdBrowseBound === '1') return true;
        btn.dataset.tdBrowseBound = '1';

        var body = pane.querySelector('.td-browse-body');
        var tree = pane.querySelector('.td-browse-tree');
        var files = pane.querySelector('.td-browse-files');
        var crumb = pane.querySelector('.td-browse-crumb-path');
        var splitMain = root.querySelector('[data-td-split="main"]');
        var splitTree = pane.querySelector('[data-td-split="tree"]');
        var curRight = DEF_RIGHT, curTree = DEF_TREE;

        /* 面板宽 = 根容器宽 − AI 对话框宽（分隔条净占位 0，故不减） */
        function rootW() { return root.getBoundingClientRect().width; }
        /* ★ 第 58 轮：浏览态给 AI 会话栏加一道拖动上限 ——
           不得把「左栏保底 LEFT_KEEP_MIN(480) + 8px 间隙 + 预览栏兜底(641)」挤破，
           否则拖到一半左栏会突然消失、分隔条位置跳变。 */
        function maxRight() {
          var avail = rootW() - (MIN_TREE + 1 + MIN_CODE);
          if (root.classList.contains('is-browse')) {
            avail = Math.min(avail, rootW() - LEFT_KEEP_MIN - COL_GAP - (MIN_TREE + 1 + MIN_CODE));
          }
          return Math.max(MIN_RIGHT, avail);
        }

        /* ★ 第 58 轮：浏览态左栏「收窄保留」的宽度分配。
           能分给左栏的宽 = 根容器宽 − AI 会话栏 − 8px 间隙 − 预览栏兜底；
           < LEFT_KEEP_MIN(480) ⇒ 返回 0＝不保留，CSS 回落 display:none（旧行为）。 */
        function keptLeft() {
          if (!root.classList.contains('is-browse')) return 0;
          var avail = rootW() - curRight - COL_GAP - (MIN_TREE + 1 + MIN_CODE);
          if (avail < LEFT_KEEP_MIN) return 0;
          return Math.min(LEFT_KEEP_MAX, Math.round(avail));
        }
        function applyLeft() {
          var w = keptLeft();
          if (w) {
            root.style.setProperty('--td-left-keep-w', w + 'px');
            root.classList.add('is-keep-left');
          } else {
            root.classList.remove('is-keep-left');
          }
          return w;
        }
        /* 左栏在根容器左缘占用的宽度（含 8px 间隙）；未保留时为 0 */
        function leftBasis() { var w = keptLeft(); return w ? w + COL_GAP : 0; }
        /* 预览栏可用宽 = 根容器宽 − 左栏（保留时另扣 8px 间隙）− AI 会话栏 − 分隔条 1px */
        function maxTree() {
          var lw = keptLeft();
          return Math.max(MIN_TREE, rootW() - lw - (lw ? COL_GAP : 0) - curRight - 1 - MIN_CODE);
        }

        function setTree(w, persist) {
          curTree = Math.round(clamp(w, MIN_TREE, maxTree()));
          pane.style.setProperty('--td-browse-tree-w', curTree + 'px');
          if (splitTree) {
            splitTree.setAttribute('aria-valuenow', String(curTree));
            splitTree.setAttribute('aria-valuemin', String(MIN_TREE));
          }
          if (persist) writeStore({ browseTreeW: curTree });
        }
        function setRight(w, persist) {
          curRight = Math.round(clamp(w, MIN_RIGHT, maxRight()));
          root.style.setProperty('--td-browse-right-w', curRight + 'px');
          if (splitMain) {
            splitMain.setAttribute('aria-valuenow', String(curRight));
            splitMain.setAttribute('aria-valuemin', String(MIN_RIGHT));
          }
          /* ★ 第 58 轮：AI 会话栏宽度变了 → 左栏可分配宽跟着变 → 先重算左栏保留 */
          applyLeft();
          /* AI 对话框变宽 → 面板变窄 → 树可能越界，同步钳位 */
          if (curTree > maxTree()) setTree(maxTree(), false);
          if (persist) writeStore({ browseRightW: curRight });
        }

        /* ★ 第 53 轮第 1 项：展开/收起补微动效。
           收起先播 220ms 的 .is-closing 移出动画，再摘 is-browse ——
           否则 display:none 会让整栏瞬间消失（原来的「生硬」正来自这里）。
           定时器挂在 pane 上，收起途中又点开时可取消，避免动画被半路摘掉。 */
        function setOpen(on) {
          var isOn = root.classList.contains('is-browse');
          if (on === isOn && !pane.classList.contains('is-closing')) return;
          if (on) {
            if (pane._browseT) { clearTimeout(pane._browseT); pane._browseT = null; }
            pane.classList.remove('is-closing');
            root.classList.add('is-browse');
            btn.setAttribute('aria-pressed', 'true');
            setRight(curRight, false); setTree(curTree, false);
            return;
          }
          if (pane.classList.contains('is-closing')) return;
          var done = function () {
            pane._browseT = null;
            pane.classList.remove('is-closing');
            root.classList.remove('is-browse');
            root.classList.remove('is-keep-left');   /* ★ 第 58 轮：左栏保留态随浏览态一起收掉 */
            btn.setAttribute('aria-pressed', 'false');
          };
          pane.classList.add('is-closing');
          pane._browseT = setTimeout(done, 240);
          pane.addEventListener('animationend', function onEnd(e) {
            if (e.target !== pane) return;
            clearTimeout(pane._browseT);
            pane.removeEventListener('animationend', onEnd);
            done();
          });
        }
        btn.addEventListener('click', function () { setOpen(!root.classList.contains('is-browse')); });
        var close = pane.querySelector('[data-td-browse-close]');
        if (close) close.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) {
          /* ★ 第 54 轮第 4 项收口：文件右键菜单打开时，Esc 只收菜单、不收浏览侧栏。
             页尾 Esc 链会先派发 td:close-ctx 并 return，但本监听是**独立**的，必须自己让位。
             注意：两个监听都在 document 冒泡段，顺序＝注册顺序（本监听在首次开侧栏时才注册，
             晚于菜单监听）→ 「读状态位」是顺序相关的，会被先跑的菜单监听清掉；
             故额外用事件对象标记 e.__tdCtxHandled，两条件取或，谁先跑都对。 */
          if (e.key === 'Escape' && root.classList.contains('is-browse')
              && !e.__tdCtxHandled
              && !document.documentElement.hasAttribute('data-td-ctx-open')) setOpen(false);
        });

        /* ★ 第 72 轮：接住页尾链派发的收起事件（见页尾 Esc 链的浏览态分支）。
           为何不改上面那条监听的注册方式：它在冒泡段懒注册，永远晚于页尾链，
           抢不到优先级；由页尾链主动派发才是可靠通路。 */
        document.addEventListener('td:close-browse', function () { setOpen(false); });

        /* ---------- 分隔条拖动 ---------- */
        function draggable(el, applyFrom, persist) {
          if (!el) return;
          var on = false;
          el.addEventListener('pointerdown', function (e) {
            if (!root.classList.contains('is-browse')) return;
            on = true;
            el.classList.add('is-dragging');
            root.classList.add('is-col-dragging');
            if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
            e.preventDefault();
          });
          el.addEventListener('pointermove', function (e) { if (on) applyFrom(e.clientX); });
          function end() {
            if (!on) return;
            on = false;
            el.classList.remove('is-dragging');
            root.classList.remove('is-col-dragging');
            persist();   /* 与 r35 同策略：只在收手时落盘，pointermove 里不写 */
          }
          el.addEventListener('pointerup', end);
          el.addEventListener('pointercancel', end);
        }
        /* ★ 第 58 轮：左栏保留后 AI 会话栏不再从根容器左缘起算，拖动换算必须先减去左栏占位；
           占位在 pointerdown 时**冻结** —— 否则「拖宽 AI 栏 → 左栏自动收窄 → 基准漂移」
           会形成正反馈，光标与分隔条脱节（实测补丁 1 落地后拖 +420px 会一步顶到上限）。 */
        var dragLeftBase = 0;
        if (splitMain) {
          splitMain.addEventListener('pointerdown', function () {
            if (root.classList.contains('is-browse')) dragLeftBase = leftBasis();
          });
          splitMain.addEventListener('pointerup', function () { dragLeftBase = 0; });
          splitMain.addEventListener('pointercancel', function () { dragLeftBase = 0; });
        }
        draggable(splitMain, function (x) {
          setRight(x - root.getBoundingClientRect().left - dragLeftBase, false);
        }, function () { writeStore({ browseRightW: curRight }); });
        draggable(splitTree, function (x) { setTree(x - tree.getBoundingClientRect().left, false); },
                  function () { writeStore({ browseTreeW: curTree }); });

        function keyboard(el, getCur, set) {
          if (!el) return;
          el.addEventListener('keydown', function (e) {
            var step = e.shiftKey ? 48 : 16;
            if (e.key === 'ArrowLeft') { set(getCur() - step, true); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { set(getCur() + step, true); e.preventDefault(); }
          });
        }
        keyboard(splitMain, function () { return curRight; }, setRight);
        keyboard(splitTree, function () { return curTree; }, setTree);
        if (splitMain) {
          splitMain.setAttribute('title', '拖动调整 AI 对话框宽度（最小 400px）· 双击复位');
          splitMain.addEventListener('dblclick', function () { setRight(DEF_RIGHT, true); });
        }
        if (splitTree) {
          splitTree.setAttribute('title', '拖动调整文件目录宽度（最小 240px）· 双击复位');
          splitTree.addEventListener('dblclick', function () { setTree(DEF_TREE, true); });
        }

        /* 视口变化后重新钳位（钳位值不落盘，与 r35 同策略） */
        var raf = 0;
        window.addEventListener('resize', function () {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(function () { raf = 0; setRight(curRight, false); setTree(curTree, false); });
        });

        /* ---------- crumb 右侧两个按钮（第 49 轮第 4/5 项） ---------- */
        var tgl = pane.querySelector('[data-td-tree-toggle]');
        if (tgl) {
          tgl.addEventListener('click', function () {
            var hidden = body.classList.toggle('is-no-tree');
            tgl.setAttribute('aria-pressed', hidden ? 'false' : 'true');
            var label = hidden ? '显示文件目录' : '隐藏文件目录';
            tgl.setAttribute('aria-label', label);
            tgl.setAttribute('title', label);
            if (!hidden) setTree(curTree, false);
          });
        }
        var openBtn = pane.querySelector('[data-td-open-browser]');
        if (openBtn) {
          openBtn.addEventListener('click', function () {
            var name = crumb && crumb.textContent ? crumb.textContent.split('/').pop().trim() : '';
            if (!name) return;
            /* 当前文件 = crumb 末段（设计稿里是 index.html）。原型约定：映射到仓库根的同名文件
               （本页在 pages/ 下）→ ../index.html 在磁盘上真实存在，双击打开时即交给系统默认浏览器。
               ⚠️ 在内置 http 预览里 ../ 会落到 static-html 根，路径未必存在 —— file:// 直开是标准用法。 */
            window.open(new URL('../' + name, location.href).href, '_blank', 'noopener');
          });
        }

        /* ---------- tree：展开/折叠 + 选中（第 49 轮第 6 项） ---------- */
        function refresh() {
          var rows = pane.querySelectorAll('.td-bf'), i;
          for (i = 0; i < rows.length; i++) {
            var p = rows[i].dataset.parent || '', ok = true;
            while (p) {
              var pr = pane.querySelector('.td-bf[data-node="' + p + '"]');
              if (!pr || pr.classList.contains('is-closed')) { ok = false; break; }
              p = pr.dataset.parent || '';
            }
            rows[i].classList.toggle('is-hidden', !ok);
          }
        }
        function toggleDir(row) {
          var closed = row.classList.toggle('is-closed');
          row.setAttribute('aria-expanded', closed ? 'false' : 'true');
          refresh();
        }
        function selectFile(row) {
          var old = pane.querySelector('.td-bf.is-active');
          if (old) { old.classList.remove('is-active'); old.setAttribute('aria-selected', 'false'); }
          row.classList.add('is-active');
          row.setAttribute('aria-selected', 'true');
        }
        if (files) {
          files.addEventListener('click', function (e) {
            var row = e.target && e.target.closest ? e.target.closest('.td-bf') : null;
            if (!row) return;
            if (row.classList.contains('is-dir')) toggleDir(row); else selectFile(row);
          });
          files.addEventListener('keydown', function (e) {
            var row = e.target && e.target.closest ? e.target.closest('.td-bf') : null;
            if (!row || row !== e.target) return;
            var isDir = row.classList.contains('is-dir'), closed = row.classList.contains('is-closed');
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (isDir) toggleDir(row); else selectFile(row);
            } else if (e.key === 'ArrowRight' && isDir && closed) { e.preventDefault(); toggleDir(row); }
            else if (e.key === 'ArrowLeft' && isDir && !closed) { e.preventDefault(); toggleDir(row); }
          });
        }

        /* ---------- 恢复本次浏览态记忆 ---------- */
        function restore() {
          var d = readStore();
          if (typeof d.browseRightW === 'number') setRight(d.browseRightW, false);
          if (typeof d.browseTreeW === 'number') setTree(d.browseTreeW, false);
        }
        if (root.getBoundingClientRect().width > 0) restore(); else requestAnimationFrame(restore);

        return true;
      }

      if (!init()) {
        var mo = new MutationObserver(function () { if (init()) mo.disconnect(); });
        mo.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>

  <style id="r73-radius-css">

     ⚠️ 只动按钮。DS 的 --border-radius-medium（4px）是「按钮 / 输入框 / 卡片」的共用档，

     ⚠️ size-small 变体实测是 6px（小按钮配小圆角），**不属「4px 按钮」范围** ⇒ :not() 排除。

     ⇒ 必须**先提升、再还原**（同特异性时后置者胜）—— 见紧跟其后的 ④b。

<script id="r73-tab-relay">
/* SHELL-TAB-RELAY v1 —— 顶栏页签「跨页接力滑动」（勿手改此块）
   出发页记下滑块的渲染位置 → 到达页先用 translate 摆回旧位置、再滑到目标。
   用 translate 叠加而非改 left/width：本仓库 task-detail 的滑块位置被一条
   !important 规则钉死，内联 left/width 写不动它，translate 不在其管辖范围内。 */
(function () {
  var KEY = "r73-tab-relay";
  var TLS = '[role="tablist"][aria-label="工作台切换"]';
  var SPRING = "cubic-bezier(.34,1.56,.64,1)";
  var TRANS = "left .2s " + SPRING + ", width .2s " + SPRING + ", translate .2s " + SPRING;
  var TTL = 10000;

  function pick() {
    var tl = document.querySelector(TLS);
    if (!tl) return null;
    var sp = tl.querySelector("span[aria-hidden]");
    var cur = tl.querySelector('[data-tab][aria-selected="true"]');
    if (!sp || !cur) return null;
    return { tl: tl, sp: sp, key: cur.getAttribute("data-tab") };
  }

  /* ---------- A. 出发页：记下滑块的**渲染**几何 ---------- */
  window.addEventListener("click", function (e) {
    var t = e.target;
    var btn = t && t.closest ? t.closest(TLS + " [data-tab]") : null;
    if (!btn) return;
    var o = pick();
    if (!o) return;
    if (btn.getAttribute("data-tab") === o.key) return; /* 点的是当前页签：不记 */
    var r = o.sp.getBoundingClientRect();
    if (!(r.width > 0)) return;
    try {
      sessionStorage.setItem(KEY, JSON.stringify({
        from: o.key, left: r.left, width: r.width, t: Date.now()
      }));
    } catch (err) { /* 存储不可用则静默：退化为无接力 */ }
  }, true);

  /* ---------- B. 到达页：摆回出发位置，再滑到目标 ---------- */
  var from = null;
  try {
    var raw = sessionStorage.getItem(KEY);
    if (raw) { sessionStorage.removeItem(KEY); from = JSON.parse(raw); }
  } catch (e) { from = null; }
  if (from && (!(from.width > 0) || Date.now() - from.t > TTL)) from = null;
  if (!from) return;

  var booted = false;
  function boot() {
    if (booted) return true;
    var o = pick();
    if (!o) return false;
    booted = true;
    if (o.key === from.from) return true;          /* 刷新 / 点的就是当前页签：不接力 */
    var now = o.sp.getBoundingClientRect();
    if (!(now.width > 0)) return true;
    var dx = Math.round((from.left - now.left) * 100) / 100;
    if (Math.abs(dx) < 1) return true;             /* 位置一样：无位移可演 */

    o.sp.style.transition = "none";
    o.sp.style.translate = dx + "px 0px";          /* ① 摆到出发页签的位置（不带动画）*/
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        o.sp.style.transition = TRANS;             /* ② 交还过渡 */
        o.sp.style.translate = "0px 0px";          /*    并滑回自己的目标位 */
      });
    });
    return true;
  }

  /* 外壳是 React 异步挂载：先直接试，未就绪则等滑块出现 */
  function schedule() {
    requestAnimationFrame(function () {
      if (boot()) return;
      var mo = new MutationObserver(function () { if (boot()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
})();
</script>

<style id="r74-td-css">
  /* ★ 第 74 轮 · 需求 8：任务详情页「文件预览栏」的进 / 出，与左栏、AI 会话栏做成一套同步动效。
     ── 改前实测（1920×1080，rAF 逐帧采样 .td-root 各子项宽度）──
       · 展开：t=0 slot=0 → t≈9ms slot=816。一帧内到位。真因不是「过渡没建」——冻结帧里
         flex-basis 的 CSS 过渡确实存在，是**左栏在同一帧被钳死在 600**，于是预览栏的可用余量
         当帧就是 816，它的实用宽被余量顶死 ⇒ 过渡出来的 basis 全被裁掉，看着像瞬变。
         同一帧里 AI 会话栏右缘圆角 8→0 / 右描边 1→0 也是瞬变。
       · 收起：slot 816→0 走满 200ms（平滑），但左栏全程钉在 600 —— 腾出的 816px 无人接收，
         成了 AI 会话栏右侧的一片空白；直到 t≈245ms React 摘掉 .is-browse / .is-keep-left，
         左栏 600→1416、圆角 0→8、描边 0→1 三件事一起硬跳。
         观感 =「预览栏自己关完，别的东西再一起跳」⇒ 用户说的各关各的。
     ── 改法：一进一出同一条 200ms 曲线 ──
       关键事实：.td-browse-slot 的**实用宽**不由它自己的 flex-basis 决定，而是
       「行宽 − 左栏 − 8px − AI 会话栏」的余量（它的 basis 恒大于余量 ⇒ 永远被压到余量）。
       因此只要驱动**左栏**宽度，预览栏的长短与 AI 会话栏的位置就自动同帧跟随，无需各自补动画。
       ⚠️ 左栏在浏览态被 min-width / max-width 双双钳死在 600px，必须先放开夹子，否则
          flex-basis 动画会被 max-width 截断成常数（这是本改动唯一的硬前提）。 */

  /* ① 展开：左栏从「普通态的整行宽」收窄到 600px，预览栏随之从 0 长到 816px。
        from 用普通态公式反推（普通态：左栏 = 行宽 − 8px 拖动条 − AI 会话栏宽），
        不写死 1416 —— 右栏被拖动过时同样成立；to 取元素自身计算值（keep-left 的 basis）。 */
  @keyframes r74-left-fold {
    from { flex-basis: calc(100% - var(--td-gap, 8px) - var(--td-right-w, 480px)); }
  }
  .td-root.is-browse.is-keep-left .td-left {
    min-width: 0;
    max-width: none;
    animation: r74-left-fold 200ms var(--td-browse-ease, cubic-bezier(0.22, 1, 0.36, 1));
  }

  /* ② 收起：左栏换成「可伸」的同宽 basis —— 预览栏每缩 1px，左栏就长 1px，
        腾出的空间被左栏当场吸收，AI 会话栏不再被撇在原地、右端也不留空白。
        basis 仍是 --td-left-keep-w（600）⇒ 起始帧零位移（与改前同一起点）；
        t≈195ms 时恰好长到 1416，与 .is-browse 被摘掉后的普通态宽度重合 ⇒ 也不会二次跳变。
        flex-shrink 置 0：保证起始帧的收缩由预览栏独家承担。 */
  .td-root.is-browse.is-keep-left:has(> .td-browse-slot > .td-browse.is-closing) .td-left {
    flex-grow: 1;
    flex-shrink: 0;
  }

  /* ③ AI 会话栏的右缘：浏览态是「与预览栏拼成一条缝」（直角 + 无右描边），
        普通态是「独立圆角卡片」（圆角 8 + 1px 描边）。改前这一步在 t≈245ms 硬跳。
        这里把「还原」的触发点提前到 is-closing 出现的那一帧，与预览栏同起同落。
        ⚠️ 两个端点都写成 border 简写：页面原规则的 `border-right: 0` 会把 border-style
           重置成 none，那样 border-width 0↔1px 插值出来也不可见。 */
  .td-root.is-browse .td-right {
    border-right: 0px solid var(--td-pane-line);
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }
  .td-root.is-browse:has(> .td-browse-slot > .td-browse.is-closing) .td-right {
    border-right: 1px solid var(--td-pane-line);
    border-top-right-radius: 8px;
    border-bottom-right-radius: 8px;
  }

  /* ④ 过渡表：必须把页面原有那条（outline-color / box-shadow）一并重述 ——
        transition 是整条覆盖不是合并，漏写就会把拖动提示态的两条过渡弄丢。 */
  .td-left {
    transition: outline-color 140ms var(--transition-timing-function-standard),
                box-shadow 180ms var(--transition-timing-function-standard);
  }
  .td-right {
    transition: outline-color 140ms var(--transition-timing-function-standard),
                box-shadow 180ms var(--transition-timing-function-standard),
                border-right-width 200ms var(--td-browse-ease, cubic-bezier(0.22, 1, 0.36, 1)),
                border-top-right-radius 200ms var(--td-browse-ease, cubic-bezier(0.22, 1, 0.36, 1)),

  var CHEV = '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3.89175254,4.9819846000000005L3,4.0902326L6.0902324,1L6.9819846000000005,1.89175296L6.981709,1.89202845L9.1820469,4.0923662L8.2902932,4.9841180000000005L6.0899563,2.7837810999999997L3.89175254,4.9819846000000005ZM3.92955351,6.9386725L3.037800699,7.8304243L5.2382145,10.030838L5.2380145,10.0310383L6.1297677,10.9227915L9.2199998,7.8325586L8.328247099999999,6.9408059L6.129967199999999,9.1390858L3.92955351,6.9386725Z" fill-rule="evenodd" fill="rgb(var(--gray-7))" fill-opacity="1"/></svg>';
  var LENS = '<svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M9.233175474942017,3.4585702395812987C7.638544274942016,1.863927129581299,5.053090574942017,1.863927129581299,3.4584593749420165,3.4585702395812987C1.8638162649420167,5.053201439581299,1.8638162649420167,7.6386551395812985,3.4584593749420165,9.2332863395813C5.053090574942017,10.827917539581298,7.638544274942016,10.827917539581298,9.233175474942017,9.2332863395813C10.827806674942016,7.6386551395812985,10.827806674942016,5.053201439581299,9.233175474942017,3.4585702395812987ZM2.6335023749420166,2.633613239581299C4.6837527749420165,0.5833569795812988,8.007882374942017,0.5833569795812988,10.058126674942017,2.633613239581299C11.750403174942017,4.325895039581299,12.045895174942016,6.886033539581299,10.944559374942017,8.8813743395813C10.698227174942017,9.327665839581298,10.725335374942016,9.9004693395813,11.085787974942017,10.260926739581299C11.422623174942016,10.5977673395813,11.826180174942017,11.001329939581298,12.121471174942016,11.296626039581298C12.349276174942016,11.5244320395813,12.345245174942017,11.895935039581298,12.117441174942016,12.123740039581298C11.895824174942016,12.345356039581299,11.524321174942017,12.349387039581298,11.296515174942016,12.1215830395813C11.001219074942016,11.8262910395813,10.597656474942017,11.422734039581298,10.260816774942016,11.085898839581299C9.900358474942017,10.725446239581299,9.327554974942016,10.6983380395813,8.881263474942017,10.9446702395813C6.885922674942017,12.046006039581298,4.325784174942017,11.750514039581299,2.6335023749420166,10.058237539581299C0.5832461149420166,8.0079932395813,0.5832461149420166,4.683863639581299,2.6335023749420166,2.633613239581299Z" fill-rule="evenodd" fill="rgb(var(--gray-6))" fill-opacity="1"/></svg>';

  var sel = 0;
  var open = false;

  function mk(tag, cls) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }

  // —— 触发器（顶栏左簇，红绿灯之后）——
  var trig = mk('button', 'r81-ws-trigger');
  trig.type = 'button';
  trig.setAttribute('aria-label', '切换工艺流程空间');
  trig.setAttribute('aria-haspopup', 'listbox');
  trig.setAttribute('aria-expanded', 'false');
  trig.setAttribute('data-r81-ws', 'trigger');
  trig.innerHTML =
    '<span class="r81-ws-logo">P</span>' +
    '<span class="r81-ws-link">' +
      '<span class="r81-ws-name"></span>' +
      '<span class="r81-ws-pill">工艺流程空间</span>' +
      '<span class="r81-ws-chev">' + CHEV + '</span>' +
    '</span>';
  var nameEl = trig.querySelector('.r81-ws-name');
  nameEl.textContent = SPACES[sel].n;

  // —— 浮窗（portal 到 body）——
  var pop = mk('div', 'r81-ws-pop');
  pop.hidden = true;
  pop.setAttribute('data-r81-ws', 'pop');
  var panel = mk('div', 'r81-ws-panel');
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-label', '切换工艺流程空间');
  var divider = mk('div', 'r81-ws-divider');
  divider.innerHTML = '<i></i><span>切换工艺流程空间</span><i></i>';
  var search = mk('label', 'r81-ws-search');
  search.innerHTML =
    LENS +
    '<input type="text" class="r81-ws-input ws-search-input" placeholder="搜索空间"' +
    ' autocomplete="off" aria-label="搜索空间">';
  var inputEl = search.querySelector('input');
  var list = mk('div', 'r81-ws-list');
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-label', '工艺流程空间列表');
  panel.appendChild(divider);
  panel.appendChild(search);
  panel.appendChild(list);
  pop.appendChild(panel);
  document.body.appendChild(pop);

  function render() {
    var q = inputEl.value.trim().toLowerCase();
    list.innerHTML = '';
    for (var i = 0; i < SPACES.length; i++) {
      var sp = SPACES[i];
      if (q && (sp.n + sp.d).toLowerCase().indexOf(q) < 0) continue;
      // 选中项不挂悬停类（与基础工作台一致：选中态无 hover 反馈）
      var b = mk('button', 'r81-ws-item' + (i === sel ? '' : ' ws-item-hover'));
      b.type = 'button';
      b.setAttribute('role', 'option');
      b.setAttribute('data-i', String(i));
      b.setAttribute('aria-selected', i === sel ? 'true' : 'false');
      b.innerHTML =
        '<span class="r81-ws-ibadge" style="background:' + sp.c + '">' + ICON + '</span>' +
        '<span class="r81-ws-itext">' +
          '<span class="r81-ws-iname"></span>' +
          '<span class="r81-ws-idesc"></span>' +
        '</span>' +
        (sp.r ? '<span class="r81-ws-ipill"></span>' : '');
      b.querySelector('.r81-ws-iname').textContent = sp.n;
      b.querySelector('.r81-ws-idesc').textContent = sp.d;
      if (sp.r) b.querySelector('.r81-ws-ipill').textContent = sp.r;
      list.appendChild(b);
    }
  }

  // 定位与基础工作台 Tn() 逐字一致：top = 锚点底 + 4、left = 锚点左；越界时兜底夹回视口。
  function place() {
    var r = trig.getBoundingClientRect();
    var w = pop.offsetWidth || 388;
    var left = r.left;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    if (left < 8) left = 8;
    var top = r.bottom + 4;
    var h = panel.offsetHeight || 526;
    if (top + h > window.innerHeight - 8 && r.top - 4 - h > 8) top = r.top - 4 - h;
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  function show() {
    open = true;
    pop.hidden = false;
    render();
    place();
    trig.setAttribute('aria-expanded', 'true');
  }

  function hide() {
    open = false;
    pop.hidden = true;
    trig.setAttribute('aria-expanded', 'false');
    if (inputEl.value) {
      inputEl.value = '';
      render();
    }
  }

  trig.addEventListener('click', function (e) {
    e.stopPropagation();
    if (open) hide(); else show();
  });
  inputEl.addEventListener('input', render);
  list.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.r81-ws-item') : null;
    if (!b) return;
    sel = parseInt(b.getAttribute('data-i'), 10) || 0;
    nameEl.textContent = SPACES[sel].n;
    hide();
  });
  document.addEventListener('pointerdown', function (e) {
    if (!open) return;
    if (pop.contains(e.target) || trig.contains(e.target)) return;
    hide();
  });
  document.addEventListener('keydown', function (e) {
    if (!open || e.key !== 'Escape') return;
    e.stopPropagation();
    hide();
  });
  window.addEventListener('resize', function () {
    if (open) place();
  });

  // —— 挂到顶栏左簇、红绿灯之后（外壳渲染晚于本脚本，用 MutationObserver 等）——
  function mount() {
    var hdr = document.querySelector('header');
    if (!hdr) return false;
    var left = hdr.children[0];
    if (!left || left.tagName !== 'DIV') return false;
    // 锚点校验：左簇第一个子元素必须是红绿灯（三颗圆点中第一个 aria-label=关闭）
    var lights = left.children[0];
    if (!lights || !lights.querySelector('button[aria-label="关闭"]')) return false;
    if (left.querySelector('.r81-ws-trigger')) return true;
    var nxt = left.children[1];
    if (nxt) left.insertBefore(trig, nxt);
    else left.appendChild(trig);
    return true;
  }
  if (!mount()) {
    var mo = new MutationObserver(function () {
      if (mount()) mo.disconnect();
    });
    mo.observe(document.body, { childList: true, subtree: true });
  }
})();

<script id="r106-nav-js">
/* r93 ④ · 会话详情已独立成页（pages/conversation.html）
   —— 基础工作台只需要把「点 aside 里的会话任务标题」接到那一页去。
   背景：aside 是外壳 React 渲染的，拿不到它的 onClick，只能在捕获阶段识别（先例 r86/r88）。 */
(function () {
  'use strict';
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var b = t.closest('aside button');
    if (!b) return;
    var cl = b.classList;
    /* 会话项 = `min-w-0 flex-1` 的那 13 个（实测）；分组标题 = `rounded-md py-0` 的那 4 个，
       点它是折叠/展开，不能跳页；其余（新会话 / 数字分身 / 自动化 / 技能 / 设置）交给外壳。 */
    if (!(cl.contains('min-w-0') && cl.contains('flex-1'))) return;
    location.href = 'conversation.html';
  }, true);
})();
</script>
