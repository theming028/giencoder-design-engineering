   11 个 DS 字号 token 全部由它派生 ⇒ 改一处，全站文字等比缩放。
   ratio = 1（默认档）时全部派生值 = 原值 ⇒ 零几何回归。
   本块覆盖规则一律加 body 前缀，特异性高于任何后置的普通规则，与脚本执行顺序无关。
   ⚠ --ui-fs / --ui-fs-ratio 只允许在 :root 声明一次（否则会盖掉 <html> 上的内联值）。 */
:root{
  --ui-fs:14;
  --ui-fs-ratio:calc(var(--ui-fs) / 14);
  --font-size-body:calc(14px * var(--ui-fs-ratio));
  --font-size-body-1:calc(12px * var(--ui-fs-ratio));
  --font-size-body-2:calc(13px * var(--ui-fs-ratio));
  --font-size-body-3:calc(14px * var(--ui-fs-ratio));
  --font-size-caption:calc(12px * var(--ui-fs-ratio));
  --font-size-title-1:calc(16px * var(--ui-fs-ratio));
  --font-size-title-2:calc(20px * var(--ui-fs-ratio));
  --font-size-title-3:calc(24px * var(--ui-fs-ratio));
  --font-size-display-1:calc(36px * var(--ui-fs-ratio));
  --font-size-display-2:calc(48px * var(--ui-fs-ratio));
  --font-size-display-3:calc(56px * var(--ui-fs-ratio));
}
/* 外壳（React 渲染）用尾风 px 类，不吃 token ⇒ 逐条覆盖；全站实测只用这 6 种。
   新增文字类时需同步补在此处。 */
body .text-xs{font-size:calc(12px * var(--ui-fs-ratio))}
body .text-xs:not([class*="leading-"]){line-height:calc(16px * var(--ui-fs-ratio))}
body .text-sm{font-size:calc(14px * var(--ui-fs-ratio))}
body .text-sm:not([class*="leading-"]){line-height:calc(20px * var(--ui-fs-ratio))}
body .text-lg{font-size:calc(18px * var(--ui-fs-ratio))}
body .text-lg:not([class*="leading-"]){line-height:calc(28px * var(--ui-fs-ratio))}
body .text-2xl{font-size:calc(24px * var(--ui-fs-ratio))}
body .text-2xl:not([class*="leading-"]){line-height:calc(32px * var(--ui-fs-ratio))}
body .text-\[13px\]{font-size:calc(13px * var(--ui-fs-ratio))}
body .text-\[11px\]{font-size:calc(11px * var(--ui-fs-ratio))}
/* ★ r93 ①：arbitrary leading-[Npx] 的派生行高。
   必须在上面 text-* 之后（同特异性 0,1,1，后写者胜），否则 .leading-[32px] 会被 text-xs 压掉。 */
body .leading-\[19px\]{line-height:calc(19px * var(--ui-fs-ratio))}
body .leading-\[22px\]{line-height:calc(22px * var(--ui-fs-ratio))}
body .leading-\[32px\]{line-height:calc(32px * var(--ui-fs-ratio))}
/* 文字控件高度跟随（图标盒与布局盒刻意不跟随 —— 本设置只缩放「文字相关」尺寸）。 */
body .giencoder-btn-size-large{height:calc(36px * var(--ui-fs-ratio))}
body .giencoder-btn-size-default{height:calc(32px * var(--ui-fs-ratio))}
body .giencoder-btn-size-small{height:calc(28px * var(--ui-fs-ratio))}
body .giencoder-btn-size-mini{height:calc(24px * var(--ui-fs-ratio))}
body .giencoder-input-wrapper{height:calc(32px * var(--ui-fs-ratio))}
body .giencoder-input-wrapper[data-size="mini"]{height:calc(24px * var(--ui-fs-ratio))}
body .giencoder-input-wrapper[data-size="small"]{height:calc(28px * var(--ui-fs-ratio))}
body .giencoder-input-wrapper[data-size="medium"]{height:calc(32px * var(--ui-fs-ratio))}
body .giencoder-input-wrapper[data-size="large"]{height:calc(36px * var(--ui-fs-ratio))}
body .giencoder-select-view{min-height:calc(32px * var(--ui-fs-ratio))}
body .r85-navi{height:calc(36px * var(--ui-fs-ratio))}
body .r85-back{height:calc(32px * var(--ui-fs-ratio))}
body .r85-btn{height:calc(32px * var(--ui-fs-ratio))}
body .r85-seg > button{height:calc(40px * var(--ui-fs-ratio))}
body .r85-slider{height:calc(36px * var(--ui-fs-ratio))}
body .r85-sl-lbls{height:calc(16px * var(--ui-fs-ratio))}
body .r88-arch-row:hover .r88-arch-act{min-height:calc(32px * var(--ui-fs-ratio))}
body .r88-arch-row:focus-within .r88-arch-act{min-height:calc(32px * var(--ui-fs-ratio))}
</style>
<script id="r87-ui-js">
(function () {
  /* r87：首帧前把用户选定的界面字号写成 <html> 内联样式，避免闪一下再变大/变小。 */
  var OK = { 13: 1, 14: 1, 16: 1, 18: 1, 20: 1, 24: 1 };
  var v = null;
  try { v = localStorage.getItem('gi-ui-fs'); } catch (e) {}
  if (v !== null && OK[v * 1] === 1) {
    document.documentElement.style.setProperty("--ui-fs", String(v * 1));
  }
})();
</script>
<style id="r109-theme-css">
  /* ★ r109 第三拍 ③：**全站主题开关**（浅色 / 深色 / 跟随系统）的样式半边。
     底座是 DS 自己的暗色档 —— `colors_and_type.css` 早就写好了
     `body[giencoder-theme='dark'], [giencoder-theme='dark'] { … }`（12 组色阶 × 10 级
     + `bg/text/fill/border/mask` 语义色），并且**已内联进本页**。所以「切主题」= 在 `<html>`
     上挂/摘一个 `giencoder-theme="dark"` 属性 —— 页面里不需要另造一套暗色变量。
     本块只补一件 DS 没管的事：`color-scheme`。它管的是**浏览器原生部件**的明暗
     （滚动条、`<select>` 下拉、`<input type=checkbox>`、表单自动填充底色、默认焦点环）
     —— 不写的话，暗色页面里会横出一条刺眼的白色滚动条。
     ⚠ 不用 `@media (prefers-color-scheme: dark)`：档位由用户显式选定（可能是 light 配深色系统），
       媒体查询会把「用户选择了浅色但系统是深色」这一格判错。属性选择器永远跟着**用户的档**走。 */
  html[giencoder-theme='dark'] { color-scheme: dark; }
  html:not([giencoder-theme='dark']) { color-scheme: light; }
</style>
<script id="r109-theme-js">
(function () {
  /* ★ r109 第三拍 ③：**首帧前把用户选定的主题档落到 `<html>` 上**，避免「先画浅色再跳暗色」。
     与 `r87-ui-js`（字号）同一体位、同一条链：本块紧跟它之后，仍在 `<head>` 内、仍早于首次绘制。
     档位存 `localStorage['gi-ui-theme']`，取值 `light` / `dark` / `auto`；
     **缺省 = `auto`（跟随系统）** —— 邵先生 2026-10-02 定的默认档。
     ⚠ 本块是 10 页共享的**机制层**：只管「读存储 → 定档 → 挂属性 → 跟随系统变化」，
       不做任何 UI。设置页那三枚按钮的接线也在这里（见文件末尾），
       因为它必须**先于**设置页自己的渲染脚本改 `aria-pressed`，否则会「显示浅色被选、实际跟随系统」。 */
  var KEY = 'gi-ui-theme';
  var root = document.documentElement;
  var MQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var mode = 'auto';

  /* ★★ 适配护栏（防「半暗半亮」）：
     本拍暗色**适配层只覆盖基础工作台 5 页**（研发工作台 5 页下一轮）。
     机制层却是全局的 ⇒ 若不设护栏，未适配页会出现「DS token 翻暗、外壳仍是浅色」
     （外壳底是 React 写死的内联样式 + Tailwind 字面类，都不吃 token）
     ⇒ 近白文字压浅底 = 不可读，直接破坏稳定性。
     故：**页面上没有适配标记时一律按浅色渲染**（不挂属性、不翻 token）。
     ⚠ 标记取 `<html data-gi-dark="1">`（由 `apply-dark.py` 在**实际适配的页面**上挂、
       与 `#r109-dark-css` 同进同出）⇒ 两个脚本天然同步，不存在「改了机制忘了改护栏」。
     ⚠ 用 `<html>` 属性而**不是**去查 DOM 里的 `#r109-dark-css`：本脚本在 `<head>` 里
       **同步执行**，此刻它后面的那张样式表还没被解析出来，查不到（会误判成未适配，
       从而在已适配页上也永远不生效）。
     ⚠⚠ 本注释里**绝不能出现裸的 "<" + "style"**（或 "<" + "script"）字面 ——
       check-syntax.py 的 `STYLE_RE` 是纯文本正则，会把注释里的那个开标签当真，
       于是整块被它吞到下一个闭合标签，报「花括号/注释不配对」。 */
  var DARK_OK = root.getAttribute('data-gi-dark') === '1';

  function ok(m) { return m === 'light' || m === 'dark' || m === 'auto'; }
  function isDark(m) { return DARK_OK && (m === 'dark' || (m === 'auto' && !!MQ && MQ.matches)); }
  function paint() {
    if (isDark(mode)) root.setAttribute('giencoder-theme', 'dark');
    else root.removeAttribute('giencoder-theme');
    /* 档位本身也留个可读标记（探针 / 以后可能的顶栏快捷入口用；不参与任何样式）。 */
    root.setAttribute('data-gi-theme', mode);
  }
  function set(m) {
    if (!ok(m)) return;
    mode = m;
    try { localStorage.setItem(KEY, m); } catch (e) {}
    paint();
    syncSeg();
  }

  var v = null;
  try { v = localStorage.getItem(KEY); } catch (e) {}
  mode = ok(v) ? v : 'auto';
  paint();

  /* `auto` 档要跟着系统走 —— 监听媒体查询变化。
     ⚠ Safari < 14 只有已废弃的 `addListener`，两条都兜。 */
  if (MQ) {
    var onMQ = function () { if (mode === 'auto') paint(); };
    if (MQ.addEventListener) MQ.addEventListener('change', onMQ);
    else if (MQ.addListener) MQ.addListener(onMQ);
  }

  /* 机制出口：设置页的按钮与（探针 / 以后的顶栏入口）共用这一个口子。 */
  window.__giTheme = {
    get: function () { return mode; },
    set: set,
    isDark: function () { return isDark(mode); },
    /* ★ 本页是否已适配暗色（探针 / 设置页做「未适配则置灰」时用）。 */
    supported: function () { return DARK_OK; }
  };

  /* ---- 设置页「外观」三档接线 ----
     那三枚按钮（浅色 / 深色 / 跟随系统）由 r85/r87 拍的 `ctlSeg()` 生成，此前是**纯装饰**：
     点击只切 `aria-pressed` + toast，不写任何状态、也不改任何东西。
     这里在 **document 捕获阶段**接一手 —— 先于 `ctlSeg()` 自己那个冒泡 handler 跑
     ⇒ 我们负责「落盘 + 切主题」，它照旧负责「pressed 与 toast」，两边不抢。 */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var b = t && t.closest ? t.closest('.r85-seg > .giencoder-btn') : null;
    if (!b || !b.parentElement) return;
    var kids = b.parentElement.children, k = 0, i;
    for (i = 0; i < kids.length; i++) { if (kids[i] === b) k = i; }
    set(['light', 'dark', 'auto'][k]);
  }, true);

  /* 初始 `aria-pressed` 回填：`ctlSeg()` 生成时**写死**「第 0 枚（浅色）= 真」，
     而默认档是 `auto` ⇒ 不回填的话，设置页会「显示浅色被选中、实际跟随系统」。
     ⚠ 面板是 React 晚挂的：脚本执行时 `.r85-seg` 还不存在 ⇒ 用一个**短命**的
       MutationObserver 等它出现，回填成功后立刻断开（最长 5s 兜底）。
     ⚠ 只在「没找到就重试」这条路上挂观察器：常规情况下 `syncSeg()` 一次就中，零开销。 */
  function syncSeg() {
    var seg = document.querySelector('.r85-seg');
    if (!seg || seg.children.length < 3) return false;
    var want = mode === 'light' ? 0 : (mode === 'dark' ? 1 : 2);
    for (var i = 0; i < seg.children.length; i++) {
      seg.children[i].setAttribute('aria-pressed', i === want ? 'true' : 'false');
    }
    return true;
  }
  if (!syncSeg()) {
    var mo = new MutationObserver(function () { if (syncSeg()) mo.disconnect(); });
    mo.observe(root, { childList: true, subtree: true });
    setTimeout(function () { mo.disconnect(); syncSeg(); }, 5000);
  }
})();
</script>
<style id="r109-dark-css">
  /* ★ r109 第四拍 ③-c：**全站 10 页的暗色适配层**（详情见本脚本文件头）。
     一句话：机制层只把 `giencoder-theme="dark"` 挂到 `<html>` 上；真正让页面变暗，
     得在这里把「不吃 token 的硬值」逐个换成 DS 暗色 token。
     ★ 作用域 `html[giencoder-theme='dark']`（= 机制层挂在 `<html>` 上的那个属性）。
       第三拍曾带 `:not([data-r93-page])` 把 conversation.html 排除（那一拍只做 5 页）；
       本拍**去掉** —— 全 10 页纳入。各页自带的页面级暗色档（见每页自己的
       `[giencoder-theme='dark']` 规则）也从这一刻起真正生效。
     ★ 浅色档一条都不生效 ⇒ 浅色零风险。
     ⚠ 本块注入在 `</head>` 前，而页面自定义的几块样式、以及第 92 / 101 两代顶栏装饰块
       都在 **body 内、排在本块之后** ⇒ 凡与它们竞争的一律靠**特异性**
       （前缀 `html[..]` 给到 0-1-1 起）或 `!important`。
     ⚠⚠ 写本块注释时**不得出现任何「注入块 id」的字面**（就是那些 `rNNN-xxx-css` 形式的名字）——
       apply109 的净底自检是「剥完块后 net 里不得再出现该 id」，注释里的字面会被它
       当成**残留标记** ⇒ 整条 apply 链当场报错退出（本拍真踩过，见 acceptance 二十九节）。 */

  /* ── ① shadcn HSL token 层 → DS 暗色 token ────────────────────────────────
     `body{background-color:hsl(var(--background));color:hsl(var(--foreground))}` 排在 DS 的
     `body{color:var(--color-text-1);background:var(--color-bg-1)}` 之后、同特异性 ⇒ 前者胜出；
     而这套 token 不在 DS 暗色档里翻转 ⇒ 暗色下 body 仍是浅底深字，满屏文字从 body 继承。
     ⚠ 消费方是 `hsl(var(--x))` ⇒ 这里必须写 **HSL 三元组**（每个值 = 右侧 DS token 换算而来）。 */
html[giencoder-theme='dark'] {
    --background: 240 6.122% 9.608%;   /* = --color-bg-1（页面底） */
    --foreground: 0 0% 96.86%;   /* = --color-text-1（正文） */
    --card: 240 1.408% 13.92%;   /* = --color-bg-2（卡片 / 容器面） */
    --card-foreground: 0 0% 96.86%;   /* = --color-text-1（卡片正文） */
    --popover: 240 2.128% 18.43%;   /* = --color-bg-3（浮层底） */
    --popover-foreground: 0 0% 96.86%;   /* = --color-text-1（浮层正文） */
    --primary: 0 0% 96.86%;   /* = --color-text-1（反转面（浅色下 near-black ⇒ 暗色下 near-white）） */
    --primary-foreground: 240 6.122% 9.608%;   /* = --color-bg-1（反转面上的字） */
    --secondary: 0 0% 16.86%;   /* = --color-fill-2（次级面） */
    --secondary-foreground: 0 0% 96.86%;   /* = --color-text-1（次级面上的字） */
    --muted: 0 0% 16.86%;   /* = --color-fill-2（弱化面） */
    --muted-foreground: 0 0% 66.28%;   /* = --color-text-3（弱化文字（次级说明）） */
    --accent: 0 0% 16.86%;   /* = --color-fill-2（强调面（hover 底）） */
    --accent-foreground: 0 0% 96.86%;   /* = --color-text-1（强调面上的字） */
    --border: 0 0% 30.59%;   /* = --color-border-2（全局描边（`*{border-color:hsl(var(--border))}`）） */
    --input: 0 0% 30.59%;   /* = --color-border-2（输入框描边） */
    --ring: 0 0% 41.96%;   /* = --color-border-3（焦点环） */
  }

  /* ── ② React 写死的内联 / Tailwind 字面色 → DS 暗色面（内联只能靠 `!important` 压）──────────── */
  /* 外壳 / 侧栏 / 内容区 */
  html[giencoder-theme='dark'] [class~="bg-[var(--color-fill-1)]"],
  html[giencoder-theme='dark'] .flex.h-dvh,
  html[giencoder-theme='dark'] .flex.min-h-0.flex-1 { background-color: var(--color-bg-1) !important; }
  /* 主面板 / 白卡 */
  html[giencoder-theme='dark'] .bg-white,
  html[giencoder-theme='dark'] .bg-white\/50 { background-color: var(--color-bg-2) !important; }
  /* 白卡的 hover 态（原文是 .hover\:bg-white:hover） */
  html[giencoder-theme='dark'] .hover\:bg-white:hover { background-color: var(--color-bg-3) !important; }
  /* 主面板描边 */
  html[giencoder-theme='dark'] [class~="border-[var(--color-border-1)]"] { border-color: var(--color-border-1) !important; }
  /* 分段控件轨道 */
  html[giencoder-theme='dark'] [class~="bg-[var(--color-border-2)]"] { background-color: var(--color-fill-3); }
  /* 分段控件轨道描边 */
  html[giencoder-theme='dark'] [class~="border-[var(--color-border-2)]"] { border-color: var(--color-fill-3); }
  /* 新建会话按钮（含内联的 inset 白色高光） */
  html[giencoder-theme='dark'] .new-chat-btn { background: var(--color-fill-2) !important; border-color: var(--color-border-1) !important; box-shadow: none !important; }
  /* 新建会话按钮 hover */
  html[giencoder-theme='dark'] .new-chat-btn:hover { background: var(--color-fill-3) !important; }
  /* 顶栏分隔条（内联 #E5E5E5） */
  html[giencoder-theme='dark'] [style*="background: rgb(229, 229, 229)"] { background-color: var(--color-border-2) !important; }
  /* 内联白底按钮 */
  html[giencoder-theme='dark'] [style*="background: rgb(255, 255, 255)"] { background-color: var(--color-bg-2) !important; }
  /* 设置页侧栏图标盒 .r85-ic（#6B6B6B ≡ --gray-7 浅） */
  html[giencoder-theme='dark'] .r85-ic { color: rgb(var(--gray-7)); }
  /* 蓝色 chip（#ECF2FF / #3770F7 / #D3E2FF ⇒ DS giencoderblue 1/6/2） */
  html[giencoder-theme='dark'] [style*="background: rgb(236, 242, 255)"] { background-color: rgb(var(--giencoderblue-1)) !important; color: rgb(var(--giencoderblue-6)) !important; border-color: rgb(var(--giencoderblue-2)) !important; }
  /* DS 次级按钮（内联 rgba 白底 + #1F1F1F 字 + 内白发光的整体覆盖） */
  html[giencoder-theme='dark'] [style*="background: rgba(255, 255, 255, 0.5)"] { background: var(--color-fill-2) !important; color: var(--color-text-1) !important; border-color: var(--color-border-1) !important; box-shadow: none !important; }
  /* 内联 #1F1F1F 字（≡ --color-text-1 浅，最多；「新会话」/ 菜单项 / skill 名） */
  html[giencoder-theme='dark'] [style*="color: rgb(31, 31, 31)"] { color: var(--color-text-1) !important; }
  /* 内联 #1E1E1E 字（模型菜单项 textColor，≈ --color-text-1 浅） */
  html[giencoder-theme='dark'] [style*="color: rgb(30, 30, 30)"] { color: var(--color-text-1) !important; }
  /* 内联 #6B6B6B 字（≡ --gray-7 浅 107,107,107） */
  html[giencoder-theme='dark'] [style*="color: rgb(107, 107, 107)"] { color: rgb(var(--gray-7)) !important; }
  /* 内联 #A9A9A9 字（≡ --gray-5 浅 169,169,169） */
  html[giencoder-theme='dark'] [style*="color: rgb(169, 169, 169)"] { color: rgb(var(--gray-5)) !important; }
  /* SVG fill #1F1F1F（≡ --color-text-1 浅） */

           （border-1 = gray-2、border-2 = gray-3、border-3 = gray-4）；
           但暗色档的灰度阶梯是浅色档的**镜像**（N 对应 11-N），
           于是同一索引在暗色下落在阶梯的亮端：
             浅（底 #fff = 255）   ：242 / 229 / 201  → 与底差 13 / 26 / 54
             暗旧（底 #17171a = 23）： 43 /  78 / 107  → 与底差 20 / 55 / 84
     修法：暗色档三个令牌各降一级（gray-2→1、gray-3→2、gray-4→3）得 31 / 43 / 78，
           与底差 8 / 20 / 55 ≈ 浅色档的 13 / 26 / 54。

           ③ 只动 border-1/2/3 —— border-4 与无后缀的那个令牌全站引用量为 0（死令牌）。 */
  body[giencoder-theme=dark],[giencoder-theme=dark]{

  /* ===== giencoder Select / DatePicker 交互绑定（注入 DOM 后执行） ===== */
  function bindComponents(root) {
    function $(s, r) { return (r || document).querySelector(s); }
    function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    /* ---- Select：展开/收起、选项互斥、清除、外部点击收起 ---- */
    $$('.giencoder-select', root).forEach(function (sel) {
      if (sel.classList.contains('giencoder-select-disabled') || sel._bound) return;
      sel._bound = true;
      var view = $('.giencoder-select-view', sel);
      var popup = $('.giencoder-select-popup', sel);
      if (!view || !popup) return;
      var options = $$('.giencoder-select-option', popup);
      var textEl = $('.giencoder-select-view-text', view);
      var clearBtn = $('.giencoder-select-clear', sel);
      var placeholder = textEl ? (textEl.getAttribute('data-placeholder') || '') : '';

      function open() {
        popup.style.display = '';
        requestAnimationFrame(function () { if (popup.isConnected) popup.classList.add('giencoder-popup-open'); });
        view.setAttribute('aria-expanded', 'true');
      }
      function close() {
        popup.classList.remove('giencoder-popup-open');
        setTimeout(function () {
          if (popup.isConnected && !popup.classList.contains('giencoder-popup-open')) popup.style.display = 'none';
        }, 200);
        view.setAttribute('aria-expanded', 'false');
      }
      function isOpen() { return popup.classList.contains('giencoder-popup-open'); }

      view.addEventListener('click', function (ev) { ev.stopPropagation(); isOpen() ? close() : open(); });
      view.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); isOpen() ? close() : open(); }
        if (ev.key === 'Escape') close();
      });
      options.forEach(function (opt) {
        opt.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (opt.classList.contains('giencoder-select-option-disabled')) return;
          options.forEach(function (o) { o.classList.remove('giencoder-select-option-selected'); o.setAttribute('aria-selected', 'false'); });
          opt.classList.add('giencoder-select-option-selected');
          opt.setAttribute('aria-selected', 'true');
          if (textEl) textEl.textContent = opt.textContent;
          sel.classList.add('giencoder-select-has-value');
          close();
        });
      });
      if (clearBtn) {
        clearBtn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          options.forEach(function (o) { o.classList.remove('giencoder-select-option-selected'); o.setAttribute('aria-selected', 'false'); });
          if (textEl) textEl.textContent = placeholder;
          sel.classList.remove('giencoder-select-has-value');
          close();
        });
      }
    });

    /* ---- DatePicker(range)：展开/收起、范围两击选择、月份导航、外部收起 ---- */
    $$('.giencoder-date-picker', root).forEach(function (picker) {
      if (picker._bound) return;
      picker._bound = true;
      var trigger = $('.giencoder-input-wrapper', picker);
      var popup = $('.giencoder-date-picker-popup', picker);
      var input = trigger ? $('.giencoder-input', trigger) : null;
      if (!trigger || !popup || !input) return;

      var isRange = picker.getAttribute('data-variant') === 'range';
      var range = { start: null, end: null };

      function setOpen(open) {
        trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) {
          popup.style.display = 'block';
          requestAnimationFrame(function () { if (popup.isConnected) popup.classList.add('giencoder-panel-open'); });
        } else {
          popup.classList.remove('giencoder-panel-open');
          setTimeout(function () {
            if (popup.isConnected && !popup.classList.contains('giencoder-panel-open')) popup.style.display = 'none';
          }, 200);
        }
      }
      trigger.addEventListener('click', function (ev) {
        ev.stopPropagation();
        setOpen(!popup.classList.contains('giencoder-panel-open'));
      });
      trigger.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') setOpen(false);
      });

      /* 月份导航：标题加减一月，range 变体第二面板联动 +1 月 */
      $$('.giencoder-calendar-nav', picker).forEach(function (nav) {
        nav.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var back = nav.getAttribute('aria-label') === '上个月';
          var delta = back ? -1 : 1;
          var cals = $$('.giencoder-calendar', picker);
          cals.forEach(function (cal, idx) {
            var title = $('.giencoder-calendar-title', cal);
            if (!title) return;
            var m = title.textContent.match(/(\d{4})年(\d{1,2})月/);
            if (!m) return;
            var y = +m[1], mo = +m[2] + delta * (isRange && idx === 1 ? 1 : 1);
            if (isRange) { /* 双面板保持相差一个月：统一按左面板推进 */ }
            if (mo < 1) { mo = 12; y -= 1; }
            if (mo > 12) { mo = 1; y += 1; }
            title.textContent = y + '年' + mo + '月';
          });
          if (isRange && cals.length > 1) {
            /* 右面板 = 左面板 + 1 月 */
            var lt = $('.giencoder-calendar-title', cals[0]).textContent.match(/(\d{4})年(\d{1,2})月/);
            var y = +lt[1], mo = +lt[2] + 1;
            if (mo > 12) { mo = 1; y += 1; }
            $('.giencoder-calendar-title', cals[1]).textContent = y + '年' + mo + '月';
          }
        });
      });

      /* 日期格点击：range 两击起止 / single 互斥选中；跨月与空格忽略 */
      $$('.giencoder-calendar-cell', picker).forEach(function (cell) {
        if (cell.classList.contains('giencoder-calendar-cell-empty')) return;
        cell.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (cell.classList.contains('giencoder-calendar-cell-other')) return;
          var day = parseInt(cell.textContent, 10);
          if (isNaN(day)) return;
          var cal = cell.closest('.giencoder-calendar');
          var title = cal ? $('.giencoder-calendar-title', cal) : null;
          var m = title ? title.textContent.match(/(\d{4})年(\d{1,2})月/) : null;
          var date = (m ? +m[1] : 2026) + '/' + pad2(m ? +m[2] : 8) + '/' + pad2(day);

          if (isRange) {
            if (!range.start || (range.start && range.end)) { range.start = date; range.end = null; }
            else { range.end = date; }
            input.value = range.end ? range.start + ' - ' + range.end : range.start;
            if (range.start && range.end) setOpen(false);
            return;
          }
          $$('.giencoder-calendar-cell', picker).forEach(function (c) { c.classList.remove('giencoder-calendar-cell-selected'); });
          cell.classList.add('giencoder-calendar-cell-selected');
          input.value = date;
          setOpen(false);
        });
      });
    });
  }
  document.addEventListener('click', function (ev) {

    document.querySelectorAll('.giencoder-select').forEach(function (sel) {

      var trigger = pk.querySelector('.giencoder-input-wrapper');
      if (popup && trigger && !pk.contains(ev.target)) {
        popup.classList.remove('giencoder-panel-open');
        setTimeout(function () { if (!popup.classList.contains('giencoder-panel-open')) popup.style.display = 'none'; }, 200);
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
  });


  /* ===== 需求看板：radio 切换 / 分页 / 加载状态机 ===== */
  function bindReqPage(wrap) {
    wrap.addEventListener('click', function (ev) {
      var tab = ev.target.closest ? ev.target.closest('.kb-radio-btn[data-goto]') : null;
      if (tab && !tab.classList.contains('is-on')) {
        var g = tab.getAttribute('data-goto');
        if (g) { location.href = g; return; }
      }
      var pgItem = ev.target.closest ? ev.target.closest('.giencoder-pagination-item') : null;
      if (pgItem && !pgItem.classList.contains('giencoder-pagination-item-ellipsis')) {
        var pg = wrap.querySelector('.giencoder-pagination');
        if (pg) {
          var nums = Array.prototype.filter.call(pg.querySelectorAll('.giencoder-pagination-item'), function (n) {
            return !n.hasAttribute('aria-label') && !n.classList.contains('giencoder-pagination-item-ellipsis');
          });
          var max = nums.length ? parseInt(nums[nums.length - 1].textContent, 10) : 1;
          var curIdx = 0;
          nums.forEach(function (n, idx) { if (n.classList.contains('giencoder-pagination-item-active')) curIdx = idx; });
          var targetIdx = curIdx;
          if (pgItem.hasAttribute('aria-label')) {
            var isPrev = pgItem.getAttribute('aria-label') === '上一页';
            targetIdx = Math.min(nums.length - 1, Math.max(0, curIdx + (isPrev ? -1 : 1)));
          } else {
            nums.forEach(function (n, idx) { if (n === pgItem) targetIdx = idx; });
          }
          nums.forEach(function (n) { n.classList.remove('giencoder-pagination-item-active'); n.removeAttribute('aria-current'); });
          nums[targetIdx].classList.add('giencoder-pagination-item-active');
          nums[targetIdx].setAttribute('aria-current', 'page');
          var prev = pg.querySelector('.rq-pg-prev');
          var next = pg.querySelector('.rq-pg-next');
          if (prev) prev.disabled = (parseInt(nums[targetIdx].textContent, 10) === 1);
          if (next) next.disabled = (parseInt(nums[targetIdx].textContent, 10) === max);
        }
      }
      var th = ev.target.closest ? ev.target.closest('.giencoder-table-th-sortable') : null;
      if (th) {
        var nextSort = th.getAttribute('data-sort') === 'asc' ? 'desc' : 'asc';
        th.setAttribute('data-sort', nextSort);
        th.setAttribute('aria-sort', nextSort === 'asc' ? 'ascending' : 'descending');
      }
    });
    var panel = wrap.querySelector('.rq-panel');
    if (panel && panel.getAttribute('data-state') === 'loading') {
      setTimeout(function () { if (panel.isConnected) panel.setAttribute('data-state', 'ready'); }, 800);
    }
  }

  /* ===== 智能助手悬浮球：按住可拖动 ===== */
  function bindFab(root) {
    var fab = root.querySelector('.kb-fab');
    if (!fab || fab._dragBound) return;
    fab._dragBound = true;
    var panel = fab.closest ? fab.closest('.kb-panel') : null;
    if (!panel) panel = fab.parentElement;
    var dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

    /* right/bottom 定位换算成 left/top，便于自由拖动 */
    function toLeftTop() {
      if (fab.style.left) return;
      var pr = panel.getBoundingClientRect(), fr = fab.getBoundingClientRect();
      fab.style.left = (fr.left - pr.left) + 'px';
      fab.style.top = (fr.top - pr.top) + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
    }
    function bounds() {
      return { x: Math.max(0, panel.clientWidth - fab.offsetWidth),
               y: Math.max(0, panel.clientHeight - fab.offsetHeight) };
    }
    function clamp(v, max) { return v < 0 ? 0 : (v > max ? max : v); }

    fab.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      toLeftTop();
      dragging = true; moved = false;
      sx = ev.clientX; sy = ev.clientY;
      ox = parseFloat(fab.style.left) || 0;
      oy = parseFloat(fab.style.top) || 0;
      fab.classList.add('is-dragging');
      try { fab.setPointerCapture(ev.pointerId); } catch (e) {}
      ev.preventDefault();
    });
    fab.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
      moved = true;
      var b = bounds();
      fab.style.left = clamp(ox + dx, b.x) + 'px';
      fab.style.top = clamp(oy + dy, b.y) + 'px';
    });
    function endDrag(ev) {
      if (!dragging) return;
      dragging = false;
      fab.classList.remove('is-dragging');
      try { fab.releasePointerCapture(ev.pointerId); } catch (e) {}
    }
    fab.addEventListener('pointerup', endDrag);
    fab.addEventListener('pointercancel', endDrag);
    /* 拖动结束后紧随的 click 不应触发悬浮球点击行为 */
    fab.addEventListener('click', function (ev) {
      if (moved) { moved = false; ev.stopImmediatePropagation(); ev.preventDefault(); }
    });
  }

  /* ===== 待介入卡片：橙色虚线持续流动 ===== */
  function bindDashedCards(root) {
    var NS = 'http://www.w3.org/2000/svg';
    Array.prototype.forEach.call(root.querySelectorAll('.kb-card.is-dashed'), function (card) {
      if (card.querySelector('.kb-card-dash')) return;
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'kb-card-dash');
      svg.setAttribute('aria-hidden', 'true');
      var rect = document.createElementNS(NS, 'rect');
      svg.appendChild(rect);
      card.insertBefore(svg, card.firstChild);
      function size() {
        var w = card.clientWidth, h = card.clientHeight;
        if (!w || !h) return;
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
        rect.setAttribute('x', '0.5');
        rect.setAttribute('y', '0.5');
        rect.setAttribute('width', String(Math.max(0, w - 1)));
        rect.setAttribute('height', String(Math.max(0, h - 1)));

        rect.setAttribute('ry', '7.5');
      }
      size();
      if (window.ResizeObserver) new ResizeObserver(size).observe(card);
      else window.addEventListener('resize', size);

  /* ===== 顶栏：kb-radio 跟随 kb-proj-select，固定 8px 间隙 ===== */
  function bindTopbar(root) {
    var sel = root.querySelector('.kb-proj-select');
    var radio = root.querySelector('.kb-radio');
    if (!sel || !radio) return;
    var GAP = 8;
    function place() {
      var host = radio.offsetParent || sel.parentElement;
      if (!host) return;
      var hr = host.getBoundingClientRect(), sr = sel.getBoundingClientRect();
      radio.style.left = Math.round(sr.right - hr.left + GAP) + 'px';
    }
    place();
    if (window.ResizeObserver) new ResizeObserver(place).observe(sel);
    else window.addEventListener('resize', place);
  }

  function inject() {
    var main = document.querySelector('main');
    if (!main || main.querySelector('.kb-panel')) return false;
    var wrap = document.createElement('div');
    wrap.className = 'kb-wrap';
    wrap.innerHTML = KB_HTML;
    main.appendChild(wrap);
    bindComponents(wrap);
    bindFab(wrap);
    bindTopbar(wrap);
    bindDashedCards(wrap);
    bindReqPage(wrap);
    return true;
  }
  if (!inject()) {
    var mo = new MutationObserver(function () { if (inject()) mo.disconnect(); });

<script>

         只改 hash，而外壳没有 hashchange 监听 → 点页签不跳转、也不重渲染，表现为「点了没反应」。
         实测 9 个页面（base/dev/kanban/req-kanban/task-detail/avatar/automation/skills/settings）全部如此。

         修复：在 document 捕获阶段接管点击（早于 React 的根监听，且不依赖 React 是否已挂载），
         按外壳自己的 route → 文件名映射直接跳转。stopPropagation 顺带阻止外壳自己那个
         「只改 hash」的 onClick，避免出现 `base.html#/dev` 这种半吊子状态。

         「当前分组」判定：优先用 DOM（aria-selected="true" 的页签），但**必须与实际文件名自洽** ——
         dev.html 上外壳把「基础工作台」标成了选中态（第 10 轮遗留的高亮错位），若只信 DOM，
         该页两个页签都会变成空操作。故：DOM 与文件一致才采信 DOM，否则回落到文件名分组。 */
      (function () {
        var FILE = { base: 'base.html', dev: 'dev.html' };
        var DEV_PAGES = { 'dev.html': 1, 'kanban.html': 1, 'req-kanban.html': 1, 'task-detail.html': 1 };
        var here = location.pathname.split('/').pop() || '';
        var fileGroup = DEV_PAGES[here] ? 'dev' : 'base';
        function groupOf() {
          var tl = document.querySelector('[role="tablist"][aria-label="工作台切换"]');
          var cur = tl && tl.querySelector('[data-tab][aria-selected="true"]');
          var dom = cur && cur.getAttribute('data-tab');
          if (dom && FILE[dom] === here) return dom;
          return fileGroup;
        }
        document.addEventListener('click', function (e) {
          var t = e.target;
          var btn = t && t.closest ? t.closest('[role="tablist"][aria-label="工作台切换"] [data-tab]') : null;
          if (!btn) return;

          if (!n || n === groupOf() || !FILE[n]) return;

           页签高亮与实际页面自相矛盾（实测该页 DOM 与 base.html 完全一致）。
           仅在「DOM 分组 ≠ 文件分组」时纠偏 —— 实测 9 页里只有 dev.html 命中，其余是空操作。
           形态与外挂一致：选中项 = 图标 + 完整文案，未选中项 = 去掉图标 + 前 2 字。
           图标直接从「原选中项」搬过来，不硬编码路径。 */

            if (btn.childNodes[i].nodeType === 3) btn.removeChild(btn.childNodes[i]);

        function reconcile() {
          var tl = document.querySelector('[role="tablist"][aria-label="工作台切换"]');
          if (!tl) return false;
          var btns = tl.querySelectorAll('[data-tab]');

    <!-- SHELL-NAV-FIX v5 —— 外壳导航通用兜底（公共模块修复，勿手改此块）
         背景：外壳 navigate() 在 http 下只改 hash 且无 hashchange 监听 → 侧栏「数字分身/自动化/技能/设置」、
         看板卡片、dev 页「进入研发工作台」等点击后 URL 变成 base.html#/avatar 但页面不动（「点了没反应」）。
         修复：监听 hashchange，把 #/route 还原成真实文件名跳转。用相对路径 → file:// 与 http 预览
         （/static-html/<id>/<file>）都能正确解析到同目录文件。
         路由表取全站并集：/task-detail 不在任何单页的 xt 里，只有本兜底能接住。 -->
    <script>
      (function () {
        var ROUTE = { '/': 'base.html', '/base': 'base.html', '/dev': 'dev.html', '/kanban': 'kanban.html',
                      '/req-kanban': 'req-kanban.html', '/task-detail': 'task-detail.html', '/avatar': 'avatar.html',
                      '/automation': 'automation.html', '/skills': 'skills.html', '/settings': 'settings.html', '/conversation': 'conversation.html' };
        var here = location.pathname.split('/').pop() || '';
        function go() {
          var r = location.hash.replace(/^#/, '').split('?')[0];
          if (!r) return;
          if (r.charAt(0) !== '/') r = '/' + r;
          var f = ROUTE[r];
          if (f && f !== here) location.replace(f);
        }
        window.addEventListener('hashchange', go);
        go();
      })();

<script id="r73-tab-relay">
/* SHELL-TAB-RELAY v1 —— 顶栏页签「跨页接力滑动」（勿手改此块）
   出发页记下滑块的渲染位置 → 到达页先用 translate 摆回旧位置、再滑到目标。
   用 translate 叠加而非改 left/width：本仓库 task-detail 的滑块位置被一条
   !important 规则钉死，内联 left/width 写不动它，translate 不在其管辖范围内。 */
(function () {
  var KEY = "r73-tab-relay";
  var TLS = '[role="tablist"][aria-label="工作台切换"]';
  var SPRING = "cubic-bezier(.34,1.56,.64,1)";
  var TRANS = "left .2s " + SPRING + ", width .2s " + SPRING + ", translate .2s " + SPRING;
  var TTL = 10000;

  function pick() {
    var tl = document.querySelector(TLS);
    if (!tl) return null;
    var sp = tl.querySelector("span[aria-hidden]");
    var cur = tl.querySelector('[data-tab][aria-selected="true"]');
    if (!sp || !cur) return null;
    return { tl: tl, sp: sp, key: cur.getAttribute("data-tab") };
  }

  /* ---------- A. 出发页：记下滑块的**渲染**几何 ---------- */
  window.addEventListener("click", function (e) {
    var t = e.target;
    var btn = t && t.closest ? t.closest(TLS + " [data-tab]") : null;
    if (!btn) return;
    var o = pick();
    if (!o) return;
    if (btn.getAttribute("data-tab") === o.key) return; /* 点的是当前页签：不记 */
    var r = o.sp.getBoundingClientRect();
    if (!(r.width > 0)) return;
    try {
      sessionStorage.setItem(KEY, JSON.stringify({
        from: o.key, left: r.left, width: r.width, t: Date.now()
      }));
    } catch (err) { /* 存储不可用则静默：退化为无接力 */ }
  }, true);

  /* ---------- B. 到达页：摆回出发位置，再滑到目标 ---------- */
  var from = null;
  try {
    var raw = sessionStorage.getItem(KEY);
    if (raw) { sessionStorage.removeItem(KEY); from = JSON.parse(raw); }
  } catch (e) { from = null; }
  if (from && (!(from.width > 0) || Date.now() - from.t > TTL)) from = null;
  if (!from) return;

  var booted = false;
  function boot() {
    if (booted) return true;
    var o = pick();
    if (!o) return false;
    booted = true;
    if (o.key === from.from) return true;          /* 刷新 / 点的就是当前页签：不接力 */
    var now = o.sp.getBoundingClientRect();
    if (!(now.width > 0)) return true;
    var dx = Math.round((from.left - now.left) * 100) / 100;
    if (Math.abs(dx) < 1) return true;             /* 位置一样：无位移可演 */

    o.sp.style.transition = "none";
    o.sp.style.translate = dx + "px 0px";          /* ① 摆到出发页签的位置（不带动画）*/
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        o.sp.style.transition = TRANS;             /* ② 交还过渡 */
        o.sp.style.translate = "0px 0px";          /*    并滑回自己的目标位 */
      });
    });
    return true;
  }

  /* 外壳是 React 异步挂载：先直接试，未就绪则等滑块出现 */
  function schedule() {
    requestAnimationFrame(function () {
      if (boot()) return;
      var mo = new MutationObserver(function () { if (boot()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
})();
</script>

  // 定位与基础工作台 Tn() 逐字一致：top = 锚点底 + 4、left = 锚点左；越界时兜底夹回视口。
  function place() {

    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  function show() {
    open = true;
    pop.hidden = false;

    place();

  function hide() {
    open = false;

    if (pop.contains(e.target) || trig.contains(e.target)) return;

  document.addEventListener('keydown', function (e) {
    if (!open || e.key !== 'Escape') return;

    hide();
  });
  window.addEventListener('resize', function () {
    if (open) place();
  });

  // —— 挂到顶栏左簇、红绿灯之后（外壳渲染晚于本脚本，用 MutationObserver 等）——
  function mount() {

    if (!left || left.tagName !== 'DIV') return false;

    var lights = left.children[0];
    if (!lights || !lights.querySelector('button[aria-label="关闭"]')) return false;
    if (left.querySelector('.r81-ws-trigger')) return true;
    var nxt = left.children[1];
    if (nxt) left.insertBefore(trig, nxt);
    else left.appendChild(trig);
    return true;
  }
  if (!mount()) {
    var mo = new MutationObserver(function () {
      if (mount()) mo.disconnect();
    });
    mo.observe(document.body, { childList: true, subtree: true });
  }

/* ★ 第 82 轮：研发工作台「需求看板 ↔ 任务看板」切换的滑动动效。
   背景：两个 tab 各占一页（data-goto 跳转），原先只有 is-on 的硬切换，没有过渡。
   做法：在 .kb-radio 里加一个绝对定位的 .kb-radio-thumb（白底 + 1px 描边 + radius 8），
        由 JS 按当前 is-on 按钮的 offset 就位；点击时先把它滑到目标按钮、再跳转；
        新页面加载时读 sessionStorage 里的来源 tab，使指示器「从来源滑到当前」——
        跨页看起来是一段连续的滑动。
   ⚠ .kb-radio 自身是 position:absolute（既有），故 thumb 的包含块就是它，
     left/top 直接取按钮的 offsetLeft/offsetTop，与容器 left 被 JS 改写无关。 */
.kb-radio-thumb {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  box-sizing: border-box;
  border: 1px solid var(--color-border-2);
  border-radius: 8px;
  background: var(--color-bg-1);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: left 220ms cubic-bezier(.4, 0, .2, 1), top 220ms cubic-bezier(.4, 0, .2, 1),
              width 220ms cubic-bezier(.4, 0, .2, 1), height 220ms cubic-bezier(.4, 0, .2, 1),
              opacity 120ms linear;
}
/* 指示器就位后才显示，避免首帧闪一下 */
.kb-radio--thumbed .kb-radio-thumb {
  opacity: 1;
}
/* 指示器接管视觉，原 is-on 自身的底/描边让位（保留 1px 边框占位，布局零变化） */
.kb-radio--thumbed .kb-radio-btn {
  position: relative;
  z-index: 1;
}
.kb-radio--thumbed .kb-radio-btn.is-on {
  background: transparent;
  border-color: transparent;
}

</style><script id="r82-tabs-js">

/* SHELL-KBTAB-SLIDE v1 —— 看板 tab 滑动动效（勿手改此块；落地脚本 mg-work/r82/apply82.py） */
/* 只改「怎么切」，不改「切换到哪」：data-goto / 目标页一律沿用既有标记。 */
(function () {
  if (window.__r82tabs) return;
  window.__r82tabs = 1;

  var KEY = 'giencoder-kb-tab-from';   /* 记「从哪个 tab 出发」，供目标页续滑 */
  var EASE = 220;                      /* 与 CSS transition 时长一致 */

  var host = null, thumb = null, busy = false;

  function q(sel, root) { return (root || document).querySelector(sel); }
  function onBtn() { return host && q('.kb-radio-btn.is-on', host); }
  function rectOf(b) { return { l: b.offsetLeft, t: b.offsetTop, w: b.offsetWidth, h: b.offsetHeight }; }

  function put(r, animate) {
    if (!thumb) return;
    if (!animate) thumb.style.transition = 'none';
    thumb.style.left = r.l + 'px';
    thumb.style.top = r.t + 'px';
    thumb.style.width = r.w + 'px';
    thumb.style.height = r.h + 'px';
    if (!animate) {
      void thumb.offsetWidth;          /* 强制回流，让「无动画落位」立即生效 */
      thumb.style.transition = '';
    }
  }

  /* 让指示器就位（无动画），用于首次挂载 / 尺寸变化 / 兜底 */
  function settle() {
    if (busy) return;
    var b = onBtn();
    if (b) put(rectOf(b), false);
  }

  function init() {
    host = q('.kb-radio');
    if (!host) return false;
    var btns = host.querySelectorAll('.kb-radio-btn');
    if (btns.length < 2) return false;
    if (q('.kb-radio-thumb', host)) { settle(); return true; }

    thumb = document.createElement('span');
    thumb.className = 'kb-radio-thumb';
    thumb.setAttribute('aria-hidden', 'true');
    host.insertBefore(thumb, host.firstChild);
    host.classList.add('kb-radio--thumbed');

    var cur = onBtn();
    if (!cur) return true;

    /* 上一页留下的来源 tab → 先落到来源位置，再滑到当前（跨页续滑） */
    var from = null;
    try { from = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {}
    if (from) {
      var src = null;
      for (var i = 0; i < btns.length; i++) {
        if (btns[i] !== cur && btns[i].getAttribute('data-goto') === from) { src = btns[i]; break; }
      }
      if (src) {
        put(rectOf(src), false);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { put(rectOf(cur), true); });
        });
        /* 字体/选择器宽度稳定后再纠一次位 */
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { settle(); });
        return true;
      }
    }
    put(rectOf(cur), false);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { settle(); });
    return true;
  }

  /* 点击：先把指示器滑到目标，再跳转（capture 先于页面既有的 location.href 处理器） */
  document.addEventListener('click', function (ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest('.kb-radio-btn[data-goto]') : null;
    if (!t || !host || !host.contains(t)) return;
    if (t.classList.contains('is-on')) { ev.preventDefault(); ev.stopPropagation(); return; }
    var goto = t.getAttribute('data-goto');
    if (!goto) return;
    ev.preventDefault();
    ev.stopPropagation();

    try { sessionStorage.setItem(KEY, goto); } catch (e) {}

    var cur = onBtn();
    busy = true;
    if (cur) {
      /* 图标（.kb-radio-ico）只在激活态的按钮上；整体搬过去，按钮宽度才与激活态一致 */
      var ico = q('.kb-radio-ico', cur);
      cur.classList.remove('is-on');
      cur.setAttribute('aria-selected', 'false');
      t.classList.add('is-on');
      t.setAttribute('aria-selected', 'true');
      if (ico && !q('.kb-radio-ico', t)) t.appendChild(ico);
    }
    if (thumb) {
      var r = rectOf(t);
      requestAnimationFrame(function () {
        thumb.style.left = r.l + 'px';
        thumb.style.top = r.t + 'px';
        thumb.style.width = r.w + 'px';
        thumb.style.height = r.h + 'px';
      });
    }
    setTimeout(function () { location.href = goto; }, EASE + 40);
  }, true);

  if (!init()) {
    var mo = new MutationObserver(function () { if (init()) mo.disconnect(); });
    mo.observe(document.body, { childList: true, subtree: true });
  }
  /* 容器尺寸变化（项目选择器变宽 / 字体就绪）→ 纠位 */
  if (window.ResizeObserver) {
    window.addEventListener('load', function () {
      if (host) new ResizeObserver(function () { settle(); }).observe(host);
    });
  }
})();

/* r93 ④ · 会话详情已独立成页（pages/conversation.html）
   —— 基础工作台只需要把「点 aside 里的会话任务标题」接到那一页去。
   背景：aside 是外壳 React 渲染的，拿不到它的 onClick，只能在捕获阶段识别（先例 r86/r88）。 */
(function () {
  'use strict';
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var b = t.closest('aside button');
    if (!b) return;
    var cl = b.classList;
    /* 会话项 = `min-w-0 flex-1` 的那 13 个（实测）；分组标题 = `rounded-md py-0` 的那 4 个，
       点它是折叠/展开，不能跳页；其余（新会话 / 数字分身 / 自动化 / 技能 / 设置）交给外壳。 */
    if (!(cl.contains('min-w-0') && cl.contains('flex-1'))) return;
    location.href = 'conversation.html';
  }, true);
})();
