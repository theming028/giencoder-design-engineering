  <header class="td-browse-bar">
    <div class="td-browse-tabs" role="tablist" aria-label="侧栏模块">
      <div class="td-browse-tab is-active" role="tab" aria-selected="true" tabindex="0" data-td-tab="1" data-td-mod="summary" aria-controls="av-browse-pane-summary">
        <span class="td-tab-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg></span>
        <span class="td-tab-name">摘要</span>
        <button class="td-tab-x" type="button" tabindex="-1" aria-label="关闭「摘要」标签" data-td-tab-x="1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
    </div>
    <button class="td-browse-add" type="button" aria-label="新建标签" aria-haspopup="menu" aria-expanded="false" title="新建标签" data-td-add="1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    <div class="td-mod-menu giencoder-dropdown-popup" role="menu" aria-label="选择要在侧栏打开的模块" hidden>
      <div class="td-mm-cap giencoder-menu-group-title">在侧栏打开</div>
      <button class="td-mm-item giencoder-dropdown-item" type="button" role="menuitem" data-td-open-mod="summary"><span class="td-mm-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg></span><span class="td-mm-name">摘要</span><span class="td-mm-key">⌘I</span></button>
      <button class="td-mm-item giencoder-dropdown-item" type="button" role="menuitem" data-td-open-mod="review"><span class="td-mm-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v12"/><path d="m4 13 3 3 3-3"/><path d="M17 20V8"/><path d="m14 11 3-3 3 3"/></svg></span><span class="td-mm-name">审查</span><span class="td-mm-key">⇧⌘G</span></button>
      <button class="td-mm-item giencoder-dropdown-item" type="button" role="menuitem" data-td-open-mod="terminal"><span class="td-mm-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 4 4-4 4"/><path d="M13 16h6"/></svg></span><span class="td-mm-name">终端</span><span class="td-mm-key">⌃`</span></button>
      <button class="td-mm-item giencoder-dropdown-item" type="button" role="menuitem" data-td-open-mod="browser"><span class="td-mm-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 3.2 2.6 14.8 0 18"/><path d="M12 3c-2.6 3.2-2.6 14.8 0 18"/></svg></span><span class="td-mm-name">浏览器</span><span class="td-mm-key">⌘T</span></button>
      <button class="td-mm-item giencoder-dropdown-item" type="button" role="menuitem" data-td-open-mod="files"><span class="td-mm-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h11.5l3.5 5.5v13a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5v-17A1.5 1.5 0 0 1 4 2Z"/><path d="M7.5 9.5h6.5"/><path d="M6.5 13h3.5"/><path d="M7 16.5h3.5"/></svg></span><span class="td-mm-name">文件</span><span class="td-mm-key">⌘P</span></button>
    </div>
    <span class="td-browse-sep"></span>
    <div class="td-browse-acts">
      <button class="td-browse-ico" type="button" aria-label="收起侧栏" title="收起侧栏" data-td-browse-close="1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </header>
