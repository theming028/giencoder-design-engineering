*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;height:560px}
:root{--color-border-1:#ECEEF2;--color-text-2:#6B6B6B;--color-fill-1:#F4F5F6;--color-text-1:#1F1F1F}
.stage{transform:scale(2);transform-origin:0 0;width:180px;height:280px;position:relative;background:#fff;display:flex;align-items:flex-end}
/* 复刻 base.html 中的真实结构 */
.toolbar{display:flex;align-items:center;gap:8px}
.giencoder-select{font-size:14px;color:#1F1F1F;display:inline-flex;position:relative;flex-direction:row;align-items:flex-start}
.add-btn{width:32px;height:32px;border-radius:9999px;border:1px solid var(--color-border-1);background:#fff;color:var(--color-text-2);display:flex;align-items:center;justify-content:center}
.add-menu{position:absolute;left:0;bottom:calc(100% + 4px);width:180px;height:92px;background:#FFFFFF;border-radius:8px;box-shadow:0px 8px 20px 0px rgba(0, 0, 0, 0.1), inset 0 0 0 1px #E5E5E5;backdrop-filter:blur(20px);z-index:9999}
.add-menu-item{position:absolute;width:168px;height:32px;border-radius:4px;cursor:pointer;transition:background-color .1s ease}
.add-menu-item:hover,.add-menu-item.force-hover{background:#F2F2F2}
.add-menu .icon{position:absolute;left:10px;top:9px;width:14px;height:14px}
.add-menu .txt{position:absolute;left:32px;top:5px;height:22px;font:400 14px/22px MiSans,-apple-system,system-ui,sans-serif;color:#1F1F1F;white-space:nowrap}
