    <style>
      *,*::before,*::after { box-sizing: border-box }
      body {
        padding: 0;
        margin: 0;
        font-family: "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      }
      p { margin: 0 }

      /* 设计令牌（giencoder design system） */
      :root {
        --color-fill-1: #F7F7F7;          /* gray-1 */
        --color-text-1: #1F1F1F;          /* gray-10 */
        --color-border-2: #E5E5E5;        /* gray-3 */
        --color-neutral-7: #6B6B6B;       /* gray-7 */
        --color-primary-light-2: #DAE4FE; /* giencoderblue-2 */
        --color-white: #FFFFFF;
      }

      .awd-root { width: 500px; height: 318px; position: relative }

      .awd-card { width: 500px; height: 200px; position: absolute; left: 0px; top: 54px; z-index: 0 }
      .awd-card-bg { width: 500px; height: 200px; background: var(--color-fill-1); border-radius: 24px; position: absolute; left: 0px; top: 0px; z-index: 0 }
      .awd-card-frame { position: absolute; left: 16px; top: 16px; z-index: 1 }
      .awd-card-center { width: 122px; height: 120px; position: absolute; left: 189px; top: 40px; z-index: 2 }

      .awd-link { width: 122px; height: 32px; display: flex; justify-content: flex-start; align-items: center; gap: 6px; padding-top: 5px; padding-bottom: 5px; padding-right: 16px; padding-left: 16px; background: var(--color-fill-1); border-radius: 32px; position: absolute; left: 0px; top: 88px; z-index: 0; overflow: hidden }
      .awd-link-icon { width: 14px; height: 14px; color: var(--color-neutral-7) }
      .awd-link-text { color: var(--color-text-1); font-size: 14px; line-height: 22px }

      .awd-illustration { position: absolute; left: 11px; top: 0px; z-index: 1 }

      .awd-divider { width: 400px; height: 22px; display: flex; justify-content: center; align-items: center; gap: 16px; position: absolute; left: 50px; top: 0px; z-index: 1; overflow: hidden }
      .awd-divider-line { width: 79px; height: 1px; color: var(--color-border-2) }
      .awd-divider-text { display: flex; justify-content: center; align-items: flex-start; flex-direction: column; overflow: hidden }
      .awd-divider-text span { color: var(--color-text-1); font-size: 14px; line-height: 22px }

      .awd-button { width: 468px; height: 40px; display: flex; justify-content: center; align-items: center; gap: 4px; padding-top: 7px; padding-bottom: 7px; padding-right: 20px; padding-left: 20px; background: var(--color-primary-light-2); border-radius: 8px; position: absolute; left: 16px; top: 278px; z-index: 2; overflow: hidden }
      .awd-button-text { color: var(--color-white); font-size: 14px; font-weight: 500; line-height: 22px }
    </style>
