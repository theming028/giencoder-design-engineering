/* r12: main 容器背景 = 波点/点阵 + 弥散渐变（mesh gradient）
   5 层 background-image：点阵在最上层，其下 4 个大半径软色团互相叠合形成弥散色雾；
   全部取 Token 三元组（--giencoderblue/--purple/--cyan/--pinkpurple），不硬编码色值 */
.dot-bg{background-image:radial-gradient(circle, rgba(var(--gray-7), 0.1) 1.5px, transparent 1.5px);background-size:20px 20px;}
[giencoder-theme='dark'] .dot-bg{background-image:radial-gradient(circle, rgba(var(--gray-7), 0.1) 1.5px, transparent 1.5px);background-size:20px 20px;}
/* ★ 第 67 轮：main 容器背景升级为「动态波点」（方案 A+D 鼠标版）
   A 层 = 上面两条 r12 规则里的浅点阵：色彩与位置**完全不变**（无任何动画）；
   D 层（::before）：再叠一层深一档的点阵，用 mask 圆形光斑把可见范围收进光斑内，
        光斑圆心由指针位置驱动（见页尾注入的脚本块），配 CSS 过渡 ⇒ 平滑跟随。
   注意 @property 的两点：
     ① 必须注册为 <percentage> 类型，否则 transition 对自定义属性不插值、会瞬间跳变；
     ② inherits 必须是 true —— JS 无法直接改伪元素样式，圆心变量只能写在 .dot-bg 上、
        再由 ::before 继承下来。
   层级：main 是 static、无 stacking context，其唯一子元素是 relative；
        ::before 在 tree order 上位于内容之前 ⇒ 与内容同属绘制步骤 6，内容压在其上。
   仅动 mask 圆心，不改任何布局尺寸。 */
@property --dot-x { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
@property --dot-y { syntax: '<percentage>'; inherits: true; initial-value: 46%; }
/* position:relative 只作为 ::before 的定位参照，不改变 flex item 的布局尺寸；
   过渡写在主元素上：值平滑变化后由 ::before 继承，比写在伪元素上更可靠 */
.dot-bg { position: relative; transition: --dot-x 260ms ease-out, --dot-y 260ms ease-out; }
/* D 层：深一档点阵 + 光斑 mask。inset:0 与 main 的 padding box 对齐 ⇒ 两层网格原点一致，
   深色点阵与旧版浅点阵逐点重合，只是"被照亮"。 */
.dot-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, rgba(var(--gray-8), 0.22) 1.5px, transparent 1.5px);
  background-size: 20px 20px;
  -webkit-mask-image: radial-gradient(circle 420px at var(--dot-x) var(--dot-y), #000 0%, rgba(0, 0, 0, 0.55) 42%, transparent 78%);
  mask-image: radial-gradient(circle 420px at var(--dot-x) var(--dot-y), #000 0%, rgba(0, 0, 0, 0.55) 42%, transparent 78%);
}
@media (prefers-reduced-motion: reduce) {
  /* 指针跟随属交互响应、保留；只去掉缓动，让光斑瞬时到位。 */
  .dot-bg { transition: none; }
}

/* r87 · 全局界面字号（唯一旋钮 = --ui-fs）
   --ui-fs = 当前界面基准字号（px，无单位）；14 = 默认档。
   11 个 DS 字号 token 全部由它派生 ⇒ 改一处，全站文字等比缩放。
   ratio = 1（默认档）时全部派生值 = 原值 ⇒ 零几何回归。
   本块覆盖规则一律加 body 前缀，特异性高于任何后置的普通规则，与脚本执行顺序无关。

        var here = location.pathname.split('/').pop() || '';

         路由表取全站并集：/task-detail 不在任何单页的 xt 里，只有本兜底能接住。 -->
    <script>
      (function () {
        var ROUTE = { '/': 'base.html', '/base': 'base.html', '/dev': 'dev.html', '/kanban': 'kanban.html',
                      '/req-kanban': 'req-kanban.html', '/task-detail': 'task-detail.html', '/avatar': 'avatar.html',
                      '/automation': 'automation.html', '/skills': 'skills.html', '/settings': 'settings.html', '/conversation': 'conversation.html' };
        var here = location.pathname.split('/').pop() || '';
        function go() {
          var r = location.hash.replace(/^#/, '').split('?')[0];

<!-- DOT-SPOT v1 · main 的深色点阵光斑跟随指针（勿手改此块）

     —— JS 无法直接改伪元素样式。
     用文档级事件委托、而不是直接给 main 绑定：本块在页面末尾同步执行时，外壳的 main
     还没渲染出来（React 异步挂载），此时 querySelector 只会拿到 null、监听器永远绑不上。
     只在指针落到 main 内时更新；移出后保持最后位置，不回弹。
     仅写入两个百分比变量；指针移动事件用 rAF 节流，每帧至多一次。 -->
    <script>
      (function () {
        var raf = 0, px = null, py = null, host = null;
        function apply() {
          raf = 0;
          if (!host || px === null) return;
          host.style.setProperty('--dot-x', px.toFixed(2) + '%');
          host.style.setProperty('--dot-y', py.toFixed(2) + '%');
        }
        document.addEventListener('pointermove', function (e) {
          var t = e.target;
          var m = t && t.closest ? t.closest('main.dot-bg') : null;
          if (!m) return;
          var r = m.getBoundingClientRect();
          if (!r.width || !r.height) return;
          host = m;
          px = (e.clientX - r.left) / r.width * 100;
          py = (e.clientY - r.top) / r.height * 100;
          if (!raf) raf = requestAnimationFrame(apply);
        }, { passive: true });
      })();

<script id="r73-tab-relay">
/* SHELL-TAB-RELAY v1 —— 顶栏页签「跨页接力滑动」（勿手改此块）
   出发页记下滑块的渲染位置 → 到达页先用 translate 摆回旧位置、再滑到目标。
   用 translate 叠加而非改 left/width：本仓库 task-detail 的滑块位置被一条
   !important 规则钉死，内联 left/width 写不动它，translate 不在其管辖范围内。 */
(function () {
  var KEY = "r73-tab-relay";
  var TLS = '[role="tablist"][aria-label="工作台切换"]';
  var SPRING = "cubic-bezier(.34,1.56,.64,1)";
  var TRANS = "left .2s " + SPRING + ", width .2s " + SPRING + ", translate .2s " + SPRING;
  var TTL = 10000;

  function pick() {
    var tl = document.querySelector(TLS);
    if (!tl) return null;
    var sp = tl.querySelector("span[aria-hidden]");
    var cur = tl.querySelector('[data-tab][aria-selected="true"]');
    if (!sp || !cur) return null;
    return { tl: tl, sp: sp, key: cur.getAttribute("data-tab") };
  }

  /* ---------- A. 出发页：记下滑块的**渲染**几何 ---------- */
  window.addEventListener("click", function (e) {
    var t = e.target;
    var btn = t && t.closest ? t.closest(TLS + " [data-tab]") : null;
    if (!btn) return;
    var o = pick();
    if (!o) return;
    if (btn.getAttribute("data-tab") === o.key) return; /* 点的是当前页签：不记 */
    var r = o.sp.getBoundingClientRect();
    if (!(r.width > 0)) return;
    try {
      sessionStorage.setItem(KEY, JSON.stringify({
        from: o.key, left: r.left, width: r.width, t: Date.now()
      }));
    } catch (err) { /* 存储不可用则静默：退化为无接力 */ }
  }, true);

  /* ---------- B. 到达页：摆回出发位置，再滑到目标 ---------- */
  var from = null;
  try {
    var raw = sessionStorage.getItem(KEY);
    if (raw) { sessionStorage.removeItem(KEY); from = JSON.parse(raw); }
  } catch (e) { from = null; }
  if (from && (!(from.width > 0) || Date.now() - from.t > TTL)) from = null;
  if (!from) return;

  var booted = false;
  function boot() {
    if (booted) return true;
    var o = pick();
    if (!o) return false;
    booted = true;
    if (o.key === from.from) return true;          /* 刷新 / 点的就是当前页签：不接力 */
    var now = o.sp.getBoundingClientRect();
    if (!(now.width > 0)) return true;
    var dx = Math.round((from.left - now.left) * 100) / 100;
    if (Math.abs(dx) < 1) return true;             /* 位置一样：无位移可演 */

    o.sp.style.transition = "none";
    o.sp.style.translate = dx + "px 0px";          /* ① 摆到出发页签的位置（不带动画）*/
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        o.sp.style.transition = TRANS;             /* ② 交还过渡 */
        o.sp.style.translate = "0px 0px";          /*    并滑回自己的目标位 */
      });
    });
    return true;
  }

  /* 外壳是 React 异步挂载：先直接试，未就绪则等滑块出现 */
  function schedule() {
    requestAnimationFrame(function () {
      if (boot()) return;
      var mo = new MutationObserver(function () { if (boot()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
})();
</script>

    var L2 = '\u4e2d\u7535\u91d1\u4fe1\u7814\u7a76\u9662 \u00b7 \u6570\u5b57\u6784\u5efa\u5e73\u53f0\u5b9e\u9a8c\u5ba4\uff08PAA\uff09 \u00b7 \u7248\u672c\uff1a1.2.5';
    function run() {
      var host = document.querySelector('main div[class*="pb-6"][class*="text-center"]');
      if (!host) return false;
      var ps = host.querySelectorAll('p');
      if (ps.length < 2) return false;
      /* 第 77 轮 · 需求 3：「内容由 AI 生成，请核实重要信息」要落在最下面。
         第 74 轮抓的是「最后一个 p」—— 那时源码顺序是 [AI 提示句, © 一整行]，
         拆完正好三行。本轮源码两行已调成 [© 一整行, AI 提示句]，若仍拆最后一个 p
         就会把提示句整句盖掉（实测渲染成「© … 版本：1.2.5」+「© 2026 中电金信」
         +「中电金信研究院 · …」三行，提示句消失）。
         故改为抓「第一个 p」（© 那一整行）来拆，新行插在它紧后面 —— 提示句自然

  })();

    }

  })();

    var EASE = 'cubic-bezier(0.34, 0.69, 0.1, 1)';
    var SEL = 'body > div[style*="position: fixed"], [role="menu"], [role="listbox"]';

        SNAP.set(el, {
          html: el.outerHTML,
          x: r.left, y: r.top,
          /* 用 offsetWidth/Height 而不是 rect：进场动画带 scale(.97) 时 rect 会缩水 */
          w: el.offsetWidth || r.width, h: el.offsetHeight || r.height,
          z: getComputedStyle(el).zIndex

      SNAP.forEach(function (v, k) { if (!k.isConnected) SNAP.delete(k); });
      if (SNAP.size && !mo) start();
    }

    function start() {
      if (mo) return;
      mo = new MutationObserver(function (muts) {
        var i, j, m;
        for (i = 0; i < muts.length; i++) {
          m = muts[i];
          if (m.type === 'childList') {
            for (j = 0; j < m.removedNodes.length; j++) {
              if (m.removedNodes[j].nodeType === 1) fire(m.removedNodes[j]);
            }
          } else if (m.attributeName === 'style') {
            fire(m.target);
          }
        }
        if (!SNAP.size) stop();
      });
      mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
    }

    function stop() {
      if (!mo) return;
      mo.disconnect();
      mo = null;
    }

    function fire(el) {
      var rec = SNAP.get(el);
      if (!rec) return;
      SNAP.delete(el);
      var g = document.createElement('div');
      g.setAttribute('data-r74-ghost', '1');
      g.setAttribute('aria-hidden', 'true');
      g.style.cssText = 'position:fixed;left:' + rec.x + 'px;top:' + rec.y + 'px;width:' + rec.w +
        'px;height:' + rec.h + 'px;z-index:' + (parseInt(rec.z, 10) || 1000) +
        ';pointer-events:none;overflow:hidden;';
      g.innerHTML = rec.html;
      (function strip(node) {
        if (node.nodeType !== 1) return;
        if (node.hasAttribute && node.hasAttribute('id')) node.removeAttribute('id');
        var kids = node.children || [];
        for (var i = 0; i < kids.length; i++) strip(kids[i]);
      })(g);
      document.body.appendChild(g);
      var done = function () { if (g.parentNode) g.parentNode.removeChild(g); };
      try {
        var anim = g.animate(
          [{ opacity: 1, transform: 'translateY(0) scale(1)' },
           { opacity: 0, transform: 'translateY(4px) scale(0.97)' }],
          { duration: DUR, easing: EASE, fill: 'forwards' }
        );
        if (anim && anim.finished) anim.finished.then(done, done);
        else setTimeout(done, DUR + 60);
      } catch (err) {
        done();
      }
    }

    document.addEventListener('click', snap, true);
    document.addEventListener('keydown', snap, true);
  })();
})();

<style id="r75-base-css">
  /* ★ 第 75 轮 · 需求 7（补齐）：基础工作台的下拉浮窗补上「显示 / 关闭」动效。

     浮窗又额外写了一条内联的 display:none（实测内联值就是 display: none;）

       （实测：getAnimations() 全程为空、首帧即到终值，进出两个方向都是硬跳）。

     修法：把内联 display:none 让位给设计系统自带的不可见态。
     浮窗本身是绝对定位、不占文档流；不可见元素既不接收指针事件、也不进无障碍树，

     这样与「数字分身」页里同组件的浮窗逐帧同构

    display: block !important;

     实测三类叠加缺陷：
       ① 定位 —— 被克隆的浮窗自带内联定位（如 bottom: calc(100% + 4px)），

    top: 0 !important;

    bottom: auto !important;
    margin: 0 !important;
    transform: none !important;
    width: 100% !important;
    height: 100% !important;

    animation: r76-ripple-out 300ms linear both;
  }
  /* 波前用 linear 推进（缓动会在中段把半径一次推到接近终值，看不出「扩散」），
     分段关键帧只负责「先起、后收」的不透明度包络。 */
  @keyframes r76-ripple-out {
    0% {
      --r74-rip-r: 0px;
      opacity: 0;
    }
    6% {
      opacity: 1;
    }
    62% {
      --r74-rip-r: calc(var(--r76-rip-cap) * 0.62);
      opacity: 0.98;
    }
    100% {
      --r74-rip-r: var(--r76-rip-cap);
      opacity: 0;
    }
  }
  /* 减动画偏好：元素仍要播完并自毁（若直接不渲染，脚本就收不到播放结束事件、
     节点会一直留在 main 里），所以只把时长压到不可感知。 */
  @media (prefers-reduced-motion: reduce) {
    .r74-ripple {
      animation-duration: 1ms;
    }
  }

  /* ★ 第 76 轮 · 需求 4：纵向空间不足时，「技能选择」浮窗不再被裁掉。

     实测（1440 宽 × 560/640/720/800/900 五档，与宽度无关）：
     浮窗按内联规则挂在输入卡正上方，卡顶 = 视口高的一半减去 62px，
     故浮窗可用高 = 卡顶 - 8 - main 顶 = 视口高的一半减去 118px。
     视口高低于约 876 时该值小于 320（浮窗自身的内联高），
     上缘就冲出 main 的顶，被输入卡 / main / 根容器三层裁切
     （实测溢出 77.3px @ 720、157.3px @ 560）。
     修法：只夹 max-height —— 内联规则给的是 height，max-height 天然可压过它；
     被压掉的高度由浮窗内既有的可滚动列表承载。
     纯声明式 ⇒ 窗口缩放自动跟随，不需要脚本，也不与 React 的内联样式打架。 */
  [role="listbox"][aria-label="技能选择"][style*="position: absolute"] {
    max-height: calc(50vh - 120px);
  }
  /* 压扁后列表转为可滚，内容会在半行处被切断；浮窗底是半透明白 + 背景模糊，
     那半行文字会透出来、像是"串"到下方按钮条上。给列表补一道底部渐隐收口。
     ⚠️ 只在 max-height 真正生效的区间启用：其门槛 = 50vh − 120 < 320 ⇒ 视口高 < 880。
        自然高度下（≥880）这条完全不命中 ⇒ 零影响。
     选择器带 [aria-label="技能选择"] 祖先 —— 该浮窗只在 base.html 渲染，
     其余页面的 .skill-pop-list 拷贝不会被波及。 */
  @media (max-height: 879px) {
    [role="listbox"][aria-label="技能选择"] .skill-pop-list {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 52px), transparent 100%);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 52px), transparent 100%);
    }
  }
</style>
<style id="r77-base-css">

       ① .dot-bg 本身的浅点阵（浅色主题 + 深色主题各一条）；
       ② .dot-bg::before 的深一档点阵（指针光斑照亮的那层）；
       ③ .r74-ripple 点击涟漪的点阵层。

  .dot-bg,

  .r74-ripple {

        tree order 天然压在内容之下 —— 即对话框（composer 白卡）会盖住它。
        故把层级还原成 0（第 74 轮原值），只改这一处即可。
     ② 强度：第 76 轮为了「明显」把点色 α 提到 0.62、点径提到 1.8px，
        邵先生反馈「新的涟漪效果太过明显，至少需要减半」。

          本轮  α 0.28 ⇒ 合成 rgb(196)，Δ=59 —— 恰为上一轮的一半。
        点径顺手由 1.8px 收 1.7px（环更细一点，更像水面），环带形态
        （第 76 轮那套 max(比例, 固定值) 的整流 mask）与 300ms 时长不动。 */
  .r74-ripple {
    z-index: 0;
    background-image: radial-gradient(circle, rgba(var(--gray-9), 0.28) 1.7px, transparent 1.7px);
  }
</style>
<style id="r78-base-css">
  /* 第 78 轮 · 需求 2：涟漪强度再减半。

     邵先生反馈「还是太明显」⇒ 本轮 α 再砍一半到 0.14：
       合成 rgb(212) ⇒ Δ≈28，恰为第 77 轮的一半
       （本组合下 α 与 Δ 成正比：Δ = (底色 - 描点色) × α，底色与描点色都不变）。
     只动点色这一项 —— 点径 1.7px、环带 mask（第 76 轮那套 max(比例, 固定值) 整流公式）、
     半径上限 480px、时长 300ms 全部保持不变。
     ⚠️ 落点必须在 </body> 前（第 77 轮块之后）：同为 .r74-ripple（特异性 0-1-0），
        只能靠文档顺序取胜 —— 与第 77 轮压回第 76 轮同一机制。 */
  .r74-ripple {
    background-image: radial-gradient(circle, rgba(var(--gray-9), 0.14) 1.7px, transparent 1.7px);
  }
</style>
<style id="r92-hdr-css">

<script id="r102-nav-js">
/* r93 ④ · 会话详情已独立成页（pages/conversation.html）
   —— 基础工作台只需要把「点 aside 里的会话任务标题」接到那一页去。
   背景：aside 是外壳 React 渲染的，拿不到它的 onClick，只能在捕获阶段识别（先例 r86/r88）。 */
(function () {
  'use strict';
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var b = t.closest('aside button');
    if (!b) return;
    var cl = b.classList;
    /* 会话项 = `min-w-0 flex-1` 的那 13 个（实测）；分组标题 = `rounded-md py-0` 的那 4 个，
       点它是折叠/展开，不能跳页；其余（新会话 / 数字分身 / 自动化 / 技能 / 设置）交给外壳。 */
    if (!(cl.contains('min-w-0') && cl.contains('flex-1'))) return;
    location.href = 'conversation.html';
  }, true);
})();
</script>
