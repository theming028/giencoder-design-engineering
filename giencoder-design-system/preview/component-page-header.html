<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>页头 PageHeader</title>
  <link rel="stylesheet" href="preview-scaffold.css">
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    /* PageHeader 预览局部样式（Token 驱动，无硬编码色值） */
    .giencoder-page-header { padding: 16px 20px; background: var(--color-bg-2); border: 1px solid var(--color-border-1); border-radius: var(--border-radius-medium); font-family: var(--font-family); }
    .giencoder-page-header-title { font-size: var(--font-size-title-1); font-weight: 600; color: var(--color-text-1); }
    /* 标题 + 副标题横向组合：副标题置于主标题右侧，间距 12px（--spacing-6） */
    .giencoder-page-header-heading { display: flex; align-items: baseline; gap: var(--spacing-6); }
    .giencoder-page-header-subtitle { font-size: var(--font-size-body-2); color: var(--color-text-3); }
    .giencoder-page-header-back { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin-right: 4px; border-radius: var(--border-radius-medium); color: var(--color-text-2); cursor: pointer; transition: background var(--transition-duration-1), color var(--transition-duration-1); }
    .giencoder-page-header-back:hover { background: var(--color-fill-2); color: var(--color-text-1); }
    .giencoder-page-header-title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .giencoder-page-header-extra { display: flex; align-items: center; gap: 8px; }
    .giencoder-page-header-footer { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border-1); }
    .giencoder-page-header-tab { display: inline-block; padding: 6px 16px; margin-bottom: -1px; font-size: var(--font-size-body-3); color: var(--color-text-2); cursor: pointer; border-bottom: 2px solid transparent; transition: color var(--transition-duration-1); }
    .giencoder-page-header-tab:hover { color: var(--color-text-1); }
    .giencoder-page-header-tab-active { color: var(--color-primary-6); font-weight: 500; border-bottom-color: var(--color-primary-6); }
    /* 交互脚本用：返回按钮闪烁反馈；按钮按压反馈由 components.css :active 动效提供 */
    .giencoder-page-header-back-flash { background: var(--color-primary-light-1); color: var(--color-primary-6); }
  </style>
</head>
<body>
  <div class="pv-layout">
    <aside class="pv-sidebar">
      <div class="pv-nav">
        <div class="pv-menu-group">入口</div>
        <a href="../home.html">首页</a>
        <a href="../../GETTING-STARTED.html">使用说明书</a>
        <div class="pv-menu-group">组件</div>
        <a href="../index.html#general">通用</a>
        <a href="../index.html#layout">布局</a>
        <a href="../index.html#navigation" class="active">导航</a>
        <a href="../index.html#data-entry">数据录入</a>
        <a href="../index.html#data-display">数据展示</a>
        <a href="../index.html#feedback">反馈</a>
        <a href="../index.html#other">其他</a>
        <div class="pv-menu-group">资源</div>
        <a href="../index.html#uikits">页面样板</a>
        <a href="../index.html#docs">规范文档</a>
      </div>
    </aside>
    <main class="pv-content">
  <a class="pv-back" href="../index.html#navigation">← 返回组件库</a>
  <div class="pv-header">
    <h1>PageHeader 页头</h1>
    <p>源启页头：面包屑 + 标题 + 操作区组合，支持基础、带返回与带页脚三种形态。</p>
  </div>

  <!-- ============ 变体：基础页头 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Basic 基础页头（标题 + 副标题）</div>
    <div class="row">
      <div class="giencoder-page-header" data-component="page-header" data-variant="basic" data-state="default" style="width:100%;">
        <div class="giencoder-page-header-heading">
          <div class="giencoder-page-header-title">用户信息管理</div>
          <div class="giencoder-page-header-subtitle">管理组织内所有用户及其访问权限</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带返回 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">With Back 带返回（返回图标 + 面包屑 + 标题 + extra 按钮区）</div>
    <div class="row">
      <div class="giencoder-page-header" data-component="page-header" data-variant="with-back" data-state="default" style="width:100%;">
        <div style="display:flex; align-items:center;">
          <span class="giencoder-page-header-back" role="button" aria-label="返回上一页">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3L5.5 8l5 5"/></svg>
          </span>
          <div class="giencoder-breadcrumb" aria-label="面包屑">
            <div class="giencoder-breadcrumb-item"><a class="giencoder-breadcrumb-item-link" href="#">首页</a></div>
            <span class="giencoder-breadcrumb-item-separator">/</span>
            <div class="giencoder-breadcrumb-item"><a class="giencoder-breadcrumb-item-link" href="#">用户管理</a></div>
            <span class="giencoder-breadcrumb-item-separator">/</span>
            <div class="giencoder-breadcrumb-item"><span class="giencoder-breadcrumb-item-link giencoder-breadcrumb-item-current" aria-current="page">用户信息</span></div>
          </div>
        </div>
        <div class="giencoder-page-header-title-row" style="margin-top:10px;">
          <div class="giencoder-page-header-title">用户信息</div>
          <div class="giencoder-page-header-extra">
            <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">刷新</button>
            <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">新建用户</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带页脚 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">With Footer 带页脚（Tab 页签）</div>
    <div class="row">
      <div class="giencoder-page-header" data-component="page-header" data-variant="footer" data-state="default" style="width:100%;">
        <div class="giencoder-page-header-title-row">
          <div class="giencoder-page-header-title">项目配置</div>
          <div class="giencoder-page-header-extra">
            <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">保存草稿</button>
            <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">发布配置</button>
          </div>
        </div>
        <div class="giencoder-page-header-footer">
          <div class="giencoder-page-header-tab giencoder-page-header-tab-active">基本信息</div>
          <div class="giencoder-page-header-tab">成员权限</div>
          <div class="giencoder-page-header-tab">审计日志</div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    'use strict';
    /* component-page-header：交互清单
       1. 返回按钮（.giencoder-page-header-back，含返回图标）点击：瞬时背景闪烁反馈（.giencoder-page-header-back-flash），约 300ms 恢复
       2. extra 区按钮（.giencoder-page-header-extra .giencoder-btn）点击沿用 components.css 按钮 :active 按压动效（spread 内缩），无额外脚本 */
    var FLASH = 'giencoder-page-header-back-flash';
    document.querySelectorAll('.giencoder-page-header-back').forEach(function (back) {
      back.addEventListener('click', function () {
        back.classList.add(FLASH);
        setTimeout(function () {
          if (back.classList) { back.classList.remove(FLASH); }
        }, 300);
      });
    });
    document.querySelectorAll('.giencoder-page-header-extra .giencoder-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        if (btn.disabled || btn.classList.contains('giencoder-btn-disabled') || btn.classList.contains('giencoder-btn-loading')) {
          e.preventDefault();
        }
      });
    });
  })();
  </script>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
