  <style>
    /* Popconfirm 预览局部样式 */
    /* === 交互动效用：弹层展开/收起（opacity 0→1 + scale(0.96→1) + translateY(4px→0)，收起 .15s / 展开 .2s standard 曲线；translate/scale 与既有内联 transform 定位组合） === */
    .giencoder-popconfirm-popup {
      opacity: 0;
      visibility: hidden;
      translate: 0 4px;
      scale: 0.96;
      transform-origin: top center;
      transition: opacity .15s cubic-bezier(0.34, 0.69, 0.1, 1), translate .15s cubic-bezier(0.34, 0.69, 0.1, 1), scale .15s cubic-bezier(0.34, 0.69, 0.1, 1), visibility 0s .15s;
    }
    .giencoder-popconfirm-popup.giencoder-popup-open {
      opacity: 1;
      visibility: visible;
      translate: 0 0;
      scale: 1;
      transition: opacity .2s cubic-bezier(0.34, 0.69, 0.1, 1), translate .2s var(--transition-timing-function-spring), scale .2s var(--transition-timing-function-spring), visibility 0s;
    }
  </style>

        <button class="giencoder-btn giencoder-btn-danger giencoder-btn-size-default">删除</button>

          <span class="giencoder-popconfirm-arrow" style="position:absolute; top:-5px; left:36px; width:8px; height:8px; background:var(--color-bg-2); border-top:1px solid var(--color-border-2); border-left:1px solid var(--color-border-2); transform:rotate(45deg);"></span>
          <div style="display:flex; align-items:flex-start; gap:var(--spacing-4); font-size:var(--font-size-body-2); color:var(--color-text-1); line-height:1.5;">
            <span style="flex-shrink:0; color:var(--color-warning-6); display:flex; margin-top:1px;">

            </span>

    <div class="row" style="padding:var(--spacing-8) 0; justify-content:space-between;">
      <!-- right -->

        <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">删除（右）</button>

            </span>

      <!-- left -->
      <div class="giencoder-popconfirm" data-component="popconfirm" data-variant="left" data-state="open" style="position:relative; display:inline-block;">
        <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">删除（左）</button>
        <div class="giencoder-popconfirm-popup" role="dialog" aria-label="删除确认" style="position:absolute; right:calc(100% + 12px); top:50%; transform:translateY(-50%); z-index:10; min-width:200px; background:var(--color-bg-2); border:1px solid var(--color-border-2); border-radius:8px; box-shadow:var(--shadow2-down); padding:var(--spacing-6);">
          <span class="giencoder-popconfirm-arrow" style="position:absolute; right:-5px; top:50%; margin-top:-4px; width:8px; height:8px; background:var(--color-bg-2); border-top:1px solid var(--color-border-2); border-right:1px solid var(--color-border-2); transform:rotate(45deg);"></span>
          <div style="display:flex; align-items:flex-start; gap:var(--spacing-4); font-size:var(--font-size-body-2); color:var(--color-text-1); line-height:1.5;">
            <span style="flex-shrink:0; color:var(--color-warning-6); display:flex; margin-top:1px;">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2l6 11H2L8 2z"/><path d="M8 6.5v3M8 11.5h.01"/></svg>
            </span>
            确定要删除这条记录吗？
          </div>
          <div style="display:flex; justify-content:flex-end; gap:var(--spacing-4); margin-top:var(--spacing-6);">
            <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-small">取消</button>

  <script>
  /* popconfirm：触发器点击展开/收起气泡；确定收起并显示"已确认删除"反馈；取消/外部点击收起；多示例互斥 */
  (function () {
    'use strict';

    function findAll(sel, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(sel));
    }

    var items = findAll('.giencoder-popconfirm');
    if (!items.length) return;

    /* —— 交互动效：展开 = display + rAF 加 .giencoder-popup-open；收起 = 移除 class + setTimeout 延迟隐藏 —— */
    function isPopupOpen(popup) {
      return !!popup && popup.classList.contains('giencoder-popup-open');
    }
    function openPopup(popup) {
      if (!popup) { return; }
      if (popup._closeTimer) { clearTimeout(popup._closeTimer); popup._closeTimer = null; }
      popup.style.display = '';
      var token = (popup._animToken = (popup._animToken || 0) + 1);
      requestAnimationFrame(function () {
        if (!popup.isConnected || popup._animToken !== token) { return; } /* 元素已移除或状态已变则跳过 */
        popup.classList.add('giencoder-popup-open');
      });
    }
    function closePopup(popup) {
      if (!popup) { return; }
      var token = (popup._animToken = (popup._animToken || 0) + 1);
      popup.classList.remove('giencoder-popup-open');
      if (popup._closeTimer) { clearTimeout(popup._closeTimer); }
      popup._closeTimer = setTimeout(function () {
        popup._closeTimer = null;
        if (!popup.isConnected || popup._animToken !== token) { return; } /* 元素已移除或已重新展开则跳过 */
        popup.style.display = 'none';
      }, 200);
    }
    function setOpen(item, open) {
      var popup = item.querySelector('.giencoder-popconfirm-popup');
      if (!popup) { return; }
      if (open) { openPopup(popup); } else { closePopup(popup); }
    }
    function isOpen(item) {
      return isPopupOpen(item.querySelector('.giencoder-popconfirm-popup'));
    }

    function closeAll(except) {
      items.forEach(function (item) {
        if (item !== except) setOpen(item, false);
      });
    }

    items.forEach(function (item) {
      var trigger = item.querySelector(':scope > .giencoder-btn');
      var popup = item.querySelector('.giencoder-popconfirm-popup');
      if (!trigger || !popup) return;

      trigger.addEventListener('click', function (e) {
        e.stopPropagation();
        var wasOpen = isOpen(item);
        closeAll(item);
        setOpen(item, !wasOpen);
      });

      // 取消 → 收起
      var cancel = popup.querySelector('.giencoder-btn-secondary');
      if (cancel) {
        cancel.addEventListener('click', function (e) {
          e.stopPropagation();
          setOpen(item, false);
        });
      }

      // 确定 → 收起 + 触发器文字反馈
      var ok = popup.querySelector('.giencoder-btn-danger');
      if (ok) {
        ok.addEventListener('click', function (e) {
          e.stopPropagation();
          setOpen(item, false);
          var original = trigger.textContent;
          trigger.textContent = '已确认删除';
          if (trigger._timer) clearTimeout(trigger._timer);
          trigger._timer = setTimeout(function () { trigger.textContent = original; }, 1500);
        });
      }
    });

    // 外部点击 → 收起（判断是否在触发器/弹层内）
    document.addEventListener('click', function (e) {
      items.forEach(function (item) {
        var popup = item.querySelector('.giencoder-popconfirm-popup');
        if (popup && isPopupOpen(popup) && !item.contains(e.target)) {
          setOpen(item, false);
        }
      });
    });
    /* 初始同步：模板 data-state="open" 的弹层直接置为展开态（避免加载动画） */
    items.forEach(function (item) {
      var popup = item.querySelector('.giencoder-popconfirm-popup');
      if (popup) { popup.classList.add('giencoder-popup-open'); }
    });
  })();
  </script>
