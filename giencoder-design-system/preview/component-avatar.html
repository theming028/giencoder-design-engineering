<body>

    <main class="pv-content">
  <a class="pv-back" href="../index.html#data-display">← 返回组件库</a>
  <div class="pv-header">
    <h1>Avatar 头像</h1>
    <p>源启头像：文字/图片、圆形/方形、尺寸、头像组；medium 及以上尺寸显示双字并自动缩小字号（autoFixFontSize）。</p>
  </div>

  <!-- ============ 变体：文字头像 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Text 文字头像（尺寸）</div>
    <div class="row" style="gap:20px; align-items:center;">
      <span class="giencoder-avatar" data-component="avatar" data-variant="text" data-size="small" data-state="default" style="width:24px; height:24px; border-radius:50%; background:var(--color-primary-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:11px;">张</span>
      <span class="giencoder-avatar" data-component="avatar" data-variant="text" data-size="medium" data-state="default" style="width:32px; height:32px; border-radius:50%; background:var(--color-primary-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:10px;">张伟</span>
      <span class="giencoder-avatar" data-component="avatar" data-variant="text" data-size="large" data-state="default" style="width:40px; height:40px; border-radius:50%; background:var(--color-primary-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:12px;">张伟</span>
      <span class="giencoder-avatar" data-component="avatar" data-variant="text" data-size="xlarge" data-state="default" style="width:48px; height:48px; border-radius:50%; background:var(--color-primary-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:15px;">张伟</span>
    </div>
  </div>

  <!-- ============ 变体：形状 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Shape 形状（圆形/方形）</div>
    <div class="row" style="gap:20px; align-items:center;">
      <span class="giencoder-avatar" data-component="avatar" data-variant="circle" data-state="default" style="width:40px; height:40px; border-radius:50%; background:var(--color-purple-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:12px;">李雷</span>
      <span class="giencoder-avatar" data-component="avatar" data-variant="square" data-state="default" style="width:40px; height:40px; border-radius:4px; background:var(--color-purple-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:12px;">李娜</span>
    </div>
  </div>

  <!-- ============ 变体：图片头像 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Image 图片头像</div>
    <div class="row" style="gap:20px; align-items:center;">
      <span class="giencoder-avatar" data-component="avatar" data-variant="image" data-state="default" style="width:40px; height:40px; border-radius:50%; overflow:hidden; display:inline-block;">
        <span style="display:flex; width:100%; height:100%; align-items:center; justify-content:center; background:var(--color-primary-light-2); color:var(--color-primary-6); font-size: 14px; font-weight:500;">JD</span>
      </span>
      <span class="giencoder-avatar" data-component="avatar" data-variant="image" data-state="default" style="width:40px; height:40px; border-radius:50%; overflow:hidden; display:inline-block;">
        <span style="display:flex; width:100%; height:100%; align-items:center; justify-content:center; background:var(--color-success-light-1); color:var(--color-success-6); font-size: 14px; font-weight:500;">AC</span>
      </span>
    </div>
  </div>

  <!-- ============ 变体：头像组 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Group 头像组</div>
    <div class="row" style="gap:0; align-items:center;">
      <div class="giencoder-avatar-group" data-component="avatar" data-variant="group" data-state="default" style="display:flex;">
        <span style="width:32px; height:32px; border-radius:50%; background:var(--color-giencoderblue-6, var(--color-primary-6)); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:10px; border:2px solid var(--color-bg-1); margin-left:-8px; position:relative;">张伟</span>
        <span style="width:32px; height:32px; border-radius:50%; background:var(--color-purple-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:10px; border:2px solid var(--color-bg-1); margin-left:-8px; position:relative;">李娜</span>
        <span style="width:32px; height:32px; border-radius:50%; background:var(--color-success-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:10px; border:2px solid var(--color-bg-1); margin-left:-8px; position:relative;">王芳</span>
        <span style="width:32px; height:32px; border-radius:50%; background:var(--color-fill-3); color:var(--color-text-2); display:flex; align-items:center; justify-content:center; font-size:12px; border:2px solid var(--color-bg-1); margin-left:-8px; position:relative;">+3</span>
      </div>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
