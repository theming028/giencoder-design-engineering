</head>
<body>

    <main class="pv-content">
  <a class="pv-back" href="../index.html#data-display">← 返回组件库</a>
  <div class="pv-header">
    <h1>Badge 徽标</h1>
    <p>源启徽标：数字/圆点/状态色/上限值，独立或包裹内容。</p>
  </div>

  <!-- ============ 变体：数字徽标 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Count 数字徽标</div>
    <div class="row" style="gap:32px; align-items:center;">
      <span class="giencoder-badge" data-component="badge" data-variant="count" data-state="default">
        <span class="giencoder-badge-count">5</span>
        <span class="giencoder-badge-children">
          <svg viewBox="0 0 20 20" width="28" height="28" fill="none" stroke="var(--color-text-2)" stroke-width="1.5"><path d="M4 6a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/><path d="M7 3v2M13 3v2M4 8h12"/></svg>
        </span>
      </span>
      <span class="giencoder-badge" data-component="badge" data-variant="count" data-state="default">
        <span class="giencoder-badge-count">99</span>
        <span class="giencoder-badge-children">
          <svg viewBox="0 0 20 20" width="28" height="28" fill="none" stroke="var(--color-text-2)" stroke-width="1.5"><path d="M4 6a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/><path d="M7 3v2M13 3v2M4 8h12"/></svg>
        </span>
      </span>
      <span class="giencoder-badge" data-component="badge" data-variant="count" data-state="default">
        <span class="giencoder-badge-count giencoder-badge-count-max">99+</span>
        <span class="giencoder-badge-children">
          <svg viewBox="0 0 20 20" width="28" height="28" fill="none" stroke="var(--color-text-2)" stroke-width="1.5"><path d="M4 6a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/><path d="M7 3v2M13 3v2M4 8h12"/></svg>
        </span>
      </span>
      <span class="giencoder-badge giencoder-badge-standalone" data-component="badge" data-variant="count" data-state="default">
        <span class="giencoder-badge-count">12</span>
      </span>
    </div>
  </div>

  <!-- ============ 变体：圆点 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Dot 圆点徽标</div>
    <div class="row" style="gap:32px; align-items:center;">
      <span class="giencoder-badge" data-component="badge" data-variant="dot" data-state="default">
        <span class="giencoder-badge-dot"></span>
        <span class="giencoder-badge-children">
          <svg viewBox="0 0 20 20" width="28" height="28" fill="none" stroke="var(--color-text-2)" stroke-width="1.5"><path d="M4 6a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/><path d="M7 3v2M13 3v2M4 8h12"/></svg>
        </span>
      </span>
      <span class="giencoder-badge" data-component="badge" data-variant="dot" data-state="default">
        <span class="giencoder-badge-dot"></span>
        <span class="giencoder-badge-children" style="width:28px;height:28px;border-radius:4px;background:var(--color-fill-2);display:inline-block;"></span>
      </span>
    </div>
  </div>

  <!-- ============ 变体：状态徽标 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Status 状态徽标</div>
    <div class="row" style="gap:24px; align-items:center;">
      <span class="giencoder-badge-status" data-component="badge" data-variant="status" data-state="default">
        <span class="giencoder-badge-status-dot giencoder-badge-status-success"></span>
        <span class="giencoder-badge-status-text">成功</span>
      </span>
      <span class="giencoder-badge-status" data-component="badge" data-variant="status" data-state="default">
        <span class="giencoder-badge-status-dot giencoder-badge-status-warning"></span>
        <span class="giencoder-badge-status-text">警告</span>
      </span>
      <span class="giencoder-badge-status" data-component="badge" data-variant="status" data-state="default">
        <span class="giencoder-badge-status-dot giencoder-badge-status-danger"></span>
        <span class="giencoder-badge-status-text">危险</span>
      </span>
      <span class="giencoder-badge-status" data-component="badge" data-variant="status" data-state="default">
        <span class="giencoder-badge-status-dot giencoder-badge-status-normal"></span>
        <span class="giencoder-badge-status-text">正常</span>
      </span>
      <span class="giencoder-badge-status" data-component="badge" data-variant="status" data-state="default">
        <span class="giencoder-badge-status-dot giencoder-badge-status-processing"></span>
        <span class="giencoder-badge-status-text">处理中</span>
      </span>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
