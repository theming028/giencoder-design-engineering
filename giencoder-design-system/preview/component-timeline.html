  <div class="pv-header">
    <h1>Timeline 时间轴</h1>
    <p>源启时间轴：状态点、时间内容、自定义节点。</p>
  </div>

  <!-- ============ 变体：基础 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Default 基础时间轴</div>
    <div class="row">
      <div class="giencoder-timeline" data-component="timeline" data-variant="default" data-state="default" style="padding-left:8px;">
        <div class="giencoder-timeline-item">
          <div class="giencoder-timeline-dot-wrapper">
            <div class="giencoder-timeline-dot giencoder-timeline-dot-primary"></div>
          </div>
          <div class="giencoder-timeline-content" style="padding-bottom:24px;">
            <div class="giencoder-timeline-content-title" style="font-size: 14px; color:var(--color-text-1);">服务已部署</div>
            <div class="giencoder-timeline-content-description" style="font-size:12px; color:var(--color-text-3); margin-top:2px;">2026/08/28 10:30:00 张三</div>
          </div>
        </div>
        <div class="giencoder-timeline-item">
          <div class="giencoder-timeline-dot-wrapper">
            <div class="giencoder-timeline-dot giencoder-timeline-dot-success"></div>
          </div>
          <div class="giencoder-timeline-content" style="padding-bottom:24px;">
            <div class="giencoder-timeline-content-title" style="font-size: 14px; color:var(--color-text-1);">构建通过</div>
            <div class="giencoder-timeline-content-description" style="font-size:12px; color:var(--color-text-3); margin-top:2px;">2026/08/28 10:12:00 CI 流水线</div>
          </div>
        </div>
        <div class="giencoder-timeline-item">
          <div class="giencoder-timeline-dot-wrapper">
            <div class="giencoder-timeline-dot giencoder-timeline-dot-warning"></div>
          </div>
          <div class="giencoder-timeline-content" style="padding-bottom:24px;">
            <div class="giencoder-timeline-content-title" style="font-size: 14px; color:var(--color-text-1);">代码合并</div>
            <div class="giencoder-timeline-content-description" style="font-size:12px; color:var(--color-text-3); margin-top:2px;">2026/08/28 09:45:00 李四</div>
          </div>
        </div>
        <div class="giencoder-timeline-item">
          <div class="giencoder-timeline-dot-wrapper">
            <div class="giencoder-timeline-dot giencoder-timeline-dot-gray"></div>
          </div>
          <div class="giencoder-timeline-content">
            <div class="giencoder-timeline-content-title" style="font-size: 14px; color:var(--color-text-1);">创建分支</div>
            <div class="giencoder-timeline-content-description" style="font-size:12px; color:var(--color-text-3); margin-top:2px;">2026/08/28 09:20:00 系统</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带自定义内容 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Custom 自定义节点</div>
    <div class="row">
      <div class="giencoder-timeline" data-component="timeline" data-variant="custom" data-state="default" style="padding-left:8px;">
        <div class="giencoder-timeline-item">
          <div class="giencoder-timeline-dot-wrapper">
            <span class="giencoder-timeline-dot-custom" style="color:var(--color-primary-6);">
              <svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5.5"/><path d="M7 4v3.5L9.5 9.5"/></svg>
            </span>
          </div>
          <div class="giencoder-timeline-content" style="padding-bottom:20px;">
            <div class="giencoder-timeline-content-title" style="font-size: 14px; color:var(--color-text-1);">开始定时任务</div>
          </div>
        </div>
        <div class="giencoder-timeline-item">
          <div class="giencoder-timeline-dot-wrapper">
            <span class="giencoder-timeline-dot-custom" style="color:var(--color-success-6);">
              <svg viewBox="0 0 14 14" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 7.5l2.5 2.5L11 4.5"/></svg>
            </span>
          </div>
          <div class="giencoder-timeline-content">
            <div class="giencoder-timeline-content-title" style="font-size: 14px; color:var(--color-text-1);">任务执行完成</div>
          </div>
        </div>
      </div>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
