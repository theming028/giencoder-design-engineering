  <div class="pv-header">
    <h1>Slider 滑动条</h1>
    <p>源启滑动条：4px 轨道 --color-fill-3 + 已选段 --color-primary-6 + 12px 圆形滑块，支持双滑块、刻度与禁用。</p>
  </div>

  <!-- ============ 变体：基础单滑块 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Basic 基础单滑块（数字标签显示当前值）</div>
    <div class="row">
      <div class="giencoder-slider" data-component="slider" data-variant="basic" data-state="default" style="position:relative; width:320px; padding-top:20px;">
        <span class="giencoder-slider-value" style="position:absolute; top:0; left:50%; transform:translateX(-50%); font-size:var(--font-size-body-1); color:var(--color-text-2); background:var(--color-bg-2); border-radius:var(--border-radius-small); padding:0 4px; line-height:16px;">50</span>
        <div style="position:relative; height:24px;">
          <div class="giencoder-slider-track" style="position:absolute; top:50%; left:0; right:0; height:4px; transform:translateY(-50%); background:var(--color-fill-3); border-radius:2px;"></div>
          <div class="giencoder-slider-fill" style="position:absolute; top:50%; left:0; width:50%; height:4px; transform:translateY(-50%); background:var(--color-primary-6); border-radius:2px;"></div>
          <span class="giencoder-slider-thumb" style="position:absolute; top:50%; left:50%; width:12px; height:12px; transform:translate(-50%,-50%); border-radius:50%; background:var(--color-white); border:2px solid var(--color-primary-6); box-shadow:var(--shadow1-down); cursor:pointer;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：双滑块 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Range 双滑块（两滑块中间高亮）</div>
    <div class="row">
      <div class="giencoder-slider" data-component="slider" data-variant="range" data-state="default" style="position:relative; width:320px; padding-top:20px;">
        <span class="giencoder-slider-value" style="position:absolute; top:0; left:20%; transform:translateX(-50%); font-size:var(--font-size-body-1); color:var(--color-text-2); background:var(--color-bg-2); border-radius:var(--border-radius-small); padding:0 4px; line-height:16px;">20</span>
        <span class="giencoder-slider-value" style="position:absolute; top:0; left:80%; transform:translateX(-50%); font-size:var(--font-size-body-1); color:var(--color-text-2); background:var(--color-bg-2); border-radius:var(--border-radius-small); padding:0 4px; line-height:16px;">80</span>
        <div style="position:relative; height:24px;">
          <div class="giencoder-slider-track" style="position:absolute; top:50%; left:0; right:0; height:4px; transform:translateY(-50%); background:var(--color-fill-3); border-radius:2px;"></div>
          <div class="giencoder-slider-range-fill" style="position:absolute; top:50%; left:20%; width:60%; height:4px; transform:translateY(-50%); background:var(--color-primary-6); border-radius:2px;"></div>
          <span class="giencoder-slider-thumb" style="position:absolute; top:50%; left:20%; width:12px; height:12px; transform:translate(-50%,-50%); border-radius:50%; background:var(--color-white); border:2px solid var(--color-primary-6); box-shadow:var(--shadow1-down); cursor:pointer;"></span>
          <span class="giencoder-slider-thumb" style="position:absolute; top:50%; left:80%; width:12px; height:12px; transform:translate(-50%,-50%); border-radius:50%; background:var(--color-white); border:2px solid var(--color-primary-6); box-shadow:var(--shadow1-down); cursor:pointer;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带刻度 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Marks 带刻度（0 / 25 / 50 / 75 / 100）</div>
    <div class="row">
      <div class="giencoder-slider" data-component="slider" data-variant="marks" data-state="default" style="position:relative; width:320px; padding-top:20px;">
        <span class="giencoder-slider-value" style="position:absolute; top:0; left:50%; transform:translateX(-50%); font-size:var(--font-size-body-1); color:var(--color-text-2); background:var(--color-bg-2); border-radius:var(--border-radius-small); padding:0 4px; line-height:16px;">50</span>
        <div style="position:relative; height:24px;">
          <div class="giencoder-slider-track" style="position:absolute; top:50%; left:0; right:0; height:4px; transform:translateY(-50%); background:var(--color-fill-3); border-radius:2px;"></div>
          <div class="giencoder-slider-fill" style="position:absolute; top:50%; left:0; width:50%; height:4px; transform:translateY(-50%); background:var(--color-primary-6); border-radius:2px;"></div>
          <span class="giencoder-slider-mark" style="position:absolute; top:50%; left:0%; width:1px; height:6px; transform:translateY(-50%); background:var(--color-border-3);"></span>
          <span class="giencoder-slider-mark" style="position:absolute; top:50%; left:25%; width:1px; height:6px; transform:translateY(-50%); background:var(--color-border-3);"></span>
          <span class="giencoder-slider-mark" style="position:absolute; top:50%; left:50%; width:1px; height:6px; transform:translateY(-50%); background:var(--color-border-3);"></span>
          <span class="giencoder-slider-mark" style="position:absolute; top:50%; left:75%; width:1px; height:6px; transform:translateY(-50%); background:var(--color-border-3);"></span>
          <span class="giencoder-slider-mark" style="position:absolute; top:50%; left:100%; width:1px; height:6px; transform:translateY(-50%); background:var(--color-border-3);"></span>
          <span class="giencoder-slider-thumb" style="position:absolute; top:50%; left:50%; width:12px; height:12px; transform:translate(-50%,-50%); border-radius:50%; background:var(--color-white); border:2px solid var(--color-primary-6); box-shadow:var(--shadow1-down); cursor:pointer;"></span>
        </div>
        <div class="giencoder-slider-marks" style="display:flex; justify-content:space-between; margin-top:6px; font-size:var(--font-size-body-1); color:var(--color-text-4);">
          <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 状态：禁用 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Disabled 禁用（灰化）</div>
    <div class="row">
      <div class="giencoder-slider giencoder-slider-disabled" data-component="slider" data-variant="basic" data-state="disabled" style="position:relative; width:320px; padding-top:20px; opacity:0.45; cursor:not-allowed;">
        <span class="giencoder-slider-value" style="position:absolute; top:0; left:60%; transform:translateX(-50%); font-size:var(--font-size-body-1); color:var(--color-text-4); background:var(--color-bg-2); border-radius:var(--border-radius-small); padding:0 4px; line-height:16px;">60</span>
        <div style="position:relative; height:24px;">
          <div class="giencoder-slider-track" style="position:absolute; top:50%; left:0; right:0; height:4px; transform:translateY(-50%); background:var(--color-fill-3); border-radius:2px;"></div>
          <div class="giencoder-slider-fill" style="position:absolute; top:50%; left:0; width:60%; height:4px; transform:translateY(-50%); background:var(--color-fill-4); border-radius:2px;"></div>
          <span class="giencoder-slider-thumb" style="position:absolute; top:50%; left:60%; width:12px; height:12px; transform:translate(-50%,-50%); border-radius:50%; background:var(--color-fill-2); border:2px solid var(--color-fill-4);"></span>
        </div>
      </div>
    </div>
  </div>

  <style>
    /* 交互脚本用：滑动条容器可点击跳转 */
    .giencoder-slider:not(.giencoder-slider-disabled) { cursor: pointer; }
  </style>

  <script>
    /* 源启交互脚本 — slider
     * 1. 点击轨道跳转：已选段宽度（内联 style width 百分比）与滑块 left 同步
     * 2. 双滑块示例：点击左右半区（以两滑块中点为界）分别调左/右滑块
     * 3. 禁用无效
     */
    (function () {
      'use strict';
      function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

      var sliders = document.querySelectorAll('.giencoder-slider');
      sliders.forEach(function (slider) {
        if (slider.classList.contains('giencoder-slider-disabled')) { return; }
        slider.addEventListener('click', function (e) {
          var rect = slider.getBoundingClientRect();
          if (!rect.width) { return; }
          var pct = clamp((e.clientX - rect.left) / rect.width * 100, 0, 100);

          if (slider.querySelector('.giencoder-slider-range-fill')) {
            // 双滑块
            var thumbs = slider.querySelectorAll('.giencoder-slider-thumb');
            if (thumbs.length < 2) { return; }
            var left = parseFloat(thumbs[0].style.left) || 0;
            var right = parseFloat(thumbs[1].style.left) || 100;
            if (pct < (left + right) / 2) {
              left = pct;
            } else {
              right = pct;
            }
            thumbs[0].style.left = left + '%';
            thumbs[1].style.left = right + '%';
            var fill = slider.querySelector('.giencoder-slider-range-fill');
            if (fill) {
              fill.style.left = left + '%';
              fill.style.width = (right - left) + '%';
            }
            var values = slider.querySelectorAll('.giencoder-slider-value');
            if (values.length >= 2) {
              values[0].style.left = left + '%';
              values[0].textContent = String(Math.round(left));
              values[1].style.left = right + '%';
              values[1].textContent = String(Math.round(right));
            }
          } else {
            // 单滑块（basic / marks）
            var fill = slider.querySelector('.giencoder-slider-fill');
            var thumb = slider.querySelector('.giencoder-slider-thumb');
            if (fill) { fill.style.width = pct + '%'; }
            if (thumb) { thumb.style.left = pct + '%'; }
            var value = slider.querySelector('.giencoder-slider-value');
            if (value) {
              value.style.left = pct + '%';
              value.textContent = String(Math.round(pct));
            }
          }
        });
      });
    })();
  </script>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
