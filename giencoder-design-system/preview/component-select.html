  <style>
    /* Select 预览局部样式 */
    /* === 交互动效用：弹层展开/收起（opacity 0→1 + scale(0.96→1) + translateY(4px→0)，收起 .15s / 展开 .2s standard 曲线） === */
    .giencoder-select-popup {
      opacity: 0;
      visibility: hidden;
      translate: 0 4px;
      scale: 0.96;
      transform-origin: top center;
      transition: opacity .15s cubic-bezier(0.34, 0.69, 0.1, 1), translate .15s cubic-bezier(0.34, 0.69, 0.1, 1), scale .15s cubic-bezier(0.34, 0.69, 0.1, 1), visibility 0s .15s;
    }
    .giencoder-select-popup.giencoder-popup-open {
      opacity: 1;
      visibility: visible;
      translate: 0 0;
      scale: 1;
      transition: opacity .2s cubic-bezier(0.34, 0.69, 0.1, 1), translate .2s var(--transition-timing-function-spring), scale .2s var(--transition-timing-function-spring), visibility 0s;
    }
  </style>
</head>

  <div class="pv-header">
    <h1>Select 选择器</h1>
    <p>源启选择器：单选/多选/搜索/带前缀，弹层含键盘导航与 Esc 关闭。</p>
  </div>

  <!-- ============ 变体：单选 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Single 单选</div>
    <div class="row">
      <div class="giencoder-select" data-component="select" data-variant="single" data-state="default" style="width:240px;">
        <div class="giencoder-select-view" tabindex="0" role="combobox" aria-expanded="false" aria-haspopup="listbox">
          <span class="giencoder-select-view-text" data-placeholder="请选择">请选择</span>
          <span class="giencoder-select-suffix">
            <svg class="giencoder-select-arrow" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg>
            <button class="giencoder-select-clear" type="button" aria-label="清除选择">
              <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
            </button>
          </span>
        </div>
        <div class="giencoder-select-popup" style="display:none;">
          <ul class="giencoder-select-option-list" role="listbox">
            <li class="giencoder-select-option giencoder-select-option-selected" role="option" aria-selected="true">选项一</li>
            <li class="giencoder-select-option" role="option" aria-selected="false">选项二</li>
            <li class="giencoder-select-option" role="option" aria-selected="false">选项三</li>
            <li class="giencoder-select-option giencoder-select-option-disabled" role="option" aria-disabled="true">禁用项</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：多选 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Multiple 多选（Tag 式已选）</div>
    <div class="row">
      <div class="giencoder-select giencoder-select-multiple" data-component="select" data-variant="multiple" data-state="default" style="width:320px;">
        <div class="giencoder-select-view" tabindex="0" role="combobox" aria-expanded="false" aria-haspopup="listbox">
          <div class="giencoder-select-selection">
            <span class="giencoder-tag giencoder-tag-primary">
              标签云
              <button class="giencoder-tag-close-btn" aria-label="移除">
                <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
              </button>
            </span>
            <span class="giencoder-select-placeholder">选择标签</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带搜索 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Searchable 可搜索</div>
    <div class="row">
      <div class="giencoder-select" data-component="select" data-variant="searchable" data-state="default" style="width:240px;">
        <div class="giencoder-select-view" tabindex="0" role="combobox" aria-expanded="false" aria-haspopup="listbox">
          <span class="giencoder-select-view-text">搜索并选择</span>
          <span class="giencoder-select-suffix">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 状态：禁用/错误 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Disabled / Error 状态</div>
    <div class="row">
      <div class="giencoder-select giencoder-select-disabled" data-component="select" data-variant="single" data-state="disabled" style="width:240px;">
        <div class="giencoder-select-view" role="combobox" aria-disabled="true">
          <span class="giencoder-select-view-text">禁用选择器</span>
        </div>
      </div>
      <div class="giencoder-select giencoder-select-error" data-component="select" data-variant="single" data-state="error" style="width:240px;">
        <div class="giencoder-select-view" role="combobox" aria-invalid="true">
          <span class="giencoder-select-view-text">校验失败</span>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    'use strict';
    /* component-select — 交互清单：
     * 1. 点击触发框展开/收起弹层（style.display 切换）
     * 2. 点击选项：互斥高亮 giencoder-select-option-selected，同步触发框文本并收起；disabled 选项不可选
     * 3. 有值清除：选中后 hover 触发框，箭头变 X（.giencoder-select-has-value 状态类驱动 CSS），点击 X 清除所选并恢复占位文本
     * 4. 点击外部收起全部弹层
     */
    document.querySelectorAll('.giencoder-select').forEach(function (sel) {
      if (sel.classList.contains('giencoder-select-disabled')) return;
      var view = sel.querySelector('.giencoder-select-view');
      var popup = sel.querySelector('.giencoder-select-popup');
      if (!view || !popup) return;
      var options = Array.prototype.slice.call(popup.querySelectorAll('.giencoder-select-option'));
      var textEl = view.querySelector('.giencoder-select-view-text');
      var clearBtn = sel.querySelector('.giencoder-select-clear');
      var placeholder = textEl ? (textEl.getAttribute('data-placeholder') || '') : '';

      /* —— 交互动效：展开 = display + rAF 加 .giencoder-popup-open；收起 = 移除 class + setTimeout 延迟隐藏 —— */
      function isPopupOpen(p) { return !!p && p.classList.contains('giencoder-popup-open'); }
      function openPopup(p) {
        if (!p) { return; }
        if (p._closeTimer) { clearTimeout(p._closeTimer); p._closeTimer = null; }
        p.style.display = '';
        var token = (p._animToken = (p._animToken || 0) + 1);
        requestAnimationFrame(function () {
          if (!p.isConnected || p._animToken !== token) { return; } /* 元素已移除或状态已变则跳过 */
          p.classList.add('giencoder-popup-open');
        });
      }
      function closePopup(p) {
        if (!p) { return; }
        var token = (p._animToken = (p._animToken || 0) + 1);
        p.classList.remove('giencoder-popup-open');
        if (p._closeTimer) { clearTimeout(p._closeTimer); }
        p._closeTimer = setTimeout(function () {
          p._closeTimer = null;
          if (!p.isConnected || p._animToken !== token) { return; } /* 元素已移除或已重新展开则跳过 */
          p.style.display = 'none';
        }, 200);
      }
      function isOpen() { return isPopupOpen(popup); }
      function open() { openPopup(popup); view.setAttribute('aria-expanded', 'true'); }
      function close() { closePopup(popup); view.setAttribute('aria-expanded', 'false'); }

      view.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (isOpen()) close(); else open();
      });

      options.forEach(function (opt) {
        opt.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (opt.classList.contains('giencoder-select-option-disabled')) return; /* disabled 不可选 */
          options.forEach(function (o) {
            o.classList.remove('giencoder-select-option-selected');
            o.setAttribute('aria-selected', 'false');
          });
          opt.classList.add('giencoder-select-option-selected');
          opt.setAttribute('aria-selected', 'true');
          if (textEl) textEl.textContent = opt.textContent;
          sel.classList.add('giencoder-select-has-value');
          close();
        });
      });

      /* —— 有值清除：点击 X → 移除选中高亮、恢复占位文本、去掉 has-value 状态 —— */
      if (clearBtn) {
        clearBtn.addEventListener('click', function (ev) {
          ev.stopPropagation(); /* 不触发展开/收起 */
          options.forEach(function (o) {
            o.classList.remove('giencoder-select-option-selected');
            o.setAttribute('aria-selected', 'false');
          });
          if (textEl) textEl.textContent = placeholder;
          sel.classList.remove('giencoder-select-has-value');
          close();
        });
      }
    });

    document.addEventListener('click', function (ev) {
      document.querySelectorAll('.giencoder-select').forEach(function (sel) {
        var popup = sel.querySelector('.giencoder-select-popup');
        if (!popup) return;
        if (!sel.contains(ev.target)) {
          closePopup(popup);
          var v = sel.querySelector('.giencoder-select-view');
          if (v) v.setAttribute('aria-expanded', 'false');
        }
      });
    });
  })();
  </script>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
