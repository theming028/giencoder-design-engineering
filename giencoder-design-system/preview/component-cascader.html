<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>级联选择 Cascader</title>
  <link rel="stylesheet" href="preview-scaffold.css">
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    .giencoder-cascader { position: relative; }
    .giencoder-cascader-popup {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 10;
      background: var(--color-bg-popup); border: 1px solid var(--color-border-2);
      border-radius: var(--border-radius-large); box-shadow: var(--shadow2-down);
      display: flex; padding: var(--spacing-3);
    }
    /* ===== 交互动效用：弹层展开/收起过渡 ===== */
    .giencoder-cascader-popup {
      opacity: 0; visibility: hidden; transform: translateY(4px);
      transition: opacity .2s cubic-bezier(0.34, 0.69, 0.1, 1), transform .2s var(--transition-timing-function-spring), visibility .2s;
    }
    .giencoder-cascader-popup.giencoder-popup-open {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
    .giencoder-cascader-column { min-width: 128px; padding: var(--spacing-1); }
    .giencoder-cascader-column + .giencoder-cascader-column { border-left: 1px solid var(--color-border-2); }
    .giencoder-cascader-item {
      padding: 5px var(--spacing-6); margin-bottom: 2px; border-radius: var(--border-radius-small);
      font-size: var(--font-size-body-3); color: var(--color-text-1); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-3);
      transition: background var(--transition-duration-1);
    }
    .giencoder-cascader-item:hover { background: var(--color-fill-2); } /* hover 与 Dropdown 菜单项一致 */
    .giencoder-cascader-item-selected:hover { background: var(--color-primary-1); } /* 选中项 hover 保持选中色 */
    .giencoder-cascader-item-selected { background: var(--color-primary-1); color: var(--color-primary-6); }
  </style>
</head>
<body>

    <aside class="pv-sidebar">
      <div class="pv-nav">
        <div class="pv-menu-group">入口</div>
        <a href="../home.html">首页</a>

        <a href="../index.html#layout">布局</a>

        <a href="../index.html#data-display">数据展示</a>

    <main class="pv-content">
  <a class="pv-back" href="../index.html#data-entry">← 返回组件库</a>
  <div class="pv-header">
    <h1>Cascader</h1>
    <p>级联选择器：触发框回显完整选中路径，多级面板按层级联动，选中与 hover 均高亮主色。</p>
  </div>

  <!-- ============ 变体：默认（未选择） ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Default 未选择</div>
    <div class="row">
      <div class="giencoder-cascader" data-component="cascader" data-variant="default" data-state="default" style="width:260px;">
        <div class="giencoder-input-wrapper" role="combobox" aria-expanded="false" aria-haspopup="listbox" tabindex="0">
          <input class="giencoder-input" placeholder="请选择" readonly>
          <span class="giencoder-input-suffix">
            <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：已选择（多级联动面板） ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Selected 多级联动面板（省 / 市 / 区）</div>
    <div class="row">
      <div class="giencoder-cascader" data-component="cascader" data-variant="selected" data-state="default" style="width:260px;">
        <div class="giencoder-input-wrapper" role="combobox" aria-expanded="true" aria-haspopup="listbox" tabindex="0">
          <input class="giencoder-input" value="浙江省 / 杭州市 / 西湖区" readonly>
          <span class="giencoder-input-suffix">
            <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg>
          </span>
        </div>
        <div class="giencoder-cascader-popup" role="listbox">
          <div class="giencoder-cascader-column">
            <div class="giencoder-cascader-item giencoder-cascader-item-selected" role="option" aria-selected="true">浙江省
              <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 2l4 4-4 4"/></svg>
            </div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">江苏省</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">广东省</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">四川省</div>
          </div>
          <div class="giencoder-cascader-column">
            <div class="giencoder-cascader-item giencoder-cascader-item-selected" role="option" aria-selected="true">杭州市</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">宁波市</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">温州市</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">嘉兴市</div>
          </div>
          <div class="giencoder-cascader-column">
            <div class="giencoder-cascader-item giencoder-cascader-item-selected" role="option" aria-selected="true">西湖区</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">余杭区</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">滨江区</div>
            <div class="giencoder-cascader-item" role="option" aria-selected="false">萧山区</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    'use strict';
    /* component-cascader — 交互清单：
     * 1. 点击触发框展开/收起多级面板（opacity/translateY 过渡动画；模板中无弹层的变体自动跳过）
     * 2. 点击任一列选项：该列内互斥高亮 giencoder-cascader-item-selected
     * 3. 点击末级选项：按各列选中项拼接完整路径同步到触发框 input + 收起
     * 4. 点击外部收起全部面板
     */
    document.querySelectorAll('.giencoder-cascader').forEach(function (cd) {
      var trigger = cd.querySelector('.giencoder-input-wrapper');
      var popup = cd.querySelector('.giencoder-cascader-popup');
      if (!trigger || !popup) return;
      var input = cd.querySelector('.giencoder-input');
      var columns = Array.prototype.slice.call(popup.querySelectorAll('.giencoder-cascader-column'));
      var colItems = columns.map(function (col) {
        return Array.prototype.slice.call(col.querySelectorAll('.giencoder-cascader-item'));
      });

      var hideTimer = null;
      function isOpen() { return popup.classList.contains('giencoder-popup-open'); }
      function openPopup() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        popup.style.display = '';
        void popup.offsetHeight; /* 先定格隐藏态（opacity:0），下一帧再过渡 */
        requestAnimationFrame(function () {
          if (popup && popup.parentNode) popup.classList.add('giencoder-popup-open');
        });
        trigger.setAttribute('aria-expanded', 'true');
      }
      function closePopup() {
        if (!isOpen()) return;
        popup.classList.remove('giencoder-popup-open');
        trigger.setAttribute('aria-expanded', 'false');
        if (hideTimer) { clearTimeout(hideTimer); }
        hideTimer = setTimeout(function () {
          hideTimer = null;
          if (popup && popup.parentNode) popup.style.display = 'none';
        }, 200);
      }

      /* 初始化：模板中默认展开的弹层补 open class（交互动效），保持静态展示可见 */
      if (popup.style.display !== 'none') popup.classList.add('giencoder-popup-open');

      trigger.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (isOpen()) closePopup(); else openPopup();
      });

      /* 点击外部收起 */
      document.addEventListener('click', function (ev) {
        if (cd.contains(ev.target)) return;
        closePopup();
      });

      colItems.forEach(function (items, idx) {
        var isLast = idx === colItems.length - 1;
        items.forEach(function (item) {
          item.addEventListener('click', function (ev) {
            ev.stopPropagation();
            items.forEach(function (o) {
              o.classList.remove('giencoder-cascader-item-selected');
              o.setAttribute('aria-selected', 'false');
            });
            item.classList.add('giencoder-cascader-item-selected');
            item.setAttribute('aria-selected', 'true');
            if (isLast) {
              var path = colItems.map(function (col) {
                var sel = col.filter(function (o) { return o.classList.contains('giencoder-cascader-item-selected'); });
                return sel.length ? sel[0].textContent.trim() : '';
              }).filter(function (t) { return t; });
              if (input) input.value = path.join(' / ');
              closePopup();
            }
          });
        });
      });
    });

  })();
  </script>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
