  <div class="pv-header">
    <h1>Spin 加载中</h1>
    <p>源启加载中：指示器尺寸、包裹内容、整页遮罩。</p>
  </div>

  <!-- ============ 变体：独立指示器 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Standalone 独立指示器（尺寸）</div>
    <div class="row" style="gap:24px; align-items:center;">
      <span class="giencoder-spin" data-component="spin" data-variant="standalone" data-size="mini" data-state="loading" role="status" aria-label="加载中">
        <span class="giencoder-spin-loading giencoder-spin-loading-mini"></span>
      </span>
      <span class="giencoder-spin" data-component="spin" data-variant="standalone" data-size="small" data-state="loading" role="status" aria-label="加载中">
        <span class="giencoder-spin-loading giencoder-spin-loading-small"></span>
      </span>
      <span class="giencoder-spin" data-component="spin" data-variant="standalone" data-size="medium" data-state="loading" role="status" aria-label="加载中">
        <span class="giencoder-spin-loading giencoder-spin-loading-medium"></span>
      </span>
      <span class="giencoder-spin" data-component="spin" data-variant="standalone" data-size="large" data-state="loading" role="status" aria-label="加载中">
        <span class="giencoder-spin-loading giencoder-spin-loading-large"></span>
      </span>
    </div>
  </div>

  <!-- ============ 变体：包裹内容 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Wrap 包裹内容</div>
    <div class="row">
      <div class="giencoder-spin giencoder-spin-wrapper" data-component="spin" data-variant="wrap" data-state="loading" style="position:relative; width:360px; height:180px; display:flex; align-items:center; justify-content:center;">
        <span class="giencoder-spin-loading giencoder-spin-loading-medium"></span>
        <span class="giencoder-spin-mask"></span>
        <div style="position:absolute; inset:0; opacity:0.3; padding:20px; font-size: 14px; color:var(--color-text-2);">
          <div style="height:14px; background:var(--color-fill-3); border-radius:4px; margin-bottom:12px; width:80%;"></div>
          <div style="height:14px; background:var(--color-fill-3); border-radius:4px; margin-bottom:12px; width:60%;"></div>
          <div style="height:14px; background:var(--color-fill-3); border-radius:4px; width:70%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带文案 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">With Text 带文案</div>
    <div class="row" style="gap:24px; align-items:center;">
      <span class="giencoder-spin" data-component="spin" data-variant="text" data-state="loading" role="status" aria-label="加载中" style="display:flex; align-items:center; gap:8px;">
        <span class="giencoder-spin-loading giencoder-spin-loading-small"></span>
        <span class="giencoder-spin-text" style="font-size:12px; color:var(--color-text-2);">加载中...</span>
      </span>
      <span class="giencoder-spin" data-component="spin" data-variant="text" data-state="loading" role="status" aria-label="提交中" style="display:flex; align-items:center; gap:8px;">
        <span class="giencoder-spin-loading giencoder-spin-loading-small"></span>
        <span class="giencoder-spin-text" style="font-size:12px; color:var(--color-primary-6);">提交中...</span>
      </span>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
