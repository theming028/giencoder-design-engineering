  <style>
    /* 交互动效样式（点击排序/行选择的状态过渡，勿并入 components.css） */
    /* 交互动效用：行选中高亮背景过渡 0.15s（选中/悬停背景作用于单元格，补过渡） */
    .giencoder-table-td { transition: background-color 0.15s var(--transition-timing-function-standard); }
    /* 右键菜单（交互动效用，勿并入 components.css）：菜单项默认深色文字，danger 项红色 */
    .giencoder-table-context-menu {
      position: fixed; z-index: 1001; min-width: 120px;
      background: var(--color-bg-5); border: 1px solid var(--color-border-2);
      border-radius: 8px; box-shadow: var(--shadow2-down); padding: 4px;
    }
    .giencoder-table-context-menu .giencoder-menu-item { height: 32px; color: var(--color-text-1); }
    .giencoder-table-context-menu .giencoder-menu-item-danger { color: var(--color-danger-6); }
    .giencoder-table-context-menu-divider { height: 1px; margin: 4px 0; background: var(--color-border-2); }
    /* 右键菜单打开时：所属行浅蓝色选中态背景（与 checkbox 选中 --color-primary-light-1 一致），显式覆盖 hover 态 */
    .giencoder-table-tr-context-active .giencoder-table-td,
    .giencoder-table-tr-context-active:hover .giencoder-table-td { background: var(--color-primary-light-1); }
    /* 分页器固定在视口底部（不贴着表格，不跟随页面内容滚动；只影响本预览页，components.css 不动以保持组件库容器无关性）。
       left=232px 避开 sticky sidebar；right=0 占满右侧；box-shadow inset 0 1px 0 充当 1px 内顶边硬线（去 border-top 避免双线）；z-index 100 低于右键菜单 1001。 */
    .giencoder-table-pagination {
      position: fixed; left: 232px; right: 0; bottom: 0;
      padding: 12px 32px; display: flex; justify-content: space-between; align-items: center;
      background: var(--color-bg-1, #fff);
      box-shadow: inset 0 1px 0 var(--color-border-1, #eaedf1);
      z-index: 100;
    }
    @media (max-width: 860px) {
      .giencoder-table-pagination { left: 0; padding: 12px 16px; }
    }
  </style>
  <script>
    /* ========== component-table：交互清单 ==========
       1) 点击表头排序：循环 none→asc→desc→none，按列值实际重排 tbody 行；多列互斥（同时只有一列处于 asc/desc）
       2) 点击行 checkbox：行高亮 giencoder-table-tr-checked + 表头全选框联动（全选/半选 indeterminate/未选）
       3) 点击表头全选框：全选 / 取消全部
    */
    (function () {
      'use strict';
      var table = document.querySelector('.giencoder-table');
      if (!table) return;

      var tbody = table.querySelector('tbody');
      if (!tbody) return;
      var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr.giencoder-table-tr'));
      var rowInputs = [];
      rows.forEach(function (tr) {
        var input = tr.querySelector(':scope > td.giencoder-table-checkbox .giencoder-checkbox-input');
        if (input) rowInputs.push(input);
      });
      var headInput = table.querySelector('thead .giencoder-checkbox-input');
      var headLabel = headInput ? headInput.closest('.giencoder-checkbox') : null;

      /* 2) 行勾选 → 行高亮 + 表头联动 */
      function syncRow(tr, checked) {
        tr.classList.toggle('giencoder-table-tr-checked', checked);
        var label = tr.querySelector('.giencoder-checkbox');
        if (label) label.classList.toggle('giencoder-checkbox-checked', checked);
      }

      function refreshHead() {
        if (!headInput) return;
        var checked = 0;
        rowInputs.forEach(function (input) { if (input.checked) checked++; });
        if (checked === 0) {
          headInput.checked = false;
          headInput.indeterminate = false;
          if (headLabel) { headLabel.classList.remove('giencoder-checkbox-checked', 'giencoder-checkbox-indeterminate'); }
        } else if (checked === rowInputs.length) {
          headInput.checked = true;
          headInput.indeterminate = false;
          if (headLabel) { headLabel.classList.add('giencoder-checkbox-checked'); headLabel.classList.remove('giencoder-checkbox-indeterminate'); }
        } else {
          headInput.checked = false;
          headInput.indeterminate = true;
          if (headLabel) { headLabel.classList.add('giencoder-checkbox-indeterminate'); headLabel.classList.remove('giencoder-checkbox-checked'); }
        }
      }

      rowInputs.forEach(function (input) {
        input.addEventListener('change', function () {
          var tr = input.closest('tr.giencoder-table-tr');
          if (tr) syncRow(tr, input.checked);
          refreshHead();
        });
      });

      /* 3) 表头全选 / 取消 */
      if (headInput) {
        headInput.addEventListener('change', function () {
          var all = headInput.checked;
          rowInputs.forEach(function (input) {
            input.checked = all;
            var tr = input.closest('tr.giencoder-table-tr');
            if (tr) syncRow(tr, all);
          });
          refreshHead();
        });
      }

      /* 1) 排序：循环 none→asc→desc→none，按列值实际重排 tbody 行；多列互斥（同时只有一列 asc/desc）
         - 本模板仅「状态」列 sortable，业务权重：已停止(0) < 待处理(1) < 运行中(2)（按业务进度而非字典序）
         - 状态写到 th 的 [data-sort]，颜色/旋转由 components.css 接管
         - 重排后刷新表头全选联动（refreshHead）；行勾选态由 rowInputs 数组与 DOM 重排天然一致
      */
      var SORT_WEIGHT = { '已停止': 0, '待处理': 1, '运行中': 2 };

      function appendInOrder(list) {
        var frag = document.createDocumentFragment();
        list.forEach(function (tr) { frag.appendChild(tr); });
        tbody.appendChild(frag);
      }

      function getSortValue(tr, th) {
        var idx = Array.prototype.indexOf.call(th.parentNode.children, th);
        var td = tr.children[idx];
        if (!td) return '';
        var tagSpan = td.querySelector('.giencoder-tag');
        return (tagSpan ? tagSpan.textContent : td.textContent).trim();
      }

      function sortByState(dir) {
        var sorted = rows.slice().sort(function (a, b) {
          var va = SORT_WEIGHT[getSortValue(a, currentTh)] != null
                 ? SORT_WEIGHT[getSortValue(a, currentTh)] : Number.NEGATIVE_INFINITY;
          var vb = SORT_WEIGHT[getSortValue(b, currentTh)] != null
                 ? SORT_WEIGHT[getSortValue(b, currentTh)] : Number.NEGATIVE_INFINITY;
          return va - vb;
        });
        if (dir === 'desc') sorted.reverse();
        appendInOrder(sorted);
      }

      var sortableThs = Array.prototype.slice.call(table.querySelectorAll('th.giencoder-table-th-sortable'));
      sortableThs.forEach(function (th) { th.setAttribute('data-sort', 'none'); });

      var currentTh = null;

      function clickSort(th) {
        var next = th.getAttribute('data-sort') === 'none' ? 'asc'
                 : th.getAttribute('data-sort') === 'asc' ? 'desc'
                 : 'none';
        sortableThs.forEach(function (other) {
          if (other !== th) other.setAttribute('data-sort', 'none');
        });
        th.setAttribute('data-sort', next);
        currentTh = th;
        if (next === 'none') {
          appendInOrder(rows);
        } else {
          sortByState(next);
        }
        refreshHead();
      }

      sortableThs.forEach(function (th) {
        th.addEventListener('click', function () { clickSort(th); });
      });

      /* 初始化：模板第 3 行已勾选 → 表头显示半选 */
      refreshHead();
    })();

    /* ========== component-table：右键菜单 ==========
       数据行右键 → 弹出自定义菜单，菜单项 = 该行操作列（.giencoder-table-operation）的按钮
       - 动态读取操作列按钮生成菜单项（结构性等价，避免两处硬编码不同步）
       - 菜单项按操作类型分组：首个 danger 操作（删除）前插入分隔线
       - Esc 关闭 / 点击外部关闭 / 滚动关闭 / resize 关闭
       - 菜单定位跟随鼠标，边界防溢出视口
    */
    (function () {
      'use strict';
      var menu = document.createElement('div');
      menu.className = 'giencoder-table-context-menu';
      menu.setAttribute('role', 'menu');
      menu.hidden = true;
      document.body.appendChild(menu);

      var activeRow = null;
      function setActiveRow(tr) {
        if (activeRow && activeRow !== tr) activeRow.classList.remove('giencoder-table-tr-context-active');
        if (tr) tr.classList.add('giencoder-table-tr-context-active');
        activeRow = tr;
      }

      function hide() {
        menu.hidden = true;
        menu.textContent = '';
        setActiveRow(null);
      }

      function buildItems(tr) {
        var op = tr.querySelector('.giencoder-table-operation');
        if (!op) return [];
        return Array.prototype.slice.call(op.querySelectorAll('button')).map(function (btn) {
          return {
            label: (btn.textContent || '').trim(),
            danger: btn.classList.contains('giencoder-btn-danger-text'),
            btn: btn
          };
        });
      }

      function show(tr, x, y) {
        var list = buildItems(tr);
        if (!list.length) { hide(); return; }
        setActiveRow(tr);
        menu.textContent = '';
        var dividerInserted = false;
        list.forEach(function (it) {
          if (it.danger && !dividerInserted) {
            var divider = document.createElement('div');
            divider.className = 'giencoder-table-context-menu-divider';
            divider.setAttribute('role', 'separator');
            menu.appendChild(divider);
            dividerInserted = true;
          }
          var item = document.createElement('div');
          item.className = 'giencoder-menu-item' + (it.danger ? ' giencoder-menu-item-danger' : '');
          item.setAttribute('role', 'menuitem');
          item.textContent = it.label;
          item.addEventListener('click', function () {
            it.btn.click();
            hide();
          });
          menu.appendChild(item);
        });
        menu.hidden = false;
        var mw = menu.offsetWidth;
        var mh = menu.offsetHeight;
        menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
        menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
      }

      document.addEventListener('contextmenu', function (e) {
        var tr = e.target && e.target.closest ? e.target.closest('tr.giencoder-table-tr') : null;
        if (!tr || !tr.closest('tbody')) return;
        if (!tr.querySelector('.giencoder-table-operation button')) return;
        e.preventDefault();
        show(tr, e.clientX, e.clientY);
      });

      document.addEventListener('mousedown', function (e) {
        if (!menu.hidden && !menu.contains(e.target)) hide();
      });

      window.addEventListener('scroll', function () { if (!menu.hidden) hide(); }, true);
      window.addEventListener('resize', function () { if (!menu.hidden) hide(); });

      document.addEventListener('keydown', function (e) {
        if (menu.hidden) return;
        if (e.key === 'Escape') { e.preventDefault(); hide(); }
      });
    })();
  </script>
    </main>
  </div>
<script src="preview-copy.js"></script>
