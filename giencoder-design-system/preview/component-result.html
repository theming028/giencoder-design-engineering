</head>
<body>

    <aside class="pv-sidebar">
      <div class="pv-nav">
        <div class="pv-menu-group">入口</div>
        <a href="../home.html">首页</a>
        <a href="../../GETTING-STARTED.html">使用说明书</a>
        <div class="pv-menu-group">组件</div>

    <main class="pv-content">
  <a class="pv-back" href="../index.html#feedback">← 返回组件库</a>
  <div class="pv-header">
    <h1>Result 结果页</h1>
    <p>源启结果页：success/error/info/warning/403/404/500 状态，用于流程终点反馈。</p>
  </div>

  <!-- ============ 变体：成功 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Success 成功</div>
    <div class="row">
      <div class="giencoder-result" data-component="result" data-variant="success" data-state="default" style="text-align:center; padding:48px 0; width:100%;">
        <div class="giencoder-result-icon" style="color:var(--color-success-6); margin-bottom:16px;">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="24" cy="24" r="20"/><path d="M14 25l7 7 13-15"/></svg>
        </div>
        <div class="giencoder-result-title" style="font-size:20px; font-weight:600; color:var(--color-text-1);">操作成功</div>
        <div class="giencoder-result-subtitle" style="font-size: 14px; color:var(--color-text-3); margin-top:8px;">项目已创建，可前往项目列表查看</div>
        <div class="giencoder-result-extra" style="margin-top:24px; display:flex; gap:12px; justify-content:center;">
          <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">返回首页</button>
          <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">查看详情</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：403 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">403 无权限</div>
    <div class="row">
      <div class="giencoder-result" data-component="result" data-variant="403" data-state="default" style="text-align:center; padding:48px 0; width:100%;">
        <div class="giencoder-result-icon" style="color:var(--color-warning-6); margin-bottom:16px;">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="10" y="20" width="28" height="20" rx="2"/><path d="M16 20v-4a8 8 0 0116 0v4"/><circle cx="24" cy="29" r="2.5"/><path d="M24 31.5V35"/></svg>
        </div>
        <div class="giencoder-result-title" style="font-size:20px; font-weight:600; color:var(--color-text-1);">403 无权限访问</div>
        <div class="giencoder-result-subtitle" style="font-size: 14px; color:var(--color-text-3); margin-top:8px;">您没有访问该页面的权限，请联系管理员开通</div>
        <div class="giencoder-result-extra" style="margin-top:24px; display:flex; gap:12px; justify-content:center;">
          <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">返回首页</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：404 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">404 页面不存在</div>
    <div class="row">
      <div class="giencoder-result" data-component="result" data-variant="404" data-state="default" style="text-align:center; padding:48px 0; width:100%;">
        <div class="giencoder-result-icon" style="color:var(--color-text-3); margin-bottom:16px;">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="24" cy="24" r="20"/><path d="M16 24h16M24 16v16"/></svg>
        </div>
        <div class="giencoder-result-title" style="font-size:20px; font-weight:600; color:var(--color-text-1);">404 页面不存在</div>
        <div class="giencoder-result-subtitle" style="font-size: 14px; color:var(--color-text-3); margin-top:8px;">您访问的页面已被移除或地址有误</div>
        <div class="giencoder-result-extra" style="margin-top:24px; display:flex; gap:12px; justify-content:center;">
          <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">返回首页</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  /* result：操作按钮点击反馈（文字临时变为"已点击"）；图标区纯展示无交互 */
  (function () {
    'use strict';

    function findAll(sel, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(sel));
    }

    findAll('.giencoder-result-extra .giencoder-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var original = btn.textContent;
        btn.textContent = '已点击';
        if (btn._timer) clearTimeout(btn._timer);
        btn._timer = setTimeout(function () { btn.textContent = original; }, 1200);
      });
    });
  })();
  </script>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
