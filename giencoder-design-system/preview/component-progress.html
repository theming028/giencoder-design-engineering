  <div class="pv-header">
    <h1>Progress 进度条</h1>
    <p>源启进度条：线性/圆形，状态色、缓冲、文字标签。</p>
  </div>

  <!-- ============ 变体：线性 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Line 线性进度条</div>
    <div class="row" style="flex-direction:column; gap:16px; align-items:stretch; max-width:560px;">
      <div class="giencoder-progress giencoder-progress-line" data-component="progress" data-variant="line" data-state="default">
        <div class="giencoder-progress-outer">
          <div class="giencoder-progress-inner">
            <div class="giencoder-progress-bar giencoder-progress-bar-primary" style="width:45%;"></div>
          </div>
        </div>
        <span class="giencoder-progress-text">45%</span>
      </div>
      <div class="giencoder-progress giencoder-progress-line" data-component="progress" data-variant="line" data-state="success">
        <div class="giencoder-progress-outer">
          <div class="giencoder-progress-inner">
            <div class="giencoder-progress-bar giencoder-progress-bar-success" style="width:100%;"></div>
          </div>
        </div>
        <span class="giencoder-progress-text giencoder-progress-text-success">
          <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg>
        </span>
      </div>
      <div class="giencoder-progress giencoder-progress-line" data-component="progress" data-variant="line" data-state="error">
        <div class="giencoder-progress-outer">
          <div class="giencoder-progress-inner">
            <div class="giencoder-progress-bar giencoder-progress-bar-danger" style="width:60%;"></div>
          </div>
        </div>
        <span class="giencoder-progress-text giencoder-progress-text-danger">60%</span>
      </div>
      <div class="giencoder-progress giencoder-progress-line" data-component="progress" data-variant="line-buffer" data-state="default">
        <div class="giencoder-progress-outer">
          <div class="giencoder-progress-inner">
            <div class="giencoder-progress-buffer" style="width:80%;"></div>
            <div class="giencoder-progress-bar giencoder-progress-bar-primary" style="width:35%;"></div>
          </div>
        </div>
        <span class="giencoder-progress-text">35%</span>
      </div>
    </div>
  </div>

  <!-- ============ 变体：圆形 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Circle 圆形进度条</div>
    <div class="row" style="gap:32px; align-items:center;">
      <div class="giencoder-progress giencoder-progress-circle" data-component="progress" data-variant="circle" data-state="default" style="position:relative; width:80px; height:80px;">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-fill-2)" stroke-width="8"/>
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-primary-6)" stroke-width="8" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="141.4" transform="rotate(-90 50 50)"/>
        </svg>
        <span class="giencoder-progress-circle-text" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--color-text-1);">50%</span>
      </div>
      <div class="giencoder-progress giencoder-progress-circle" data-component="progress" data-variant="circle" data-state="success" style="position:relative; width:80px; height:80px;">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-fill-2)" stroke-width="8"/>
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-success-6)" stroke-width="8" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
        </svg>
        <span class="giencoder-progress-circle-text" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 12 12" width="14" height="14" fill="none" stroke="var(--color-success-6)" stroke-width="2" stroke-linecap="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg>
        </span>
      </div>
      <div class="giencoder-progress giencoder-progress-circle" data-component="progress" data-variant="circle" data-state="error" style="position:relative; width:80px; height:80px;">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-fill-2)" stroke-width="8"/>
          <circle cx="50" cy="50" r="45" fill="none" stroke="var(--color-danger-6)" stroke-width="8" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="113" transform="rotate(-90 50 50)"/>
        </svg>
        <span class="giencoder-progress-circle-text" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 14px; color:var(--color-text-1);">60%</span>
      </div>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
