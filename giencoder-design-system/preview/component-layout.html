  <div class="pv-header">
    <h1>Layout 布局</h1>
    <p>源启布局骨架：Header + Sider + Content + Footer。映射自既有导航骨架。</p>
  </div>

  <!-- ============ 变体：标准后台骨架 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Standard 标准后台骨架（Header + Sider + Content）</div>
    <div class="row">
      <div class="giencoder-layout" data-component="layout" data-variant="standard" data-state="default" style="height:360px; border:1px solid var(--color-border-2); border-radius:4px; overflow:hidden; width:100%;">
        <!-- Header -->
        <div class="giencoder-layout-header" style="height:48px; background:var(--color-bg-2); border-bottom:1px solid var(--color-border-1); display:flex; align-items:center; padding:0 16px; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:12px;">
            <strong style="font-size:15px; color:var(--color-text-1);">Logo</strong>
            <span style="color:var(--color-text-3); font-size:12px;">产品名称</span>
          </div>
          <div style="display:flex; align-items:center; gap:16px; color:var(--color-text-2); font-size:12px;">
            <span>帮助</span>
            <span>通知</span>
            <span class="giencoder-avatar" style="width:24px; height:24px; border-radius:50%; background:var(--color-primary-6); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:12px;">张</span>
          </div>
        </div>
        <!-- Body -->
        <div class="giencoder-layout-body" style="display:flex; height:calc(100% - 48px);">
          <!-- Sider -->
          <div class="giencoder-layout-sider" style="width:200px; background:var(--color-menu-light-bg); border-right:1px solid var(--color-border-1); padding:8px 0; overflow-y:auto;">
            <div class="giencoder-menu giencoder-menu-vertical">
              <div class="giencoder-menu-item giencoder-menu-item-selected">工作台</div>
              <div class="giencoder-menu-item">资源管理</div>
              <div class="giencoder-menu-item">监控告警</div>
              <div class="giencoder-menu-item">系统设置</div>
            </div>
          </div>
          <!-- Content -->
          <div class="giencoder-layout-content" style="flex:1; background:var(--color-bg-1); padding:20px; overflow-y:auto;">
            <div style="font-size:18px; font-weight:600; color:var(--color-text-1); margin-bottom:12px;">工作台</div>
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px;">
              <div style="background:var(--color-bg-2); border:1px solid var(--color-border-2); border-radius:4px; padding:16px;">
                <div style="font-size:12px; color:var(--color-text-3);">今日任务</div>
                <div style="font-size:24px; font-weight:600; color:var(--color-text-1);">12</div>
              </div>
              <div style="background:var(--color-bg-2); border:1px solid var(--color-border-2); border-radius:4px; padding:16px;">
                <div style="font-size:12px; color:var(--color-text-3);">待处理</div>
                <div style="font-size:24px; font-weight:600; color:var(--color-warning-6);">3</div>
              </div>
              <div style="background:var(--color-bg-2); border:1px solid var(--color-border-2); border-radius:4px; padding:16px;">
                <div style="font-size:12px; color:var(--color-text-3);">运行中项目</div>
                <div style="font-size:24px; font-weight:600; color:var(--color-success-6);">8</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  </div>
