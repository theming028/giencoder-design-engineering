  <style>
    /* 交互动效用：Menu 交互动效
       菜单项选中/高亮：background 0.15s standard（预览内覆盖 components.css 的 0.1s 默认过渡）
       子菜单展开：content opacity 0→1 + translateY(4px→0)，0.2s standard
       子菜单收起：反向过渡 0.2s，由脚本 setTimeout 延迟隐藏 */
    .giencoder-menu-item {
      transition: background 0.15s var(--transition-timing-function-standard),
                  color 0.15s var(--transition-timing-function-standard);
    }
    .giencoder-menu-submenu-content {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity var(--transition-duration-2) var(--transition-timing-function-standard),
                  transform var(--transition-duration-2) var(--transition-timing-function-spring);
    }
    .giencoder-menu-submenu-open .giencoder-menu-submenu-content {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

            <span class="giencoder-menu-icon">

    <div class="row">

            </span>

  <script>
  (function () {
    'use strict';
    /* component-menu：交互清单
       1. 点击菜单项：同菜单内互斥选中（.giencoder-menu-item-selected）；disabled 项（.giencoder-menu-item-disabled）无效果
       2. 点击子菜单标题（.giencoder-menu-submenu-title）：展开/收起子菜单（.giencoder-menu-submenu-open 切换 + content display 切换，箭头旋转随 open 态自动生效） */
    document.querySelectorAll('.giencoder-menu-item').forEach(function (item) {
      item.addEventListener('click', function () {
        if (item.classList.contains('giencoder-menu-item-disabled')) { return; }
        var menu = item.closest('.giencoder-menu');
        if (menu) {
          menu.querySelectorAll('.giencoder-menu-item').forEach(function (other) {
            other.classList.remove('giencoder-menu-item-selected');
          });
        }
        item.classList.add('giencoder-menu-item-selected');
      });
    });
    document.querySelectorAll('.giencoder-menu-submenu-title').forEach(function (title) {
      title.addEventListener('click', function () {
        var sub = title.closest('.giencoder-menu-submenu');
        if (!sub) { return; }
        var content = sub.querySelector('.giencoder-menu-submenu-content');
        if (sub.classList.contains('giencoder-menu-submenu-open')) {
          // 收起：移除 open class 触发 0.2s 过渡（opacity/translate 反向），过渡结束后再隐藏内容
          sub.classList.remove('giencoder-menu-submenu-open');
          if (sub._collapseTimer) clearTimeout(sub._collapseTimer);
          sub._collapseTimer = setTimeout(function () {
            sub._collapseTimer = null;
            if (content && !sub.classList.contains('giencoder-menu-submenu-open')) {
              content.style.display = 'none';
            }
          }, 200);
        } else {
          // 展开：恢复显示 → 强制回流确立起始态（opacity 0 / translateY 4px）→ rAF 加 open class 触发过渡
          if (sub._collapseTimer) { clearTimeout(sub._collapseTimer); sub._collapseTimer = null; }
          if (content) {
            content.style.display = '';
            void content.offsetWidth;
          }
          requestAnimationFrame(function () {
            if (sub) sub.classList.add('giencoder-menu-submenu-open');
          });
        }
      });
    });
  })();
  </script>
