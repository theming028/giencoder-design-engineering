  <a class="pv-back" href="../index.html#data-display">← 返回组件库</a>
  <div class="pv-header">
    <h1>Skeleton 骨架屏</h1>
    <p>源启骨架屏：段落/标题/头像组合，加载占位。</p>
  </div>

  <!-- ============ 变体：段落 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Paragraph 段落骨架</div>
    <div class="row">
      <div class="giencoder-skeleton" data-component="skeleton" data-variant="paragraph" data-state="loading" style="width:480px;">
        <div class="giencoder-skeleton-paragraph">
          <span class="giencoder-skeleton-line" style="width:100%;"></span>
          <span class="giencoder-skeleton-line" style="width:92%;"></span>
          <span class="giencoder-skeleton-line" style="width:85%;"></span>
          <span class="giencoder-skeleton-line" style="width:60%;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：标题+段落 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Title + Paragraph 标题段落</div>
    <div class="row">
      <div class="giencoder-skeleton" data-component="skeleton" data-variant="title" data-state="loading" style="width:480px;">
        <div class="giencoder-skeleton-title" style="width:40%;"></div>
        <div class="giencoder-skeleton-paragraph">
          <span class="giencoder-skeleton-line" style="width:100%;"></span>
          <span class="giencoder-skeleton-line" style="width:90%;"></span>
          <span class="giencoder-skeleton-line" style="width:70%;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：头像组合 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Avatar + Text 头像文字（列表项）</div>
    <div class="row" style="flex-direction:column; gap:16px; align-items:stretch; width:480px;">
      <div class="giencoder-skeleton" data-component="skeleton" data-variant="avatar" data-state="loading" style="display:flex; gap:16px; align-items:center;">
        <span class="giencoder-skeleton-avatar"></span>
        <div class="giencoder-skeleton-paragraph" style="flex:1;">
          <span class="giencoder-skeleton-line" style="width:80%;"></span>
          <span class="giencoder-skeleton-line" style="width:50%;"></span>
        </div>
      </div>
      <div class="giencoder-skeleton" data-component="skeleton" data-variant="avatar" data-state="loading" style="display:flex; gap:16px; align-items:center;">
        <span class="giencoder-skeleton-avatar"></span>
        <div class="giencoder-skeleton-paragraph" style="flex:1;">
          <span class="giencoder-skeleton-line" style="width:90%;"></span>
          <span class="giencoder-skeleton-line" style="width:40%;"></span>
        </div>
      </div>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
