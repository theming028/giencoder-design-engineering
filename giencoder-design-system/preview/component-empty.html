</head>
<body>

  <a class="pv-back" href="../index.html#data-display">← 返回组件库</a>
  <div class="pv-header">
    <h1>Empty 空状态</h1>
    <p>源启空状态：图标/文案/操作按钮，用于列表、筛选结果为空场景。</p>
  </div>

  <!-- ============ 变体：基础空状态 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Default 基础空状态</div>
    <div class="row">
      <div class="giencoder-empty" data-component="empty" data-variant="default" data-state="default" style="padding:48px 0; text-align:center; width:100%;">
        <div class="giencoder-empty-image">
          <svg viewBox="0 0 80 80" width="80" height="80" fill="none">
            <circle cx="40" cy="40" r="32" stroke="var(--color-fill-3)" stroke-width="2" stroke-dasharray="4 4"/>
            <path d="M28 40h24M40 28v24" stroke="var(--color-fill-3)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="giencoder-empty-description" style="color:var(--color-text-3); font-size: 14px; margin-top:16px;">暂无数据</div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：带操作 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">With Action 带操作空状态</div>
    <div class="row">
      <div class="giencoder-empty" data-component="empty" data-variant="action" data-state="default" style="padding:48px 0; text-align:center; width:100%;">
        <div class="giencoder-empty-image">
          <svg viewBox="0 0 80 80" width="80" height="80" fill="none">
            <circle cx="40" cy="40" r="32" stroke="var(--color-fill-3)" stroke-width="2" stroke-dasharray="4 4"/>
            <path d="M28 40h24M40 28v24" stroke="var(--color-fill-3)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="giencoder-empty-description" style="color:var(--color-text-3); font-size: 14px; margin-top:16px;">还没有创建任何项目</div>
        <div class="giencoder-empty-action" style="margin-top:16px;">
          <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">新建项目</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 变体：筛选无结果 ============ -->
  <div class="pv-section">
    <div class="pv-section__title">Search Empty 筛选无结果</div>
    <div class="row">
      <div class="giencoder-empty" data-component="empty" data-variant="search" data-state="default" style="padding:48px 0; text-align:center; width:100%;">
        <div class="giencoder-empty-image">
          <svg viewBox="0 0 80 80" width="80" height="80" fill="none">
            <circle cx="34" cy="34" r="20" stroke="var(--color-fill-3)" stroke-width="2"/>
            <path d="M48 48l14 14" stroke="var(--color-fill-3)" stroke-width="2" stroke-linecap="round"/>
            <path d="M28 34h12M34 28v12" stroke="var(--color-fill-4)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="giencoder-empty-description" style="color:var(--color-text-3); font-size: 14px; margin-top:16px;">未找到匹配"关键词"的结果</div>
        <div class="giencoder-empty-action" style="margin-top:16px;">
          <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">清除筛选</button>
        </div>
      </div>
    </div>
  </div>
    </main>
  </div>
<script src="preview-copy.js"></script>
</body>
</html>
