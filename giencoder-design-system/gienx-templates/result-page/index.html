<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>操作结果 · 结果页样板</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../../components.css">
  <style>
    /* ═══ 页面级布局样式（仅用 Design Token，禁止硬编码 hex） ═══ */
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font-family: var(--font-family); }

    /* ---- 结果页居中容器 ---- */
    .giencoder-result-wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .giencoder-result { text-align: center; padding: var(--spacing-12) 0; }
    .giencoder-result-icon { margin-bottom: var(--spacing-7); color: var(--color-success-6); }
    .giencoder-result-title { font-size: var(--font-size-title-2); font-weight: 600; color: var(--color-text-1); }
    .giencoder-result-subtitle { font-size: var(--font-size-body-3); color: var(--color-text-3); margin-top: var(--spacing-4); }
    .giencoder-result-extra { margin-top: var(--spacing-9); display: flex; gap: var(--spacing-4); justify-content: center; }

    /* ---- 结果附加信息卡片 ---- */
    .giencoder-result-meta {
      margin-top: var(--spacing-9); width: 360px;
      background: var(--color-bg-2); border: 1px solid var(--color-border-2);
      border-radius: var(--border-radius-medium); padding: var(--spacing-7);
    }
    .giencoder-result-meta-row { display: flex; justify-content: space-between; padding: var(--spacing-3) 0; font-size: var(--font-size-body-3); }
    .giencoder-result-meta-row + .giencoder-result-meta-row { border-top: 1px solid var(--color-border-1); }
    .giencoder-result-meta-label { color: var(--color-text-3); }
    .giencoder-result-meta-value { color: var(--color-text-1); }
  </style>
</head>
<body>
<div style="width:100%; height:100vh; overflow:hidden; display:flex; flex-direction:column;">
  <header class="giencoder-top-nav" style="height:48px; background:var(--color-bg-2); box-shadow:var(--shadow1-down); display:flex; align-items:center; justify-content:space-between; padding:0 16px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <strong style="font-size:15px; color:var(--color-text-1);">源启</strong>
      <span style="color:var(--color-text-3); font-size:12px;">中电金信 · 云服务平台</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px; font-size:12px; color:var(--color-text-2);">
      <span>帮助</span><span>通知</span>
      <span style="width:24px;height:24px;border-radius:50%;background:var(--color-primary-6);color:var(--color-white);display:flex;align-items:center;justify-content:center;font-size:12px;">张</span>
    </div>
  </header>
  <div style="display:flex; flex:1; overflow:hidden;">
    <aside class="giencoder-sidenav" style="width:200px; background:var(--color-menu-light-bg); border-right:1px solid var(--color-border-1); padding:8px 0; overflow-y:auto;">
      <div class="giencoder-menu giencoder-menu-vertical">
        <div class="giencoder-menu-group-title">总览</div>
        <div class="giencoder-menu-item giencoder-menu-item-selected">工作台</div>
        <div class="giencoder-menu-item">资源管理</div>
        <div class="giencoder-menu-item">监控告警</div>
        <div class="giencoder-menu-group-title">系统</div>
        <div class="giencoder-menu-item">系统设置</div>
      </div>
    </aside>
    <main style="flex:1; overflow-y:auto; background:var(--color-bg-1); padding:20px;">

      <!-- ============ 居中 Result：成功图标 + 标题 + 副标题 + 按钮 ============ -->
      <div class="giencoder-result-wrap">
        <div class="giencoder-result">
          <div class="giencoder-result-icon">
            <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="24" cy="24" r="20"/>
              <path d="M14 25l7 7 13-15"/>
            </svg>
          </div>
          <div class="giencoder-result-title">操作成功</div>
          <div class="giencoder-result-subtitle">资源「订单中心微服务」已创建完成，即将开始部署</div>
          <div class="giencoder-result-extra">
            <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">返回首页</button>
            <button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">查看详情</button>
          </div>
        </div>

        <!-- ============ 附加信息：本次操作摘要（可选区块） ============ -->
        <div class="giencoder-result-meta">
          <div class="giencoder-result-meta-row">
            <span class="giencoder-result-meta-label">资源名称</span>
            <span class="giencoder-result-meta-value">订单中心微服务</span>
          </div>
          <div class="giencoder-result-meta-row">
            <span class="giencoder-result-meta-label">资源 ID</span>
            <span class="giencoder-result-meta-value">res-20260828-001</span>
          </div>
          <div class="giencoder-result-meta-row">
            <span class="giencoder-result-meta-label">部署环境</span>
            <span class="giencoder-result-meta-value">生产环境</span>
          </div>
          <div class="giencoder-result-meta-row">
            <span class="giencoder-result-meta-label">完成时间</span>
            <span class="giencoder-result-meta-value">2026/08/28 10:30</span>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
<!-- 模板说明: 本页面为 result-page 页面样板，生成新页面时复制此文件修改内容区 -->
