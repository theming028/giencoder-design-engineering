<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>演示 · 表单/弹窗/指标</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../../components.css">
  <link rel="stylesheet" href="../../gienx-templates/ui-controls.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font-family: var(--font-family); }
    .giencoder-page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--spacing-7); flex-wrap: wrap; gap: var(--spacing-4); }
    .giencoder-page-header-title { font-size: var(--font-size-title-2); font-weight: 600; color: var(--color-text-1); margin: 0; }
    .giencoder-page-header-subtitle { font-size: var(--font-size-body-3); color: var(--color-text-3); margin: 0; }
    .giencoder-page-header > div:first-child { display: flex; align-items: baseline; gap: var(--spacing-6); }
    .giencoder-page-header-extra { display: flex; align-items: center; gap: var(--spacing-4); }
    .giencoder-filter-bar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-4); padding: var(--spacing-7); margin-bottom: var(--spacing-7); background: var(--color-bg-2); border: 1px solid var(--color-border-2); border-radius: var(--border-radius-medium); }
    .giencoder-filter-item { display: inline-flex; flex-direction: column; gap: var(--spacing-2); }
    .giencoder-filter-label { font-size: var(--font-size-body-1); color: var(--color-text-3); }
    .giencoder-filter-actions { display: inline-flex; gap: var(--spacing-3); margin-left: auto; align-items: flex-end; }
    .giencoder-table-operation { white-space: nowrap; text-align: left; }
  </style>
</head>
<body>
<div style="width:100%; height:100vh; overflow:hidden; display:flex; flex-direction:column;">
  <header class="giencoder-top-nav" style="height:48px; background:var(--color-bg-2); box-shadow:var(--shadow1-down); display:flex; align-items:center; justify-content:space-between; padding:0 16px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <strong style="font-size:15px; color:var(--color-text-1);">源启</strong>
      <span style="color:var(--color-text-3); font-size:12px;">云服务平台</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px; font-size:12px; color:var(--color-text-2);">
      
      <span style="width:24px;height:24px;border-radius:50%;background:var(--color-primary-6);color:var(--color-white);display:flex;align-items:center;justify-content:center;font-size:12px;">张</span>
    </div>
  </header>
  <div style="display:flex; flex:1; overflow:hidden;">
    <aside class="giencoder-sidenav" style="width:200px; background:var(--color-menu-light-bg); border-right:1px solid var(--color-border-1); padding:8px 0; overflow-y:auto;">
      <div class="giencoder-menu giencoder-menu-vertical">
        <div class="giencoder-menu-group-title">总览</div>
        <div class="giencoder-menu-item">概览大屏</div>
        <div class="giencoder-menu-item">指标看板</div>
        <div class="giencoder-menu-group-title">资源</div>
        <div class="giencoder-menu-item giencoder-menu-item-selected">资源列表</div>
        <div class="giencoder-menu-item">资源详情</div>
      </div>
    </aside>
    <main style="flex:1; overflow-y:auto; background:var(--color-bg-1); padding:20px;">
<div class="giencoder-page-header">
        <div>
          <h2 class="giencoder-page-header-title">创建资源</h2>
          <div class="giencoder-page-header-subtitle">配置新云资源实例</div>
        </div>
        <div class="giencoder-page-header-extra">
          <button class="giencoder-btn giencoder-btn-size-default">返回列表</button>
        </div>
      </div>
<div class="giencoder-form" data-component="form" data-layout="vertical" data-state="default">
  <div class="giencoder-form-item" data-component="form-item">
        <label class="giencoder-form-label giencoder-form-label-required">资源名称</label>
        <div class="giencoder-form-control"><div class="giencoder-input-wrapper" style="width:320px;">
            <input class="giencoder-input" placeholder="请输入资源名称">
          </div></div>
      </div>
<div class="giencoder-form-item" data-component="form-item">
        <label class="giencoder-form-label giencoder-form-label-required">所属分组</label>
        <div class="giencoder-form-control"><div class="giencoder-select" data-component="select" data-variant="single" data-state="default" style="width:240px;">
            <div class="giencoder-select-view" tabindex="0" role="combobox" aria-expanded="false" aria-haspopup="listbox">
              <span class="giencoder-select-view-text">生产环境</span>
              <span class="giencoder-select-suffix">
                <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg>
              </span>
            </div>
            <div class="giencoder-select-popup" style="display:none;">
              <ul class="giencoder-select-option-list" role="listbox">
<li class="giencoder-select-option giencoder-select-option-selected" role="option" aria-selected="true">生产环境</li>
<li class="giencoder-select-option" role="option" aria-selected="false">预发布</li>
<li class="giencoder-select-option" role="option" aria-selected="false">测试环境</li>
              </ul>
            </div>
          </div>
        <div class="giencoder-form-help">选择资源归属的业务分组</div></div>
      </div>
<div class="giencoder-form-item" data-component="form-item">
        <label class="giencoder-form-label">环境类型</label>
        <div class="giencoder-form-control"><label class="giencoder-radio" data-component="radio">
        <input type="radio" class="giencoder-radio-input" name="env" checked>
        <span class="giencoder-radio-mask"></span>
        <span>生产</span>
      </label>
<label class="giencoder-radio" data-component="radio">
        <input type="radio" class="giencoder-radio-input" name="env">
        <span class="giencoder-radio-mask"></span>
        <span>测试</span>
      </label></div>
      </div>
<div class="giencoder-form-item" data-component="form-item">
        <label class="giencoder-form-label">自动部署</label>
        <div class="giencoder-form-control"><button class="giencoder-switch giencoder-switch-checked" role="switch" aria-checked="true" data-component="switch" data-variant="default" data-state="checked">
        <span class="giencoder-switch-handle"></span>
        <span class="giencoder-switch-text">开</span>
      </button></div>
      </div>
<div class="giencoder-form-item" data-component="form-item">
        <label class="giencoder-form-label">同意条款</label>
        <div class="giencoder-form-control"><label class="giencoder-checkbox giencoder-checkbox-checked" data-component="checkbox" data-variant="default" data-state="checked">
        <input type="checkbox" class="giencoder-checkbox-input" checked>
        <span class="giencoder-checkbox-mask"></span>
        <span class="giencoder-checkbox-text">我已阅读并同意部署协议</span>
      </label></div>
      </div>
</div>
<div class="giencoder-tabs giencoder-tabs-line" data-component="tabs" data-variant="line" data-state="default" style="width:100%;">
        <div class="giencoder-tabs-header" role="tablist">
          <div class="giencoder-tabs-tab giencoder-tabs-tab-active" role="tab" aria-selected="true" tabindex="0">基础信息</div><div class="giencoder-tabs-tab" role="tab" aria-selected="false" tabindex="-1">高级配置</div>
        </div>
        <div class="giencoder-tabs-content" role="tabpanel">
          <div class="giencoder-form" data-component="form" data-layout="vertical" data-state="default">
  <div class="giencoder-form-item" data-component="form-item">
        <label class="giencoder-form-label">高级参数</label>
        <div class="giencoder-form-control"><div class="giencoder-input-wrapper" style="width:320px;">
            <input class="giencoder-input" placeholder="例如 --no-cache">
          </div></div>
      </div>
</div>
        </div>
      </div>
<div class="giencoder-statistic" data-component="statistic" data-variant="default" data-state="default" style="background:var(--color-bg-2);border:1px solid var(--color-border-2);border-radius:var(--border-radius-large);padding:16px 20px;min-width:160px;">
        <div class="giencoder-statistic-title" style="font-size:12px;color:var(--color-text-3);">预估费用</div>
        <div class="giencoder-statistic-content" style="font-size:28px;font-weight:600;color:var(--color-text-1);margin-top:8px;display:flex;align-items:baseline;">
          <span class="giencoder-statistic-value">3,269</span><span class="giencoder-statistic-suffix" style="font-size:14px;color:var(--color-text-3);margin-left:4px;">元/月</span><span class="giencoder-statistic-compare" style="font-size:12px;color:var(--color-warning-6);margin-left:8px;">▲+12%</span>
        </div>
      </div>
<button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">提交</button>
<button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default">暂存</button>
<button class="giencoder-btn giencoder-btn-secondary giencoder-btn-size-default giencoder-btn-danger" data-open-target="#demo-modal"><svg viewBox="0 0 12 12" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
            打开弹窗</button>
<div class="giencoder-modal-mask" data-component="modal" data-state="closed" id="demo-modal" style="display:none; position:fixed; inset:0; z-index:1000; align-items:flex-start; justify-content:center; padding:48px; overflow-y:auto;">
      <div class="giencoder-modal" role="dialog" aria-modal="true" aria-label="确认删除资源" style="width:420px; background:var(--color-bg-2); box-shadow:var(--shadow3-down); margin:0 auto;">
        <div class="giencoder-modal-header">
          <div class="giencoder-modal-title">确认删除资源</div>
          <button class="giencoder-modal-close-btn" aria-label="关闭" data-close>
          <svg viewBox="0 0 12 12" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
        </div>
        <div class="giencoder-modal-content"><span class="giencoder-tag giencoder-tag-light giencoder-tag-danger">警告</span>
<div class="giencoder-input-wrapper">
            <input class="giencoder-input" value="将删除资源「demo-01」" readonly>
          </div>
        </div>
      <div class="giencoder-modal-footer">
          <button class="giencoder-btn giencoder-btn-primary giencoder-btn-size-default">确认删除</button>
      </div>
      </div>
    </div>
<div class="giencoder-drawer-mask" data-component="drawer" data-state="closed" id="demo-drawer" style="display:none; position:fixed; inset:0; z-index:1000; background:var(--color-mask-bg);">
      <div class="giencoder-drawer" role="dialog" aria-modal="true" aria-label="审计日志" style="position:absolute; top:0; right:0; width:400px; height:100%; background:var(--color-bg-2); box-shadow:var(--shadow3-down);">
        <div class="giencoder-drawer-header">
          <div class="giencoder-drawer-title">审计日志</div>
          <button class="giencoder-modal-close-btn" aria-label="关闭" data-close>
          <svg viewBox="0 0 12 12" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
        </div>
        <div class="giencoder-drawer-content"><div class="giencoder-table-container" style="padding:0 16px;">
          <table class="giencoder-table-content">
            <thead>
              <tr class="giencoder-table-tr">
                                <th class="giencoder-table-th">操作</th>
                <th class="giencoder-table-th">时间</th>
              </tr>
            </thead>
            <tbody>
                            <tr class="giencoder-table-tr">
                <td class="giencoder-table-td">
                  创建资源
                </td>
                <td class="giencoder-table-td">
                  2026-08-01 10:00
                </td>
              </tr>
              <tr class="giencoder-table-tr">
                <td class="giencoder-table-td">
                  修改配置
                </td>
                <td class="giencoder-table-td">
                  2026-08-02 11:30
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        </div>
      </div>
    </div>
    </main>
  </div>
</div>
<script src="../../gienx-templates/ui-controls.js"></script>
<script>
(function () {
  document.addEventListener('click', function (ev) {
    var openBtn = ev.target.closest && ev.target.closest('[data-open-target]');
    if (openBtn) {
      var id = openBtn.getAttribute('data-open-target');
      var ov = document.getElementById(id);
      if (ov) { ov.style.display = (ov.classList.contains('giencoder-modal-mask') ? 'flex' : 'block'); }
    }
    var closeBtn = ev.target.closest && ev.target.closest('[data-close]');
    if (closeBtn) {
      var mask = closeBtn.closest('.giencoder-modal-mask, .giencoder-drawer-mask');
      if (mask) mask.style.display = 'none';
    }
    if (ev.target.classList && ev.target.classList.contains('giencoder-modal-mask')) {
      ev.target.style.display = 'none';
    }
  });
})();
</script>
</body>
</html>
